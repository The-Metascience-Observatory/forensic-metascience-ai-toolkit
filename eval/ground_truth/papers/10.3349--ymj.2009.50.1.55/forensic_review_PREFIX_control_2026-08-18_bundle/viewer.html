<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Efficacy of Postoperative Prophylactic Antibiotics in Orthognathic Surgery: A Prospective Study in Le Fort I Osteotomy and Bilateral Intraoral Vertical Ramus Osteotomy -- forensic review</title>
<style>
/* Deliberately plain: a rendered markdown document, not a dashboard. No cards,
   no rounded panels, no coloured chips. Severity is conveyed by a word and a
   rule, which is how a journal would do it. */
/* `--ok` exists only for research PRACTICE, which is the one place this
   document reports good news. Severity has no level for "this was done well",
   and borrowing one would imply a finding where there is none. */
/* `--hit` is the highlight ground. It was USED and never DEFINED, so the
   inline fallback was the only value that ever applied and no theme could
   change it -- which is how dark mode ended up painting #e4e4e4 text on a
   cream highlight. The value is deliberately the SAME in both themes, because
   the rule that paints it also pins a dark foreground: a highlight that
   inverts with the theme is a highlight that has to be re-checked twice. */
:root{ --bg:#fff; --fg:#111; --muted:#555; --rule:#d8d8d8; --link:#0645ad;
       --code:#f5f5f5; --flag:#8a1c12; --warn:#8a5200; --ok:#1d6b3f;
       --hit:#fdf3c8; }
@media (prefers-color-scheme: dark){
  :root{ --bg:#121212; --fg:#e4e4e4; --muted:#a0a0a0; --rule:#333;
         --link:#7aa6da; --code:#1c1c1c; --flag:#e08b7f; --warn:#d3a04a;
         --ok:#6fb98a; --hit:#fdf3c8; } }
:root[data-theme="dark"]{ --bg:#121212; --fg:#e4e4e4; --muted:#a0a0a0; --rule:#333;
  --link:#7aa6da; --code:#1c1c1c; --flag:#e08b7f; --warn:#d3a04a; --ok:#6fb98a;
  --hit:#fdf3c8; }
:root[data-theme="light"]{ --bg:#fff; --fg:#111; --muted:#555; --rule:#d8d8d8;
  --link:#0645ad; --code:#f5f5f5; --flag:#8a1c12; --warn:#8a5200; --ok:#1d6b3f;
  --hit:#fdf3c8; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.6 Georgia,"Times New Roman",serif}
a{color:var(--link)}
#wrap{display:flex;align-items:flex-start}
nav{width:210px;flex:0 0 210px;padding:24px 0 40px;position:sticky;top:0;
  height:100vh;overflow-y:auto;border-right:1px solid var(--rule);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;
  transition:width .12s ease}
body.navhid nav{width:0;flex-basis:0;padding:0;overflow:hidden;border-right:0}
#navtoggle{position:fixed;top:8px;left:8px;z-index:20;font:12px system-ui,sans-serif;
  background:var(--bg);color:var(--muted);border:1px solid var(--rule);
  padding:3px 8px;cursor:pointer;line-height:1}
nav b{display:block;padding:0 18px 8px;color:var(--muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;font-size:11px}
/* FLEX, NOT FLOAT. The count used to be `float:right` inside a block anchor,
   and a float only stays on the line if the line has room for it. "Questions
   for the authors" fills the sidebar, so its `7` was pushed past that anchor's
   single-line box and rendered ON THE ROW BELOW -- landing beside the Findings
   count as `9` with a superscript `7`, while its own row appeared to have no
   count at all. Found only by looking at the rendered page: the DOM is
   correct, one badge per anchor, every number right. Flex keeps the badge
   inside its own anchor whatever the label's length, and `baseline` keeps it
   on the first line when a label wraps. */
nav a{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:4px 18px;color:var(--fg);text-decoration:none}
nav a:hover{text-decoration:underline}
nav a.active{font-weight:700}
nav .c{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
main{flex:1;min-width:0;padding:24px 40px 120px;max-width:60em}
section{display:none} section.on{display:block}
h1{font-size:26px;margin:0 0 2px;font-weight:normal}
h2{font-size:21px;margin:26px 0 6px;font-weight:normal;
   border-bottom:1px solid var(--rule);padding-bottom:4px}
h3{font-size:17px;margin:20px 0 4px;font-weight:700}
h4{font-size:15px;margin:14px 0 3px}
p{margin:8px 0}
.muted{color:var(--muted);font-size:14px}
/* The one sentence a reader must not skip in a section whose heading is a
   count. Full size and full contrast, deliberately -- `.muted` would sink it
   below the number it exists to qualify. */
.lede{font-size:16px;margin:10px 0 14px}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px;
  font-family:system-ui,-apple-system,sans-serif}
th,td{border:1px solid var(--rule);padding:5px 8px;text-align:left;vertical-align:top}
th{font-weight:600;background:transparent;cursor:pointer;white-space:nowrap}
th:after{content:"";color:var(--muted);font-size:10px}
th.asc:after{content:" \25B2"} th.desc:after{content:" \25BC"}
.scroll{overflow-x:auto}
/* Key/value block: row headers down the left, no header row at all, and no
   sort cursor because there is nothing to sort a fixed schema into. */
table.kv th{width:1%;white-space:nowrap;font-weight:600;cursor:default;
  color:var(--muted)}
table.kv th:after{content:""}
table.kv td{width:99%}
/* File tree. Indentation carries the directory, so the directory name is not
   repeated on every row. */
ul.tree{list-style:none;padding-left:0;margin:8px 0;font-size:14px}
ul.tree ul{list-style:none;padding-left:18px;margin:0;
  border-left:1px solid var(--rule)}
ul.tree li{padding:2px 0}
ul.tree .dir{font-weight:600}
ul.tree .what{color:var(--muted);margin-left:8px}
/* Sankey. Ribbons take the severity colour of the verdict they flow into, so
   the diagram reads the same way as the rest of the document. */
svg.sankey{min-width:640px;font-family:system-ui,sans-serif;font-size:11px}
svg.sankey text{fill:var(--fg)}
svg.sankey .node{fill:var(--muted)}
svg.sankey rect.impossible,svg.sankey rect.highly_suspicious{fill:var(--flag)}
svg.sankey rect.suspicious{fill:var(--warn)}
svg.sankey .ribbon{fill:var(--muted);opacity:.30}
svg.sankey .ribbon:hover{opacity:.62}
svg.sankey .ribbon.impossible,svg.sankey .ribbon.highly_suspicious{fill:var(--flag)}
svg.sankey .ribbon.suspicious{fill:var(--warn)}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
code{background:var(--code);padding:0 3px;font-size:13px}
pre{background:var(--code);padding:9px 11px;overflow-x:auto;font-size:13px;
  white-space:pre-wrap;word-break:break-word;border-left:2px solid var(--rule);margin:6px 0}
blockquote{margin:8px 0;padding:2px 0 2px 14px;border-left:2px solid var(--rule);
  color:var(--muted)}
.finding{border:1px solid var(--rule);border-left:3px solid var(--flag);
  padding:14px 18px;margin:14px 0}
.finding.consistent,.finding.indeterminate{border-left-color:var(--rule)}
.finding h3{margin:4px 0 2px;font-size:16px;font-weight:600}
.finding p.sub{margin:0 0 6px;font-size:13.5px;color:var(--muted)}
/* The plain reading sits ABOVE the technical detail and in the body colour, so
   a reader who cannot use the statistics never has to scroll past them to find
   out whether the paper's claim survives. */
.finding p.plain{margin:2px 0 6px;font-size:14.5px}
/* Severity words are set in the body face at body size. They were 11px, bold,
   letter-spaced and UPPERCASE, which made every occurrence of the word shout
   -- including inside running table cells where it is just a value like any
   other. Colour alone carries the level; the rule weights below carry it again
   for anyone who cannot use the colour. */
.sev{color:var(--flag)}
.sev.consistent,.sev.indeterminate{color:var(--muted)}
/* Per level, not just flagged-vs-muted. The rule above was binary, so an
   `impossible` finding and a `suspicious` one were drawn identically and the
   only thing separating them was the word itself. Rule WEIGHT carries the
   ladder, so the distinction survives greyscale printing and colour-blind
   readers; the amber for `suspicious` additionally keeps the two accusatory
   levels visually apart from the one that is merely a query. */
.finding.impossible{border-left-width:6px}
.finding.highly_suspicious{border-left-width:4px}
.finding.suspicious{border-left-width:2px;border-left-color:var(--warn)}
.sev.suspicious{color:var(--warn)}
/* Coded words carry their definition in a title. The dotted underline is the
   affordance that one is there, and the help cursor says the word answers a
   question; clicking jumps to the codebook (the data-cb handler at the end
   of the script). Without a visible cue a hover glossary is invisible, which
   is the same as absent. */
.sev[title],.def[title]{cursor:help;text-decoration:underline dotted;
  text-underline-offset:2px}
/* The headline sentence. Set at reading size in the body face, NOT enlarged:
   it is the review's one-sentence conclusion, and a display size would make it
   a pull quote -- which is exactly the register a document about restraint
   must not use for its most accusatory sentence. */
p.headline{margin:6px 0 10px;font-size:16.5px}
/* What the review could not do. Deliberately the same weight as everything
   else on the page: an apologetics box, greyed and boxed off, is read as
   boilerplate and skipped, and these lines are load-bearing. */
ul.limits{margin:8px 0;padding-left:20px;font-size:14.5px}
ul.limits li{margin:5px 0}
/* One integrity card. `summary` carries the tool name and its evidence class;
   everything that qualifies the class is inside, one click down. */
details.card{border-left:2px solid var(--rule);padding:2px 0 2px 12px;margin:8px 0}
details.card summary{cursor:pointer}
details.card .ev{color:var(--muted);font-family:system-ui,sans-serif;font-size:13px}
details.card ul{margin:4px 0 8px 18px;padding:0}
details.card li{margin:3px 0}
table.cardparams{font-size:13px}
/* What a finding CHANGES, printed beside how wrong it is. A consequence a
   tool computed is set in the body colour; one the model asserted stays
   muted, so the two are never read as carrying the same weight. */
.conseq{font-family:system-ui,sans-serif;font-size:12.5px;color:var(--muted);
  margin:6px 0 0}
.conseq.computed{color:var(--fg)}
.conseq b{font-weight:600}
/* A tool result overruled with no reason given. Marked, not hidden. */
.conseq.unexplained{color:var(--flag)}
dl{display:grid;grid-template-columns:10.5em 1fr;gap:6px 16px;margin:10px 0;
  font-size:14px;align-items:baseline}
dt{color:var(--muted);font-family:system-ui,sans-serif;font-size:12.5px;
  text-transform:uppercase;letter-spacing:.04em}
dd{margin:0;min-width:0}
/* Nested key/value pairs render as aligned rows with NO borders. Bordered
   sub-tables inside a definition list made several independent tables look
   like one broken one, with cell edges landing at different positions. */
.kvlist{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;margin:0}
.kvlist .k{color:var(--muted);font-size:13px;white-space:nowrap}
.kvlist .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.finding ul{margin:2px 0 2px 16px;padding:0}
.finding li{margin:2px 0}
.tools{margin:6px 0 4px;font-family:system-ui,sans-serif;font-size:13px}
input[type=search],select{font:13px system-ui,sans-serif;padding:4px 6px;
  border:1px solid var(--rule);background:var(--bg);color:var(--fg)}
details{margin:4px 0;border-bottom:1px solid var(--rule)}
summary{cursor:pointer;padding:5px 0;font-family:system-ui,sans-serif;font-size:13.5px}
#theme{position:fixed;top:8px;right:12px;font:11px system-ui,sans-serif;
  background:var(--bg);color:var(--muted);border:1px solid var(--rule);
  padding:3px 8px;cursor:pointer}
/* Resizable, PDF two-thirds by default: the PDF is the thing being read and
   the text is the thing being checked against it. */
.split{display:flex;height:80vh;min-height:420px}
.split>div{min-width:0;display:flex;flex-direction:column;border:1px solid var(--rule)}
#pane-pdf{flex:0 0 66%} #pane-txt{flex:1 1 auto}
#dragbar{flex:0 0 7px;cursor:col-resize;background:transparent;position:relative}
#dragbar:before{content:"";position:absolute;left:3px;top:0;bottom:0;width:1px;
  background:var(--rule)}
#dragbar:hover:before,#dragbar.on:before{background:var(--link);width:2px}
.split h4{margin:0;padding:5px 8px;border-bottom:1px solid var(--rule);
  font-family:system-ui,sans-serif;font-size:12px;color:var(--muted);font-weight:600}
.split .pane{flex:1;overflow:auto;min-height:0}
.split embed,.split iframe{width:100%;height:100%;border:0}
.pdfpage{position:relative;margin:0 auto 10px;width:100%;max-width:900px}
.pdfpage img{display:block;width:100%;height:auto}
.pdfpage .ln{position:absolute;cursor:pointer}
.pdfpage .ln:hover{background:rgba(255,214,0,.28)}
.pdfpage .ln.hit{background:rgba(255,214,0,.55);outline:1px solid #d4a200}
.pgnum{font:11px system-ui,sans-serif;color:var(--muted);padding:2px 4px}
/* The source pane for documents that are NOT PDFs. A supplement can be an
   image, a publisher HTML page, an EPUB, a spreadsheet or plain text, and each
   one is shown on its own terms rather than as an empty PDF viewer. */
.docimg{display:block;max-width:100%;height:auto;margin:0 auto}
.docbody{padding:8px 12px;font-size:12.5px;font-family:system-ui,sans-serif}
.docbody table{border-collapse:collapse;font-size:.95em}
.docbody th,.docbody td{border:1px solid var(--rule);padding:3px 6px}
.docbody h4.epubdoc{margin:12px 0 4px;font:600 11px system-ui,sans-serif;
  color:var(--muted);border-bottom:1px solid var(--rule)}
/* The highlight the DOM-based click sync lands on, in the source pane. Carries
   its own foreground for the same reason `mark.hit` does: a background alone
   inherits the page colour and paints pale-on-pale in dark mode, exactly when
   the reader is following a finding to its source. */
.srchit,.srchit *{background:#ffe066;color:#111}
/* WHY A DOCUMENT COULD NOT BE SHOWN. Never silent: an empty pane reads as an
   empty document, and for a supplement that is the difference between "the
   authors published nothing" and "our reader could not open it". */
.docnote,.docfail{font:12px system-ui,sans-serif;padding:8px 12px;color:var(--muted)}
.docfail{border-top:1px solid var(--rule);background:var(--code)}
.docfail p{margin:0 0 6px}
#srcsync,#srctxtdoc{font-weight:400;font-size:11px}
/* A HIGHLIGHT CARRIES ITS OWN FOREGROUND, in both themes.
   Setting only a background inherits the page's text colour, so in dark mode
   the row flash painted pale-on-pale and the highlighted row became the LEAST
   readable thing on screen -- the exact opposite of what a highlight is for.
   `mark.hit` always set `color`; `tr.flash` did not, and `tr.flash` is what
   click-to-jump uses, so the failure appeared precisely when a reader followed
   a finding to its source in the paper. Descendants are forced as well: a cell
   containing a styled span would otherwise keep its own light colour and stay
   invisible on the yellow. */
mark.hit,mark.hit *{background:#ffe066;color:#111}
tr.flash td,tr.flash td *{background:#ffe066;color:#111}
/* SAME BUG, TWO MORE PLACES, found 2026-08-10 by reading the rendered pane
   rather than the CSS. `.blk.hit` and `.tgt` -- the block the text-search sync
   lands on, and the table a finding jumps to -- both set a cream background
   through `var(--hit,#fdf3c8)` and no foreground. `--hit` is defined NOWHERE,
   so the fallback is the only value that ever applies, and in dark mode it put
   #e4e4e4 text on a #fdf3c8 ground. These are the two highlights a reader hits
   when they follow a finding into the paper, which is the one moment the
   highlight has a job to do. */
.rendered .blk.hit,.rendered .blk.hit *,
.rendered .tgt,.rendered .tgt *{color:#111}
/* Practice marks. Colour is the SEMANTIC scale, separate from severity: a
   practice followed is good news, which no severity level expresses. */
.mark{font-weight:600}
.mark.yes{color:var(--ok)} .mark.no{color:var(--flag)}
.mark.partial{color:var(--warn)} .mark.unknown{color:var(--muted)}
.split pre{margin:0;border:0;background:transparent;padding:8px 10px;font-size:12.5px}
/* Rendered markdown in the extraction pane. Tables get borders because the
   whole point of this view is seeing whether the table survived extraction. */
.rendered{padding:8px 12px;font-size:12.5px;font-family:system-ui,sans-serif}
.rendered table{font-size:.95em}
.rendered th,.rendered td{border:1px solid var(--rule);padding:3px 6px;cursor:default}
.rendered th:after{content:""}
.rendered h1,.rendered h2,.rendered h3{font-size:1.05em;margin:10px 0 4px}
/* The controls above the panes. */
.srcbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:6px 0}
.srcbar label{font:12px system-ui,sans-serif;color:var(--muted)}
.srcbar .spacer{flex:1 1 auto}
.preview{display:flex;flex-direction:column;gap:1px;margin:0 0 6px;max-height:190px;
  overflow:auto;border:1px solid var(--rule)}
.preview button{text-align:left;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;
  background:transparent;color:var(--fg);border:0;border-bottom:1px solid var(--rule);
  padding:4px 8px;cursor:pointer;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.preview button:hover{background:var(--code)}
/* Figures sit BELOW both panes, spanning their width -- a third vertical
   column would squeeze the two that carry the actual comparison. Always
   present, empty state included: the review is figure-blind without it, and
   the reader should be told so rather than shown nothing. */
.figstrip{border:1px solid var(--rule);border-top:0}
.figstrip h4{margin:0;padding:5px 8px;border-bottom:1px solid var(--rule);
  font-family:system-ui,sans-serif;font-size:12px;color:var(--muted);font-weight:600}
.figstrip .pane{display:flex;gap:12px;overflow-x:auto;padding:8px;align-items:flex-start}
figure.fstrip{margin:0;flex:0 0 auto;max-width:320px}
figure.fstrip img{max-width:100%;height:auto;border:1px solid var(--rule)}
figure.fstrip figcaption{font:11.5px system-ui,sans-serif;margin-top:4px}
/* A table in the strip is the extraction's own cell grid, shown beside the
   figures because "did this survive extraction" is the same question for
   both, and a table that lost a column is the more consequential loss. */
/* The card holds the WHOLE table and scrolls. It used to hold a 14x10 corner
   with every cell cut to 40 characters, which on a 73-row table showed 19% of
   the evidence under the label "trimmed for this card". A pane whose purpose is
   letting a reader check a finding against the source cannot be the thing that
   withholds the source. Scrolling keeps the strip usable without dropping a
   cell; `open` puts the table on its own page for close reading. */
figure.fstrip .tgrid{max-height:260px;overflow:auto;border:1px solid var(--rule)}
figure.fstrip .tgrid table{white-space:nowrap}
figure.fstrip .tgrid.empty{padding:8px;font:12px system-ui,sans-serif;
  border-left:3px solid var(--flag);color:var(--fg)}
/* ORIGINAL vs PROCESSED. Both are in the DOM; the toggle swaps which is shown,
   so the two are guaranteed to be the SAME grid in the same slots -- the point
   of the view is that a reader can trust the alignment. */
figure.fstrip .prcell{display:none}
figure.fstrip.showproc .rawcell{display:none}
figure.fstrip.showproc .prcell{display:inline;font:11px ui-monospace,monospace}
figure.fstrip.showproc .prcell.dead{text-decoration:line-through;color:var(--flag);
  opacity:.85}
figure.fstrip .pnote{padding:4px 2px;font:11px system-ui,sans-serif}
figure.fstrip .parsewarn{padding:6px 8px;margin-top:4px;font:12px system-ui,sans-serif;
  border-left:3px solid var(--flag);background:rgba(180,60,60,.06);color:var(--fg)}
a.popout{margin-left:6px;font:11px system-ui,sans-serif;text-decoration:none;
  border:1px solid var(--rule);border-radius:3px;padding:0 4px;color:var(--muted)}
a.popout:hover{color:var(--link);border-color:var(--link)}
/* The table's own footnotes, under the table, where the paper puts them. */
.tfoot{margin-top:4px;font-size:11.5px;color:var(--muted);display:flex;
  flex-direction:column;gap:2px}
.tfoot b{color:var(--fg)}
figure.fstrip table{border-collapse:collapse;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
figure.fstrip td{border:1px solid var(--rule);padding:2px 5px;white-space:nowrap}
figure.fstrip tr:first-child td{position:sticky;top:0;background:var(--code);font-weight:600}
/* The rendered block the sync last landed on. Marking the BLOCK rather than
   the words is the only option there: the rendered DOM has no character
   offsets, which is why each block carries the one it started at. */
.rendered .blk.hit{background:var(--hit,#fdf3c8);outline:2px solid var(--flag);
  outline-offset:1px;scroll-margin:80px}
.rendered .tgt{background:var(--hit,#fdf3c8);outline:2px solid var(--flag);
  outline-offset:2px;scroll-margin:80px}
/* Nested evidence. Indented and rule-marked so a reader can see at a glance
   that these belong to the finding above rather than standing beside it. */
details.evidence{margin:8px 0 0;border-top:1px solid var(--rule);padding-top:6px}
details.evidence>summary{cursor:pointer;font:12px system-ui,sans-serif;color:var(--muted)}
details.evidence[open]>summary{margin-bottom:6px}
details.evidence .finding{margin-left:14px;border-left:2px solid var(--rule)}
.note{border-left:3px solid var(--flag);padding:6px 12px;margin:12px 0;font-size:14.5px}
/* THE WORKING, SHOWN -- deliberately not styled as a finding. A dashed rule and
   the page's own text colour, never the severity palette: this is arithmetic
   that failed as printed and was then explained, not an accusation. Giving it
   accusation colour would reintroduce, as design, the escalation the severity
   ladder was careful to avoid. */
/* A section banner is STRUCTURE. It gets the table's own emphasis rather than a
   colour, because it says nothing about whether anything is wrong -- the
   severity palette is reserved for claims about the paper. */
tr.banner td{font-weight:600;background:var(--code);border-top:2px solid var(--rule);
  text-align:left;padding:5px 8px}
details.secnote{margin:6px 0 0}
details.secnote>summary{cursor:pointer;font:12px system-ui,sans-serif}
/* PRINT.
   The integrity officer this document is partly for does not read HTML; they
   read a paper copy in a meeting, and they hand it to someone who was not in
   the room. Two consequences drive everything below.

   FIRST, the sections are built LAZILY -- `built{}` fills in only as a reader
   clicks -- so printing without forcing a build produces a document containing
   whatever happened to have been opened. That is worse than no print support:
   it looks complete. `printAll()` builds every section first.

   SECOND, a printed page travels without its context. Every sheet therefore
   carries the paper's short cite, the run date, and the disclaimer, because a
   page cropped out of the middle of this document and circulated is exactly
   the route by which an automated flag becomes an accusation nobody qualified.
   That is the same argument as the screenshot test, applied to paper. */
@media print{
  nav,#navtoggle,.copyq,.printbtn,#cq,#ct,input[type=search],select{display:none!important}
  main{margin:0;padding:0;max-width:none}
  section{display:block!important}
  /* Every section on the page, not just the open one. */
  section:not(.on){display:block!important}
  h2{break-before:page;page-break-before:always}
  section:first-of-type h2{break-before:auto;page-break-before:auto}
  .finding,.card,.asrep,details{break-inside:avoid;page-break-inside:avoid}
  details{display:block}

/* Off screen, on paper. Repeats on every sheet via `position:fixed` in the
   print context, which is how browsers render a running header. */
.printhead{display:none;position:fixed;top:0;left:0;right:0;font-size:9pt;
  border-bottom:1px solid #999;padding:2px 0;color:#000}
.printbtn{margin-left:8px}
/* Fused to the severity chip, and deliberately quieter than it: the grade
   qualifies the verdict, it does not compete with it. Same dashed idiom as
   `.asrep` -- in this document a dashed border means "this is about how we
   know, not about the paper". */
.evfuse{font-size:12px;color:var(--muted);border:1px dashed var(--rule);
  border-radius:10px;padding:1px 7px;margin-left:6px;white-space:nowrap;
  vertical-align:middle}
/* Same dashed idiom, and deliberately so: "a norm we supplied" is also a
   statement about how we know rather than about the paper. It sits beside the
   evidence chip because the two answer the reader's two different questions --
   who computed this, and whose standard it is being measured against. */
.warrfuse{font-size:12px;color:var(--muted);border:1px dashed var(--rule);
  border-radius:10px;padding:1px 7px;margin-left:6px;white-space:nowrap;
  vertical-align:middle;cursor:help}
.asrep{border:1px dashed var(--rule);border-radius:6px;padding:8px 12px;
  margin:10px 0;font-size:14.5px;background:transparent}
.asrep p{margin:6px 0}
.asrep-chip{font-size:12px;border:1px dashed var(--rule);border-radius:10px;
  padding:1px 7px;margin-left:6px;white-space:nowrap;vertical-align:middle}
/* THE VIGNETTE, one tool call in five labelled parts. Deliberately NOT a card
   or a panel: a left rule and a small caps heading, which is how a journal
   sets a structured abstract, and which keeps forty of them on one page
   scannable. A DIV and not a `section` -- `section{display:none}` above hides
   every section that is not the open tab, and a `<section>` here would render
   the whole page's worth of vignettes invisible while every test on the HTML
   string still passed. */
.vpart{border-left:3px solid var(--rule);padding:1px 0 1px 12px;margin:12px 0}
.vpart>h5{margin:0 0 4px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-family:system-ui,-apple-system,sans-serif;font-weight:600}
.vpart p{margin:5px 0;font-size:14.5px}
.vargs{list-style:none;padding:0;margin:6px 0;
  font-family:system-ui,-apple-system,sans-serif;font-size:13.5px}
.vargs li{margin:2px 0}
.vargs code{background:var(--code);padding:1px 4px;border-radius:3px}
.vargs .r{color:var(--muted)}
/* The tool's OWN numbers, laid out to be skimmed. Passes and refusals are 75%
   of every archived call that returned a verdict, and a reader needs to see
   what the check had in hand before a pass means anything to them. */
.vnums{display:flex;flex-wrap:wrap;gap:3px 16px;margin:6px 0;
  font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:var(--muted)}
.vnums b{color:var(--fg);font-weight:600}
.vlev{margin:9px 0}

/* Three lines, above the verdict. Quiet enough not to be an alarm, present enough
   that a reader who stops after the verdict has still seen it. */
.beforeread{border:1px solid var(--rule);border-radius:4px;padding:8px 12px;
  margin:14px 0;font-size:13.5px;color:var(--muted);line-height:1.5}

/* THE EVIDENCE GRADE, at the top of a card. Bordered, because the point is that
   it qualifies everything below it -- a reader who takes the finding and skips
   this has taken the half that looks strongest. */
.evgrade{border:1px solid var(--flag);border-radius:4px;padding:6px 10px;

/* WHAT WOULD SETTLE THIS. Set apart, last, and quiet: it is the reader's next

.settle{border-left:3px solid var(--rule);padding:6px 12px;margin:12px 0;

   how a question becomes an allegation. */
.cardfoot{margin-top:12px;padding-top:8px;border-top:1px solid var(--rule);

/* Louder than `.note`, and deliberately so. `.note` qualifies a review; this

.alarm{border:2px solid var(--flag);border-radius:4px;background:var(--code);

   conclusion -- but unmissable, because a reader who does not know which paper

.ident{border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:16px}

.ident .runid{color:var(--muted);font-size:12px;margin-top:6px;

/* Names the SCALE a grade is on. Two grades printed side by side with no

   keep wide tables inside their own box. */
@media(max-width:860px){#wrap{flex-direction:column;align-items:stretch}

<script type="application/json" id="payload">{"body_text": "## The Efficacy of Postoperative Prophylactic Antibiotics in Orthognathic Surgery: A Prospective Study in Le Fort I Osteotomy and Bilateral Intraoral Vertical Ramus Osteotomy\n\n## INTRODUCTION\nAntibiotics are used to treat and prevent postoperative infections. In 1960, it was reported that pathogens are present during surgery[1],[2] regardless of how aseptic the surgery might appear. Moreover, the correlation between prophylactic antibiotics and postoperative wound infections was demonstrated. Therefore, prophylactic antibiotics are now used in almost all surgical procedures. The most effective method of antibiotic prophylaxis is the preoperative administration of antibiotics because it can act at the time when the wound is potentially contaminated by bacteria.[2]\u207b[4] On the other hand, it was also reported that the use of antibiotics after 3 - 4 hours of a bacterial invasion is unsuitable.[5]\n\nProphylactic antibiotics are generally administered both preoperatively and postoperatively. Hence, the effects of the indiscriminate method and period of administration are unclear, considering the multiple factors that contribute to postoperative wound infections.[6]\u207b[8]\n\nThe use of antibiotic prophylaxis is controversial even in orthognathic surgery, which is a representative procedure for oral and maxillofacial surgery. There are reports show no increase in the incidence of infection without the administration of postoperative prophylactic antibiotics.[9],[10] On the other hand, there are reports to suggest the necessity of continuous antibiotic administration.[11] However, orthognathic surgery is mainly performed on young patients without a specific medical history. Moreover, the number of factors associated with the development of postoperative wound infections decreases as the procedure becomes more generalized and its technique advances.\n\nThe aims of this clinical study were to evaluate the prevalence of postoperative wound infections with or without antibiotic prophylaxis after orthognathic surgery in young patients without any specific medical history, and to identify criteria for appropriate use of prophylactic antibiotics in orthognathic surgery.\n\n## PATIENTS AND METHODS\nFifty-six patients in their 20s without a specific medical history, and who were to undergo orthognathic surgical procedures at the department of oral and maxillofacial surgery at the dental hospital of Yonsei University were enrolled in this study. A horizontal maxillary osteotomy and vertical ramus mandibular osteotomy were performed by the same oral surgeon with the aid of trained nurses and residents under hypotensive general anesthesia. No bone grafts were performed. The duration of surgery was less than 5 hours. During surgery, maxillomandibular fixation was placed using steel wires, and drainage tubes were placed on both sides of the mandible. The drainage tubes were removed 2 days after surgery. The wires used for maxillomandibular fixation were removed and the sutures were taken out from the wounds 7 days after surgery. The patients received a non-steroid anti-inflammatory drug (Ketorolac trometamine 30 mg) intramuscularly immediately after surgery and every 6 hours until the next day. Compression bandages and ice packs were applied to the facial area until the second day after surgery.\n\nThe 56 patients were divided into 2 groups according to the randomization codes generated by Microsoft Excel: an experimental and control group. The patients in the experimental group received only 1.0 g of a third-generation cephalosporin (Cefpiramide) intravenously 30 minutes before surgery and did not receive the placebo. The control group also received 1.0 g of Cefpiramide 30 minutes before surgery as well as twice daily until 3 days after surgery. The patients were evaluated every day during the first 3 days and at the end of the 1st and 2nd week after surgery for any postoperative infections in reference to the criteria for defining a surgical site infection (SSI), recommended by the Centers for Disease Control and Prevention (CDC).[12] Postoperative wound infection was defined by at least 1 of the following criteria:\n\nStatistical analysis was performed using a \u03c7\u00b2-test on the Statistical Package for the Social Sciences (SPSS for windows, ver. 12.0, SPSS Inc., Chicago, IL, USA). The study protocol was approved by the Institutional Review Board of the College of Dentistry, Yonsei University (YUDC).\n\n## RESULTS\nThe mean (SD) age of the experimental group was 23.9 years (5.84) with male-female ratio of 4 : 3. The average duration of surgery was 3 hours and 40 minutes. The mean (SD) age of the control group was 24.3 years (6.33) with male-female ratio of 1 : 1. The average duration of surgery was 3 hours and 55 minutes.\n\nThere were 3 infections in the experimental group and 2 infections in the control group, observed 2 weeks after surgery (Table 1). One patient in the experimental group was diagnosed with an infection by facial swelling, redness and sinus haziness in the waters' view, and the other 4 patients were diagnosed with a postoperative infection by swelling and redness, and pain on the mandibular area. Therefore, the wounds were opened by a surgeon and the patients were treated with antibiotics. However, only 1 patient in the control group developed wound dehiscence only without any drainage, fever, or swelling in the maxillary area. According to the \u03c7\u00b2-test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).\n\n[Table 1: Results according to the Postoperative Antibiotic Prophylaxis \u2014 image only, no cells; see tables]\n\n## DISCUSSION\nThe method of antibiotic prophylaxis is determined by an evaluation of the patient, procedure, and surgical wound. The preoperative and immediate postoperative administration of antibiotics is a method generally used for antibiotic prophylaxis in almost all surgical procedures. However, antibiotics are continuously used postoperatively in most procedures because it is difficult to assess the factors associated with postoperative wound infections or appropriate antibiotic prophylaxis method.\n\nOn the other hand, orthognathic surgery is mainly performed on young patients without an underlying illness or comorbidity. Moreover, the number of factors affecting the development of postoperative wound infections decreases with the improvement of the surgical instruments, materials, techniques, and more generalized procedure.\n\nPeterson[13] suggested that the prophylactic antibiotic administration for postoperative wound infections in oral and maxillofacial surgery should be performed if there is a strong probability of infection, and appropriate antibiotics must be given in high-dose but for only a short period of time. Orthognathic surgeries are classified as clean contaminated procedures with postoperative wound infection of 10% to 15%, and Peterson[13] reported that an incidence of an anticipated infection in oral clean contaminated surgery could be reduced by using prophylactic antibiotics. Zijderveld et al.[14] suggested that the incidence of postoperative infections (52.6%) increased without the administration of prophylactic antibiotics. Martis and Karabouta[9] suggested that the routine use of prophylactic antibiotics in orthognathic surgery is unnecessary, and Lindeboom et al.[15] also suggested that the use of postoperative prophylactic antibiotics (clindamycin) is unnecessary in orthognathic surgery (SSRO). Furthermore, Fridrich et al.[16] and Baqain et al.[17] suggested that the long-term use of antibiotics does not decrease the frequency of postoperative infections. However, wide range of patient's age, small group size, and various osteomies may cause difficulties when precisely evaluating the efficacy of prophylactic antibiotics.\n\nTherefore, this study was undertaken to examine the prevalence of postoperative wound infections in young patients after orthognathic surgery (Le Fort I osteotomy and bilateral intraoral vertical ramus osteotomy) with or without the use of postoperative prophylactic antibiotics. Twenty eight patients were enrolled in each group. The samples were selected at a significance level of \u03b1= 0.05 and a test power \u03b2= 0.20. A smaller infection rate was set to 5%, and the difference in the estimated infection rate was set to 30%, based on previous report that the incidence of postoperative wound infection using prophylactic antibiotics, ranges from 5.6% to 33.4%.[17] In this study, wound infections were observed in both groups, however, the number was small. This was attributed to the followings: the patients were young without a specific medical history, patients had no preoperative wound infections, no bone graft had been performed during surgery, the surgical procedures such as IVRO were less traumatic with a short duration, the tissue trauma during surgery was minimal due to the systematization of orthognathic surgery and the improvement of techniques, and wound control such as postoperative blood or exudate was properly performed.\n\nThe types of antibiotics used are important factors to consider for prophylactic antibiotic treatment. Penicillin is the representative antibiotic used as a prophylaxis during intraoral surgery and for the primary treatment of dental infections. Spaey et al[18] suggested the use of amoxicillin-clavulanate along with drain usage during SSRO in a study of antibiotic administration. In this study, third-generation cephalosporin antibiotics were administered before surgery, which is believed to be a possible prophylactic antibiotic that may be used in orthognathic surgery because most bacteria cultured during a dental infection are susceptible to third-generation cephalosporin.[19] There has been an increase in infections due to anaerobic and Gram-negative organisms,[20] and most wound infections after orthognathic surgery are caused by Gram negative bacteria.[21]\n\nIf a post-operative wound infection occurs despite the effective prophylactic antibiotic administration before surgery, it could be concluded that the bacteria in the infected wound are not sensitive to the prophylactic antibiotics administered, and in such cases, an appropriate antimicrobial therapy should be determined by a culture test of the bacteria found in the infected region.[21],[22]\n\nProphylactic antibiotics reduce the risk of postoperative wound infections, which leads to a lower number of hospitalization days, reduced cost, and improved social life. However, the long-term use of postoperative prophylactic antibiotics may lead to several problems, such as various allergic reactions, increased cost, changes in resident bacterial colony in vivo, or appearance of resistant bacteria.[7],[23]\n\nMore studies with much larger numbers of patients are needed on the administration of prophylactic antibiotics during orthognathic surgery and other oral and maxillofacial procedures. In addition, further research on properly appropriated use of antibiotic prophylaxis is warranted in order to minimize the use of prophylactic antibiotics and their adverse effects and problems. In the present study, there was no significant difference in the prevalence of postoperative wound infections between patients who had received postoperative prophylactic antibiotic administration and those who did not. Therefore, prolonged prophylactic antibiotic use after orthognathic surgery may not be necessary, provided that there are no other significant factors for wound infections.\n\n## References\n\n# References\n\n1. [no author]\n2. [no author]\n3. [no author]\n4. [no author]\n5. [no author]\n6. [no author]\n7. [no author]\n8. [no author]\n9. [no author]\n10. [no author]\n11. [no auth ular area. Therefore, the wounds were opened by a surgeon and the patients were treated with antibiotics. However, only 1 patient in the control group developed wound dehiscence only without any drainage, fever, or swelling in the maxillary area. According to the \u03c7\u00b2-test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"5646\"><p><strong>Table 1.<\/strong> Results according to the Postoperative Antibiotic Prophylaxis<\/p>\n<p><em>Not reproduced here: image only, no cells.<\/em><\/p><\/div>\n<div class=\"blk\" data-src-offset=\"5755\"><h2>DISCUSSION<\/h2>\n<p>The method of antibiotic prophylaxis is determined by an evaluation of the patient, procedure, and surgical wound. The preoperative and immediate postoperative administration of antibiotics is a method generally used for antibiotic prophylaxis in almost all surgical procedures. However, antibiotics are continuously used postoperatively in most procedures because it is difficult to assess the factors associated with postoperative wound infections or appropriate antibiotic prophylaxis method.<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"6266\"><p>On the other hand, orthognathic surgery is mainly performed on young patients without an underlying illness or comorbidity. Moreover, the number of factors affecting the development of postoperative wound infections decreases with the improvement of the surgical instruments, materials, techniques, and more generalized procedure.<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"6598\"><p>Peterson[13] suggested that the prophylactic antibiotic administration for postoperative wound infections in oral and maxillofacial surgery should be performed if there is a strong probability of infection, and appropriate antibiotics must be given in high-dose but for only a short period of time. Orthognathic surgeries are classified as clean contaminated procedures with postoperative wound infection of 10% to 15%, and Peterson[13] reported that an incidence of an anticipated infection in oral clean contaminated surgery could be reduced by using prophylactic antibiotics. Zijderveld et al.[14] suggested that the incidence of postoperative infections (52.6%) increased without the administration of prophylactic antibiotics. Martis and Karabouta[9] suggested that the routine use of prophylactic antibiotics in orthognathic surgery is unnecessary, and Lindeboom et al.[15] also suggested that the use of postoperative prophylactic antibiotics (clindamycin) is unnecessary in orthognathic surgery (SSRO). Furthermore, Fridrich et al.[16] and Baqain et al.[17] suggested that the long-term use of antibiotics does not decrease the frequency of postoperative infections. However, wide range of patient's age, small group size, and various osteomies may cause difficulties when precisely evaluating the efficacy of prophylactic antibiotics.<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"7943\"><p>Therefore, this study was undertaken to examine the prevalence of postoperative wound infections in young patients after orthognathic surgery (Le Fort I osteotomy and bilateral intraoral vertical ramus osteotomy) with or without the use of postoperative prophylactic antibiotics. Twenty eight patients were enrolled in each group. The samples were selected at a significance level of \u03b1= 0.05 and a test power \u03b2= 0.20. A smaller infection rate was set to 5%, and the difference in the estimated infection rate was set to 30%, based on previous report that the incidence of postoperative wound infection using prophylactic antibiotics, ranges from 5.6% to 33.4%.[17] In this study, wound infections were observed in both groups, however, the number was small. This was attributed to the followings: the patients were young without a specific medical history, patients had no preoperative wound infections, no bone graft had been performed during surgery, the surgical procedures such as IVRO were less traumatic with a short duration, the tissue trauma during surgery was minimal due to the systematization of orthognathic surgery and the improvement of techniques, and wound control such as postoperative blood or exudate was properly performed.<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"9189\"><p>The types of antibiotics used are important factors to consider for prophylactic antibiotic treatment. Penicillin is the representative antibiotic used as a prophylaxis during intraoral surgery and for the primary treatment of dental infections. Spaey et al[18] suggested the use of amoxicillin-clavulanate along with drain usage during SSRO in a study of antibiotic administration. In this study, third-generation cephalosporin antibiotics were administered before surgery, which is believed to be a possible prophylactic antibiotic that may be used in orthognathic surgery because most bacteria cultured during a dental infection are susceptible to third-generation cephalosporin.[19] There has been an increase in infections due to anaerobic and Gram-negative organisms,[20] and most wound infections after orthognathic surgery are caused by Gram negative bacteria.[21]<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"10063\"><p>If a post-operative wound infection occurs despite the effective prophylactic antibiotic administration before surgery, it could be concluded that the bacteria in the infected wound are not sensitive to the prophylactic antibiotics administered, and in such cases, an appropriate antimicrobial therapy should be determined by a culture test of the bacteria found in the infected region.[21],[22]<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"10460\"><p>Prophylactic antibiotics reduce the risk of postoperative wound infections, which leads to a lower number of hospitalization days, reduced cost, and improved social life. However, the long-term use of postoperative prophylactic antibiotics may lead to several problems, such as various allergic reactions, increased cost, changes in resident bacterial colony in vivo, or appearance of resistant bacteria.[7],[23]<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"10874\"><p>More studies with much larger numbers of patients are needed on the administration of prophylactic antibiotics during orthognathic surgery and other oral and maxillofacial procedures. In addition, further research on properly appropriated use of antibiotic prophylaxis is warranted in order to minimize the use of prophylactic antibiotics and their adverse effects and problems. In the present study, there was no significant difference in the prevalence of postoperative wound infections between patients who had received postoperative prophylactic antibiotic administration and those who did not. Therefore, prolonged prophylactic antibiotic use after orthognathic surgery may not be necessary, provided that there are no other significant factors for wound infections.<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"11647\"><h2>References<\/h2><\/div>\n<div class=\"blk\" data-src-offset=\"11662\"><h1>References<\/h1><\/div>\n<div class=\"blk\" data-src-offset=\"11676\"><ol>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<\/ol><\/div>", "table_records": [{"sections": [], "processed": {"n": 0, "n_unplaced": 0, "coverage": 0.0, "kind_counts": {}, "unparsed": [], "n_unread_numeric": 0, " it states what could not be run, not an arithmetic result.", "reproduction": "metascience check-table --cells '[{\"raw\":\"23.9 \u00b1 5.84 yrs\",\"row_label\":\"Age (Mean \u00b1 SD)\",\"col_label\":\"Experimental group without postoperative antibiotics (n = 28)\"},{\"raw\":\"24.3 \u00b1 6.33 yrs\",\"row_label\":\"Age (Mean \u00b1 SD)\",\"col_label\":\"Control group with postoperative antibiotics for 3 days (n = 28)\"},{\"raw\":\"16 : 12\",\"row_label\":\"Sex (Male : Female)\",\"col_label\":\"Experimental group without postoperative antibiotics (n = 28)\"},{\"raw\":\"14 : 14\",\"row_label\":\"Sex (Male : Female)\",\"col_label\":\"Control group with postoperative antibiotics for 3 days (n = 28)\"},{\"raw\":\"3\",\"row_label\":\"Postoperative infection (n)\",\"col_label\":\"Experimental group without postoperative antibiotics (n = 28)\"},{\"raw\":\"2\",\"row_label\":\"Postoperative infection (n)\",\"col_label\":\"Control group with postoperative antibiotics for 3 days (n = 28)\"},{\"raw\":\"0\",\"row_label\":\"Wound dehiscence (n)\",\"col_label\":\"Experimental group without postoperative antibiotics (n = 28)\"},{\"raw\":\"1\",\"row_label\":\"Wound dehiscence (n)\",\"col_label\":\"Control group with postoperative antibiotics for 3 days (n = 28)\"}]' --provenance printed_table", "reproduction_kind": "command", "reproduction_valid": false, "reproduction_problem": "exited 1: \u256d\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Traceback (most recent call last) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u256e\n\u2502 /tmp/fmtold/metascience_agent/cli.py:3321 in check_table_cmd                 \u2502\n\u2502                                     ", "quote_verified": "verbatim", "quote_source": "the PDF text layer", "_anchor": {"page": 3}}, {"id": "no_test_statistic_or_df_reported", "location": "Results, final paragraph; Abstract, Results", "technique": "not_computational", "consistent": false, "severity": "suspicious", "reported": {"p": 0.639, "chi_squared_statistic": "not reported", "df": "not reported"}, "computed": {"statcheck_stats_found": 0}, "quote": "According  to  the  2 -test,  there  was  no  significant difference in the prevalence of postoperative wound  infections  between  the  patients  who  had received postoperative prophylactic antibiotic administration and those who had not ( p = 0.639).", "consequence": {"flips_significance": false, "claims_affected": 0, "basis": "asserted", "explanation": "The omission is fully remediable: Table 1 prints the underlying 2x2 counts, so the test is recomputable and was recomputed here. No conclusion is affected."}, "notes": "The paper reports a p-value with neither the chi-squared statistic nor its degrees of freedom, in both the Results and the Abstract. statcheck run over the body text returned 0 statistics -- there is no APA-format test result anywhere in the paper to verify. This is a reporting-completeness defect rather than a numeric one, and its practical consequence is nil because Table 1 supplies the cell counts from which the test can be (and was) reconstructed. Recorded because the paper's entire inferential content is this one sentence.", "reproduction": "metascience statcheck --text \"According to the chi-squared test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).\"", "reproduction_kind": "command", "reproduction_valid": true, "quote_verified": "stitched", "quote_source": "assembled from values in the paper", "quote_problem": "Every number here appears in the paper, but this exact sentence does not -- it was composed by the review, so searching the PDF for it will find nothing."}, {"id": "null_conclusion_with_no_interval", "location": "Abstract, Conclusion; Discussion, final paragraph", "technique": "absence_of_evidence", "consistent": false, "severity": "indeterminate", "inputs": {"attempted": "absence_of_evidence", "measure": "odds_ratio", "ci_low": null, "ci_high": null}, "reported": {"conclusion": "no significant difference; prolonged prophylactic antibiotic use may not be necessary", "ci": "none reported", "effect_size": "none reported"}, "computed": {"fisher_odds_ratio_from_table1_counts": 1.56, "interval_available": false}, "quote": "Conclusion: Prolonged prophylactic antibiotic use after orthognathic surgery may not be necessary, provided that there are no  other  significant  factors  for  wound  infections.", "consequence": {"flips_significance": null, "claims_affected": 1, "basis": "asserted", "explanation": "The paper's only conclusion is a claim of no effect, and the paper supplies nothing from which the largest effect still compatible with its data could be read."}, "notes": "THE CHECK COULD NOT RUN, AND THAT IS THE FINDING. absence_of_evidence requires an interval (or a coefficient with its standard error) to report the largest effect a null result still permits; this paper prints no confidence interval, no risk difference, no relative risk and no odds ratio anywhere -- for any quantity. The only effect estimate available is one this sweep derived from the Table 1 counts (Fisher odds ratio 1.56, from recalc_chi_squared), and it comes with no interval. With 5 events in 56 patients, 'not significant' here is very weak evidence of 'no difference', and the paper offers the reader no means of telling the two apart. No smallest effect size of interest is stated either, so equivalence could not be assessed even had an interval been printed. Graded `indeterminate` because this records what could not be determined, not a defect in a printed number.", "reproduction": "no command applies; metascience absence-of-evidence requires an interval or a coefficient with its standard error, and the paper prints neither", "reproduction_kind": "no_command_applies", "reproduction_valid": null, "quote_verified": "unverified", "quote_problem": "WE could not locate this text in what we read. That is a statement about this search, not about the paper: it happens when the paper spells a number in words, when the value lives in a figure we can only see as an image, or when the quote is a table header rendered differently by each extractor. Do not read it as evidence that the authors did not write this."}, {"id": "power_analysis_unverifiable", "location": "Discussion, paragraph 5", "technique": "no_tool_exists", "consistent": false, "severity": "indeterminate", "inputs": {"alpha": 0.05, "beta": 0.2, "p1": 0.05, "p2": 0.35, "n_per_group": 28, "test_type": "two_proportions"}, "reported": {"alpha": 0.05, "beta": 0.2, "smaller_infection_rate_pct": 5, "assumed_difference_pct": 30, "n_per_group": 28}, "computed": {"verification_attempted": "verify_power_analysis (two_proportions)", "blocker": "the tool takes Cohen's h as its effect-size argument; no registered tool converts a pair of proportions to h, and performing that conversion by hand is barred"}, "quote": "The samples were selected at a significance level of \u03b1 =0.05 and a test power \u03b2 =0.20. A smaller infection  rate  was  set  to  5%,  and  the  difference  in the  estimated infection rate was set to 30%", "notes": "A RECORDED GAP IN THE TOOLKIT, not a defect in the paper. Every input needed is stated -- alpha 0.05, power 0.80 (written as beta = 0.20, the conventional type-II error notation), p1 = 0.05, p2 = 0.35, n = 28 per arm -- so the calculation is in principle fully reproducible. It could not be run because verify_power_analysis and required_n both take Cohen's h for a two-proportions design, and no registered tool derives h from two proportions. Two reporting observations that need no tool: the power calculation appears in the Discussion rather than the Methods, and the paper cites no trial registration or protocol, so it cannot be established that the calculation preceded data collection.", "reproduction": "no command applies; metascience power-check requires Cohen's h for a two-proportions design and no registered tool derives h from a pair of proportions", "reproduction_kind": "no_command_applies", "reproduction_valid": null, "quote_verified": "stitched", "quote_source": "assembled from values in the paper", "quote_problem": "Every number here appears in the paper, but this exact sentence does not -- it was composed by the review, so searching the PDF for it will find nothing.", "_anchor": {"page": 3, "text_index": 8260}}, {"id": "design_powered_only_for_a_very_large_effect", "location": "Discussion, paragraph 5, read against Table 1", "technique": "not_computational", "consistent": false, "severity": "suspicious", "reported": {"design_target": "5% vs a 30-percentage-point difference", "observed": "3 of 28 vs 2 of 28", "n_per_group": 28}, "computed": {}, "quote": "A smaller infection  rate  was  set  to  5%,  and  the  difference  in the  estimated infection rate was set to 30%, based on  previous  report  that  the  incidence of  postoperative wound infection using prophylactic antibiotics,  ranges  from  5.6%  to  33.4%.", "consequence": {"flips_significance": false, "claims_affected": 1, "basis": "asserted", "explanation": "The conclusion that 'prolonged prophylactic antibiotic use after orthognathic surgery may not be necessary' rests on a design the paper's own stated parameters show was sized only to detect a 30-percentage-point difference; a clinically meaningful smaller difference would not have been detectable."}, "notes": "Stated by quotation rather than computed, so no arithmetic is claimed here. The paper's own printed design parameters target a difference between a 5% and a 35% infection rate -- a 30-percentage-point gap. The observed result was 3 infections of 28 against 2 of 28, a one-patient difference. A trial sized for so large an effect cannot distinguish 'no difference' from 'a difference too small for this design to see', which is the substantive limitation on the paper's conclusion. The authors do note that 'the number was small' and call for larger studies, so the limitation is partly acknowledged; what is not acknowledged is that the Abstract states the conclusion without that qualification. Reported, not graded as an error in any number.", "reproduction": "no command applies; this is a reading of the paper's stated design parameters against the counts in Table 1", "reproduction_kind": "no_command_applies", "reproduction_valid": null, "quote_verified": "verbatim", "quote_source": "the paper's text", "_anchor": {"page": 3, "text_index": 8347}}, {"id": "unblinded_no_placebo_subjective_outcome", "location": "Patients and Methods, paragraph 2", "technique": "not_computational", "consistent": false, "severity": "suspicious", "reported": {"allocation": "randomisation codes generated by Microsoft Excel", "blinding": "none described", "placebo": "explicitly not given"}, "computed": {}, "quote": "The  patients  in  the  experimental  group received  only  1.0 g  of  a  third-generation  cephalosporin (Cefpiramide)  intravenously 30  minutes before  surgery  and  did  not  receive  the  placebo.", "consequence": {"flips_significance": null, "claims_affected": 1, "basis": "asserted", "explanation": "The primary outcome is assessed on largely subjective signs (swelling, redness, pain) by unblinded assessors, so the single reported comparison is open to ascertainment bias in an unknown direction."}, "notes": "Two things in one load-bearing Methods sentence. First, the sentence refers to 'the placebo' with a definite article although no placebo is introduced anywhere in the paper -- the phrasing implies a placebo-controlled design that was not in fact run, and the wording appears not to have been reconciled with the study as conducted. Second, and substantively: with no placebo, patients and staff necessarily knew which arm each patient was in, while three of the four CDC criteria used to define the primary outcome rest on clinician judgement of swelling, redness, pain and whether to open the wound. The paper describes no blinded outcome assessment, no allocation concealment beyond the Excel-generated code list, and no trial registration. Recorded as a design and reporting observation; no number is in question.", "reproduction": "no command applies; this is a reading of the Methods text", "reproduction_kind": "no_command_applies", "reproduction_valid": null, "quote_verified": "verbatim", "quote_source": "the paper's text", "_anchor": {"page": 2, "text_index": 3464}}, {"id": "round_n_not_flagged", "location": "Methods, paragraph 2 and Table 1 column headers", "technique": "flag_round_n", "consistent": true, "severity": "consistent", "inputs": {"ns": [56, 28, 28], "moderate_modulus": 50, "strong_modulus": 100}, "reported": {"n_total": 56, "n_per_group": 28}, "computed": {"all_divisible_by_moderate": false, "all_divisible_by_strong": false, "verdict": "no round-N flag"}, "quote": "The  56  patients  were  divided  into  2  groups according  to  the  randomization  codes  generated by  Microsoft  Excel:  an  experimental  and  control group.", "notes": "Sample sizes of 56 and 28 are not suspiciously round; the heuristic does not fire. Recorded as a check that ran and found nothing, so that the absence of a round-N signal is documented rather than merely unmentioned.", "reproduction": "metascience flag-round-n --ns \"[56,28,28]\"", "reproduction_kind": "command", "reproduction_valid": false, "reproduction_problem": "exited 1: \u256d\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Traceback (most recent call last) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u256e\n\u2502 /tmp/fmtold/metascience_agent/cli.py:1730 in flag_round_n_cmd                \u2502\n\u2502                                     ", "quote_verified": "verbatim", "quote_source": "the paper's text", "source": {"source_quote": "The 56 patients were divided into 2 groups according to the randomization codes generated by Microsoft Excel: an experimental and control group.", "source_locator": "Methods, paragraph 2 and Table 1 column headers", "source_quote_verified": "verbatim", "source_quote_source": "the paper's text"}, "_anchor": {"page": 2, "text_index": 3319}}, {"id": "table1_recovered_from_pdf", "location": "Table 1 (XML reports it image_only; grid recovered from the PDF)", "technique": "not_computational", "consistent": true, "severity": "consistent", "reported": {"xml_status": "image_only, 0 rows, 0 cells", "pdf_status": "5-row grid recovered via docling"}, "computed": {}, "quote": "[Table 1: Results according to the Postoperative Antibiotic Prophylaxis \u2014 image only, no cells; see tables]", "notes": "The XML carries Table 1 as an image with no cells, so the paper's only table would have gone entirely unchecked from that source. The PDF extraction recovered the full 5-row grid (docling strategy, a read grid rather than text-alignment inference), and every number in it is independently corroborated by the Results prose, which restates the two age means with SDs and both infection counts. Because the two sources agree, the grid was treated as sound and used for the chi-squared and summation checks. No table in this paper is left unchecked for want of a source.", "reproduction": "metascience extract --pdf-path <home>/agent_for_forensic_metascience/eval/ground_truth/papers/10.3349--ymj.2009.50.1.55/10.3349--ymj.2009.50.1.55.pdf", "reproduction_kind": "command", "reproduction_valid": true, "quote_verified": "verbatim", "quote_source": "the paper's text", "_anchor": {"text_index": 5636}}], "coverage": {"stats_found": 20, "tools_run": ["extract_xml", "extract_pdf", "statcheck", "parse_table", "parse_cells_typed", "check_table", "recalc_chi_squared", "check_summation_batch", "grim_check", "grimmer_check", "check_sd_or_se", "sprite_reconstruct", "flag_round_n"], "tables_checked": ["Table 1 (Results according to the Postoperative Antibiotic Prophylaxis) \u2014 image_only in XML, grid recovered from PDF"]}, "second_look": {"n_accusatory": 7, "n_flagged": 7, "by_marker": {"quote_not_located": 7, "assumed_bound": 2}, "items": [{"id": "chi2_expected_counts_below_5", "severity": "suspicious", "location": "Patients and Methods, statistical analysis paragraph; Results, final paragraph", "markers": ["quote_not_located"], "what_to_do": ["the quoted passage could not be found in the paper. Either the values were transcribed rather than copied, or our extraction differs from what the model read. Re-read the source span before keeping this."]}, {"id": "age_sd_vs_in_their_20s_experimental", "severity": "suspicious", "location": "Results, paragraph 1 / Table 1, Age row (experimental group)", "markers": ["quote_not_located", "assumed_bound"], "what_to_do": ["the quoted passage could not be found in the paper. Either the values were transcribed rather than copied, or our extraction differs from what the model read. Re-read the source span before keeping this.", "the severity rests on a scale bound the paper never stated. A misspecified bound INVERTS these checks rather than weakening them, so confirm the range from the paper or cap the finding at `suspicious`."]}, {"id": "age_sd_vs_in_their_20s_control", "severity": "suspicious", "location": "Results, paragraph 1 / Table 1, Age row (control group)", "markers": ["quote_not_located", "assumed_bound"], "what_to_do": ["the quoted passage could not be found in the paper. Either the values were transcribed rather than copied, or our extraction differs from what the model read. Re-read the source span before keeping this.", "the severity rests on a scale bound the paper never stated. A misspecified bound INVERTS these checks rather than weakening them, so confirm the range from the paper or cap the finding at `suspicious`."]}, {"id": "sprite_age_within_a_single_decade", "severity": "suspicious", "location": "Patients and Methods, paragraph 1 (inclusion) with Results, paragraph 1 (age)", "markers": ["quote_not_located"], "what_to_do": ["the quoted passage could not be found in the paper. Either the values were transcribed rather than copied, or our extraction differs from what the model read. Re-read the source span before keeping this."]}, {"id": "no_test_statistic_or_df_reported", "severity": "suspicious", "location": "Results, final paragraph; Abstract, Results", "markers": ["quote_not_located"], "what_to_do": ["the quoted passage could not be found in the paper. Either the values were transcribed rather than copied, or our extraction differs from what the model read. Re-read the source span before keeping this."]}, {"id": "design_powered_only_for_a_very_large_effect", "severity": "suspicious", "location": "Discussion, paragraph 5, read against Table 1", "markers": ["quote_not_located"], "what_to_do": ["the quoted passage could not be found in the paper. Either the values were transcribed rather than copied, or our extraction differs from what the model read. Re-read the source span before keeping this."]}, {"id": "unblinded_no_placebo_subjective_outcome", "severity": "suspicious", "location": "Patients and Methods, paragraph 2", "markers": ["quote_not_located"], "what_to_do": ["the quoted passage could not be found in the paper. Either the values were transcribed rather than copied, or our extraction differs from what the model read. Re-read the source span before keeping this."]}], "note": "7 of 7 accusation(s) carry a named weakness in their evidence. Each is listed with what would settle it. This is a worklist, not a verdict: none of these is wrong because it is listed, and a marker you resolve should be recorded in `triage` like any other triage decision."}, "unchecked": [{"location": "Discussion, paragraph 5 \u2014 a-priori power calculation", "reason": "Every input is stated (alpha 0.05, power 0.80, p1 = 5%, difference 30%, n = 28 per arm) but verify_power_analysis and required_n both require Cohen's h for a two-proportions design, and no registered tool converts a pair of proportions to h. Computing it by hand is barred. Recorded as a toolkit gap in the finding `power_analysis_unverifiable`."}, {"location": "Results, final paragraph \u2014 largest effect compatible with the null result", "reason": "absence_of_evidence requires a confidence interval, or a coefficient with its standard error. The paper prints no interval, no risk difference, no relative risk and no odds ratio for any quantity, and states no smallest effect size of interest, so neither the permitted-effect bound nor an equivalence test could be computed."}, {"location": "Table 1, Age row and Sex row \u2014 per-cell checks", "reason": "The age cells print with a trailing unit ('23.9 \u00b1 5.84 yrs') and the sex cells as a ratio ('16 : 12'); parse_cells_typed returned both as non-numeric with an EMPTY candidate_formats list, so no declared format could read them. The age values were checked instead from the Results prose, which prints the same numbers in parseable form, and the sex counts via summation, so no value went unchecked \u2014 only the cell-by-cell route was unavailable."}, {"location": "Table 1, Wound dehiscence row (0 vs 1)", "reason": "The paper performs no test on wound dehiscence and none is warranted: a 2x2 with a zero cell supports no valid chi-squared, and with one event in 56 patients no test would be informative. Deliberately not tested rather than overlooked."}, {"location": "Baseline comparability of the two arms (csf_test, bayesian_table1_dispersion)", "reason": "Both tools require baseline p-values or a set of baseline rows with means, SDs and ns. The paper reports only two baseline characteristics (age, sex), prints no baseline p-values, and performs no baseline comparison. Two rows is far too few for a dispersion or Carlisle-style similarity test, so neither was run."}, {"location": "Duplication across tables (detect_duplication)", "reason": "The paper contains a single table with exactly two (mean, SD) pairs, and those two pairs differ (23.9/5.84 vs 24.3/6.33). There is no second table or second sample to compare against, so the check has nothing to operate on."}, {"location": "Results, paragraph 1 \u2014 mean duration of surgery (3 h 40 min and 3 h 55 min)", "reason": "Reported as bare means in clock units with no SD, no dispersion and no accompanying statistical test. No registered check applies, and no comparison between arms is made by the paper."}, {"location": "Multiplicity correction (multiplicity_report)", "reason": "The paper reports exactly one statistical test of one hypothesis. A single planned confirmatory test needs no correction, and running the tool on one p-value would manufacture a family that does not exist."}, {"location": "GRIM-U rank-sum granularity checks", "reason": "Deliberately not run. The paper's only p-value comes from a chi-squared test, and GRIM-U applies exclusively to Mann-Whitney U / Wilcoxon rank-sum p-values; applying it here would be the toolkit's documented top false-accusation risk."}, {"location": "Supplementary materials", "reason": "No supplementary files accompany this paper in the provided directory; only the XML and PDF are present. Nothing was refused or unreadable \u2014 there is nothing to read."}, {"location": "Figures", "reason": "The paper contains no figures. Its only display item is Table 1. extract_figures was therefore not run, and no statistic in this paper appears only in a figure."}], "report_html": "<blockquote>\n<p><strong>REPORT INCOMPLETE<\/strong> \u2014 this review was assembled from a malformed or missing model output and must not be read as a complete analysis: headline.severity 'none' is weaker than findings[0].severity 'suspicious'; the headline must be at least as severe as the worst finding it introduces<\/p>\n<p><strong>REPORT INCOMPLETE<\/strong> \u2014 this document was rendered from a malformed report object and must not be read as a complete review: headline.severity 'none' is weaker than findings[0].severity 'suspicious'; the headline must be at least as severe as the worst finding it introduces<\/p>\n<\/blockquote>\n<h1>Forensic review -- Kang et al. 2009<\/h1>\n<blockquote>\n<p>This is an automated check of a paper's reported numbers and its internal record -- not a finding of misconduct. It is NOT adequate for definitive detection of wrongdoing or fraud.<\/p>\n<\/blockquote>\n<h2>The Efficacy of Postoperative Prophylactic Antibiotics in Orthognathic Surgery: A Prospective Study in Le Fort I Osteotomy and Bilateral Intraoral Vertical Ramus Osteotomy<\/h2>\n<p><em>Sang-Hoon Kang, Jae-Ha Yoo, Choong-Kook Yi. Yonsei Medical Journal. 2009. doi:10.3349/ymj.2009.50.1.55<\/em><\/p>\n<p><strong>Design:<\/strong> Two-arm randomised comparison (randomisation codes generated by Microsoft Excel); unblinded, no placebo administered; single centre; n=56, 28 per arm<\/p>\n<p>&lt;sub&gt;Analysed as <code>10.3349--ymj.2009.50.1.55<\/code>&lt;/sub&gt;<\/p>\n<blockquote>\n<p><strong>NO MAJOR PROBLEM FOUND<\/strong> \u2014 Every number this paper prints reconciles with every other number it prints -- the single significance test reproduces exactly from the counts in Table 1 -- but the paper draws a conclusion of \"no difference\" from five infections in fifty-six patients without reporting any confidence interval or effect estimate, and describes its cohort as \"patients in their 20s\" while reporting age variability no single decade can produce.<\/p>\n<p><strong>In plain terms:<\/strong> The arithmetic in this small surgical trial holds up: the one statistical test it reports can be reproduced exactly from the patient counts it prints, and every total adds up. What the reader should weigh instead is that only five patients in the whole study developed an infection, and from that the authors conclude that extra antibiotics after surgery \"may not be necessary\" without ever saying how large a real benefit their study could still have missed.<\/p>\n<p><strong>Evidence:<\/strong> \"There were 3 infections in the experimental group and 2 infections in the control group\" and \"there was no significant difference in the prevalence of postoperative wound infections ... (p = 0.639)\": the uncorrected Pearson chi-squared on [[3,25],[2,26]] gives chi2 = 0.2196, df = 1, p = 0.639339, which rounds to the printed 0.639. All five count sums reconcile exactly (28+28=56; 16+12=28; 14+14=28; 3+2=5; 1+4=5).\n<strong>Rests on:<\/strong> logical necessity (no assumption added)\n<strong>Reproduce:<\/strong> no runnable command -- the review's command used an option this tool does not have. The finding's own numbers are above; re-derive from those.<\/p>\n<\/blockquote>\n<p><strong>Verdict: reconciles<\/strong> (confidence: medium)<\/p>\n<h2>Provenance of the analysis<\/h2>\n<ul>\n<li><strong>PREREGISTRATION NOT MENTIONED<\/strong>. No preregistration is mentioned in the extracted text. This is WEAK evidence: registration statements often sit in a data-availability or funding section that extraction may have dropped, and absence here is not evidence that none exists.<\/li>\n<li><strong>Shared artefacts.<\/strong> No code, data or registration links found in the extracted text. Absence here is weak evidence -- these often live in a data-availability statement that extraction may have dropped.<\/li>\n<\/ul>\n<h2>Statistical anatomy<\/h2>\n<p>1 study/studies, 6 variables, 1 statistical tests identified.<\/p>\n<h3>Studies<\/h3>\n<table>\n<thead>\n<tr>\n<th>id<\/th>\n<th>label<\/th>\n<th>design<\/th>\n<th>n<\/th>\n<th>unit of analysis<\/th>\n<th>clustered<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>S1<\/td>\n<td>Postoperative prophylactic antibiotics after Le Fort I osteotomy + bilateral IVRO<\/td>\n<td>rct<\/td>\n<td>56<\/td>\n<td>patient<\/td>\n<td>no<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Variables<\/h3>\n<table>\n<thead>\n<tr>\n<th>variable<\/th>\n<th>level<\/th>\n<th>discreteness<\/th>\n<th>values<\/th>\n<th>unit<\/th>\n<th>derived<\/th>\n<th>admits<\/th>\n<th>conf<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Age at surgery<\/td>\n<td>ratio<\/td>\n<td>unknown<\/td>\n<td>range not stated<\/td>\n<td>years<\/td>\n<td>measured<\/td>\n<td>none -- not integer-valued<\/td>\n<td>medium<\/td>\n<\/tr>\n<tr>\n<td>Sex<\/td>\n<td>nominal<\/td>\n<td>discrete<\/td>\n<td>Male; Female<\/td>\n<td>-<\/td>\n<td>measured<\/td>\n<td>percentage GRIM on cell counts<\/td>\n<td>high<\/td>\n<\/tr>\n<tr>\n<td>Postoperative wound infection (CDC surgical site infection criteria)<\/td>\n<td>nominal<\/td>\n<td>discrete<\/td>\n<td>infection; no infection<\/td>\n<td>-<\/td>\n<td>measured (at least 1 of 4 CDC SSI criteria met at any assessment through 2 weeks postoperatively)<\/td>\n<td>DEBIT; percentage GRIM<\/td>\n<td>high<\/td>\n<\/tr>\n<tr>\n<td>Wound dehiscence<\/td>\n<td>nominal<\/td>\n<td>discrete<\/td>\n<td>dehiscence; no dehiscence<\/td>\n<td>-<\/td>\n<td>measured<\/td>\n<td>DEBIT; percentage GRIM<\/td>\n<td>high<\/td>\n<\/tr>\n<tr>\n<td>Treatment arm (postoperative antibiotic prophylaxis)<\/td>\n<td>nominal<\/td>\n<td>discrete<\/td>\n<td>Experimental: single preoperative dose only; Control: preoperative dose plus twice daily for 3 days<\/td>\n<td>-<\/td>\n<td>measured<\/td>\n<td>DEBIT; percentage GRIM<\/td>\n<td>high<\/td>\n<\/tr>\n<tr>\n<td>Duration of surgery<\/td>\n<td>ratio<\/td>\n<td>continuous<\/td>\n<td>range not stated<\/td>\n<td>hours and minutes<\/td>\n<td>measured<\/td>\n<td>none -- not integer-valued<\/td>\n<td>medium<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em><code>admits<\/code> is what this typing permits, not what ran -- see the tests table for that. Granularity checks (GRIM, GRIMMER, SPRITE) apply ONLY to integer-valued variables on a STATED scale; on a 95-paper corpus at most 0.31% of

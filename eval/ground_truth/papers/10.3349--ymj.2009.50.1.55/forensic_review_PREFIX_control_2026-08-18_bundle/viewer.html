t the range of effects their data would still be compatible with -- so a reader cannot tell whether the study rules out a worthwhile benefit or simply was not big enough to detect one. Reporting that range is a standard requirement for trials, and it is what turns 'we found no difference' into a usable result.<\/p>\n<ul>\n<li><strong>Location:<\/strong> Abstract, Conclusion; Results, final paragraph; Discussion, final paragraph<\/li>\n<li><strong>Reported:<\/strong> \"Prolonged prophylactic antibiotic use after orthognathic surgery may not be necessary, provided that there are no other significant factors for wound infections.\" The only quantity supporting this is \"(p = 0.639)\". The paper prints no confidence interval, no risk difference, no relative risk and no odds ratio for any quantity anywhere.<\/li>\n<li><strong>Computed:<\/strong> The largest effect still compatible with these data could not be bounded, because absence_of_evidence requires an interval, or a coefficient with its standard error, and the paper supplies neither. The only effect estimate obtainable is one derived here from the Table 1 counts: Fisher odds ratio 1.56, itself with no interval. With 5 events across 56 patients, Pearson p = 0.639339, Yates p = 1.0 and Fisher exact p = 1.0 -- all non-significant, none of them informative about magnitude.<\/li>\n<li><strong>Assumptions:<\/strong> None beyond the paper's own statements. CONSORT 2010 item 17a is cited as the named standard; the paper predates it, but the identically-worded requirement to report each outcome's effect size with its precision was CONSORT 2001 item 17, which did not. The paper claims no guideline.<\/li>\n<li><strong>Consequence:<\/strong> changes no significance decision; 1 stated claim affected -- The paper's sole conclusion -- that prolonged postoperative prophylaxis may be unnecessary -- is a claim of no effect, and the paper prints nothing from which a reader could tell 'no difference' from 'a difference this study was too small to see'. (asserted, not computed)<\/li>\n<li><strong>Reproduce:<\/strong> no runnable command -- the review's command used an option this tool does not have. The finding's own numbers are above; re-derive from those.<\/li>\n<\/ul>\n<h3>2. Trial sized only to detect a 30-percentage-point difference in infection rates, and the abstract states the null conclusion without that qualification  [SUSPICIOUS | confidence: high]<\/h3>\n<p><strong>In plain terms.<\/strong> Before running the study the authors calculated how many patients they needed, assuming they were looking for a very large difference -- roughly 5% of one group getting infected versus 35% of the other. A study built to spot a gap that big is nearly blind to a smaller but still important one. The main text does acknowledge that the numbers were small and that larger studies are needed; the abstract, which is what most readers see, states the conclusion without that caveat. Two further points a reader should note: the power calculation appears in the discussion rather than the methods, and the paper cites no trial registration, so there is no way to confirm it was done before the data were collected.<\/p>\n<ul>\n<li><strong>Location:<\/strong> Discussion, paragraph 5, read against Table 1 and the Abstract Conclusion<\/li>\n<li><strong>Reported:<\/strong> \"Twenty eight patients were enrolled in each group. The samples were selected at a significance level of alpha = 0.05 and a test power beta = 0.20. A smaller infection rate was set to 5%, and the difference in the estimated infection rate was set to 30%.\" Observed: 3 of 28 versus 2 of 28.<\/li>\n<li><strong>Computed:<\/strong> Not computed. Stated by quotation from the paper's own design parameters: the design targets a contrast between a 5% and a 35% infection rate, and the observed contrast is a one-patient difference. The a-priori calculation could not be reproduced -- verify_power_analysis and required_n both take Cohen's h for a two-proportions design and no registered tool converts a pair of proportions to h, so this is recorded as a gap in our toolkit and not as a defect in the paper.<\/li>\n<li><strong>As printed in the paper:<\/strong> \u201cA smaller infection rate was set to 5%, and the difference in the estimated infection rate was set to 30%, based on previous report that the incidence of postoperative wound infection using prophylactic antibiotics, ranges from 5.6% to 33.4%.\u201d <em>(found in the paper's text)<\/em><\/li>\n<li><strong>Assumptions:<\/strong> None beyond the paper's own statements. No arithmetic is claimed for this finding; the power calculation itself was not verified, and every input needed to verify it is stated by the paper.<\/li>\n<li><strong>Consequence:<\/strong> changes no significance decision; 1 stated claim affected -- The Abstract's unqualified conclusion that prophylaxis 'may not be necessary' rests on a design the paper's own printed parameters show was sized only for a 30-percentage-point difference, so a clinically meaningful smaller difference was never detectable. (asserted, not computed)<\/li>\n<li><strong>Reproduce:<\/strong> <code>no command applies; this is a reading of the paper's own stated design parameters in Discussion paragraph 5 against the counts in Table 1<\/code><\/li>\n<\/ul>\n<h3>3. Chi-squared applied where all expected infected-cell counts are 2.5, with no exact test reported  [SUSPICIOUS | confidence: high]<\/h3>\n<p><strong>In plain terms.<\/strong> With only five infections spread across fifty-six patients, the standard chi-squared test the authors used is not really the right tool -- it is an approximation that needs more events than this to be reliable, and an exact test is the usual choice. This is not a case where it matters to the answer: the result is 'no significant difference' whichever of the three standard tests you run. It matters to how much weight the specific figure 0.639 should carry. Reaching for the software's default output here is extremely common in this literature.<\/p>\n<ul>\n<li><strong>Location:<\/strong> Patients and Methods, statistical analysis paragraph; Results, final paragraph<\/li>\n<li><strong>Reported:<\/strong> \"Statistical analysis was performed using a chi-squared test on the Statistical Package for the Social Sciences (SPSS for windows, ver. 12.0)\", yielding \"(p = 0.639)\". No exact test is mentioned anywhere.<\/li>\n<li><strong>Computed:<\/strong> The expected-count array from the 2x2 is [[2.5, 25.5], [2.5, 25.5]] -- both infected cells fall below the conventional minimum of 5 for the chi-squared approximation. The reported p is nonetheless exactly right for the convention actually used: uncorrected Pearson gives p = 0.639339. Under the alternatives ordinarily preferred at these counts, Fisher's exact gives p = 1.0 and the Yates-corrected chi-squared gives p = 1.0.<\/li>\n<li><strong>Our check returned a different severity.<\/strong> The <code>recalc_chi_squared<\/code> check returned <code>consistent<\/code> for the sweep finding <code>chi2_expected_counts_below_5<\/code>, which this review recorded as <code>suspicious<\/code>. This entry asserts more than the check established, so read it as this review's judgement and not as a computed result. The finding states a reason.<\/li>\n<li><strong>Assumptions:<\/strong> The minimum-expected-count rule of 5 is Cochran's convention, an external standard I supply; the paper claims no guideline and states no analysis assumptions. Under every convention the result is non-significant, so the conclusion is unaffected.<\/li>\n<li><strong>Consequence:<\/strong> changes no significance decision; 1 stated claim affected -- The paper's sole claim is non-significant under Pearson (p = 0.639), Yates (p = 1.0) and Fisher exact (p = 1.0) alike, so the choice of test changes only how much confidence the printed p-value deserves, not the conclusion. (asserted, not computed)<\/li>\n<li><strong>Reproduce:<\/strong> no runnable command -- the review's command used an option this tool does not have. The finding's own numbers are above; re-derive from those.<\/li>\n<\/ul>\n<h3>4. Unblinded assessment of a largely subjective outcome, and a Methods sentence referring to a placebo the study never used  [SUSPICIOUS | confidence: high]<\/h3>\n<p><strong>In plain terms.<\/strong> Nobody was blinded: with no dummy treatment given, the patients and the surgical team always knew who was still receiving antibiotics, while the decision about whether a wound counted as infected rested largely on a clinician's judgement of swelling, redness and pain. That combination can push results in either direction and the paper does not address it. Separately, the sentence saying patients \"did not receive the placebo\" refers to a placebo that is never introduced anywhere else in the paper -- wording that appears to have been carried over from a placebo-controlled design that was not the study actually run.<\/p>\n<ul>\n<li><strong>Location:<\/strong> Patients and Methods, paragraph 2<\/li>\n<li><strong>Reported:<\/strong> \"The patients in the experimental group received only 1.0 g of a third-generation cephalosporin (Cefpiramide) intravenously 30 minutes before surgery and did not receive the placebo.\" Allocation was by \"randomization codes generated by Microsoft Excel\"; no blinding, no allocation concealment beyond that code list, and no trial registration is described.<\/li>\n<li><strong>Computed:<\/strong> Not computed; this is a reading of the Methods text against the outcome definition. Three of the four CDC surgical-site-infection criteria the paper adopts rest on clinician judgement of swelling, redness, pain, and the decision to open a wound -- and the paper records that the wounds \"were opened by a surgeon\" in the infected cases.<\/li>\n<li><strong>As printed in the paper:<\/strong> \u201cThe patients in the experimental group received only 1.0 g of a third-generation cephalosporin (Cefpiramide) intravenously 30 minutes before surgery and did not receive the placebo.\u201d <em>(found in the paper's text)<\/em><\/li>\n<li><strong>Assumptions:<\/strong> CONSORT item 11a (blinding: if done, who was blinded and how; if not, say so) is an external standard; the paper claims no guideline and predates CONSORT 2010, though the equivalent item existed in CONSORT 2001. The direction of any ascertainment bias is unknown and is not asserted here.<\/li>\n<li><strong>Consequence:<\/strong> 1 stated claim affected -- The single reported comparison depends on assessors who necessarily knew each patient's arm judging signs that are largely subjective, so it is open to ascertainment bias in an undetermined direction. (asserted, not computed)<\/li>\n<li><strong>Reproduce:<\/strong> <code>no command applies; this is a reading of the Methods text in Patients and Methods, paragraph 2<\/code><\/li>\n<\/ul>\n<h3>5. Reported age variability is unreachable for a cohort confined to \"patients in their 20s\"  [SUSPICIOUS | confidence: medium]<\/h3>\n<p><strong>In plain terms.<\/strong> The methods describe the participants as patients in their twenties. The ages reported are spread too widely for that to be literally true: with an average of about 24 and the spread the authors report, some patients must have been outside their twenties. The likeliest explanation by far is simply loose wording -- 'in their 20s' meaning 'young adults' rather than a strict entry rule -- and the age figures themselves are perfectly ordinary and internally sound for a jaw-surgery group. Nothing the study concludes depends on this. It is worth noting only because the paper never states the actual age range, so a reader cannot check who was really enrolled.<\/p>\n<ul>\n<li><strong>Location:<\/strong> Patients and Methods, paragraph 1 (inclusion) read against Results, paragraph 1 and Table 1, Age row<\/li>\n<li><strong>Reported:<\/strong> \"Fifty-six patients in their 20s without a specific medical history\" (Methods); \"The mean (SD) age of the experimental group was 23.9 years (5.84)\" and \"The mean (SD) age of the control group was 24.3 years (6.33)\" (Results). The paper prints no age range and no numeric inclusion cut-offs.<\/li>\n<li><strong>Computed:<\/strong> Treating \"in their 20s\" as the interval [20, 29], the largest standard deviation any 28-person sample can have is 4.58 years. The reported SDs are 5.84 (127% of that ceiling) and 6.33 (138%). The standard-error misreading is worse, not better: read as standard errors these would imply SDs of 30.9 and 33.5 years. Crucially, both values are perfectly attainable once the decade restriction is dropped -- GRIMMER returns consistent for both triples on an unrestricted age range (example: sum 669, sum-of-squares 16905 gives mean 23.893, SD 5.839), and SPRITE reports feasible_ignoring_bounds: true.<\/li>\n<li><strong>As printed in the paper:<\/strong> <strong>Results, paragraph 1 / Table 1, Age row (experimental group)<\/strong> -- \u201cThe mean (SD) age of the experimental group was 23.9 years (5.84) with male-female ratio of 4 : 3.\u201d <em>(found in the paper's text)<\/em><\/li>\n<li><strong>Assumptions:<\/strong> THE BOUND IS MINE, AND IT IS DECISIVE. The paper prints no numerals for an age range; [20, 29] is my translation of the phrase \"in their 20s\", so per rulebook rule 4 this is capped at suspicious and cannot be the paper's headline problem. The tool applied the same cap on its own, reporting bound_source 'assumed'. Ages are also assumed to be whole years, which the paper does not state.<\/li>\n<li><strong>Consequence:<\/strong> changes no significance decision -- Age is a baseline descriptor here; no analysis in the paper is conditioned on it, so no reported result changes either way -- what is in question is only how homogeneous the cohort actually was. (asserted, not computed)<\/li>\n<li><strong>Reproduce:<\/strong> no runnable command -- the review's command used an option this tool does not have. The finding's own numbers are above; re-derive from those.<\/li>\n<\/ul>\n<h3>6. The chi-squared statistic and its degrees of freedom are absent from both the Results and the Abstract  [SUSPICIOUS | confidence: high]<\/h3>\n<p><strong>In plain terms.<\/strong> The paper gives a p-value but not the test result behind it, so on its face the single statistical claim in the study cannot be independently checked. In this case it does no harm, because the table prints the raw patient counts and the test can be rebuilt from them -- which is what was done here, and it matches. It is worth flagging only because this one sentence is the entire statistical content of the paper.<\/p>\n<ul>\n<li><strong>Location:<\/strong> Results, final paragraph; Abstract, Results<\/li>\n<li><strong>Reported:<\/strong> \"According to the chi-squared test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).\" The test statistic and degrees of freedom appear in neither location.<\/li>\n<li><strong>Computed:<\/strong> statcheck run over the body text returned 0 statistics -- there is no complete test result anywhere in the paper for it to verify. The omission is fully remediable here: Table 1 prints the underlying counts, so the test was reconstructed (chi2 = 0.2196, df = 1, p = 0.639339).<\/li>\n<li><strong>Assumptions:<\/strong> None beyond the paper's own text. This is an external reporting expectation I supply -- that a p-value be accompanied by the statistic and degrees of freedom that produced it -- and the paper claims no reporting guideline.<\/li>\n<li><strong>Consequence:<\/strong> changes no significance decision -- No conclusion is affected: Table 1 supplies the cell counts, so the test is recomputable and was recomputed, reproducing the printed p exactly. (asserted, not computed)<\/li>\n<li><strong>Reproduce:<\/strong> <code>metascience statcheck --text \"According to the chi-squared test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).\"<\/code><\/li>\n<\/ul>\n<h2>What we could NOT check<\/h2>\n<ul>\n<li><strong>Discussion, paragraph 5 -- the a-priori power calculation<\/strong> \u2014 Every input is stated (alpha 0.05, power 0.80, p1 = 5%, difference 30 percentage points, n = 28 per arm), so the calculation is in principle fully reproducible. It could not be run because verify_power_analysis and required_n both take Cohen's h for a two-proportions design and no registered tool converts a pair of proportions to h. This is a gap in our toolkit, not a reporting failure by the authors.<\/li>\n<li><strong>Results, final paragraph -- the largest effect still compatible with the null result<\/strong> \u2014 absence_of_evidence requires a confidence interval, or a coefficient with its standard error. The paper prints no interval, risk difference, relative risk or odds ratio for any quantity, and states no smallest effect size of interest, so neither a permitted-effect bound nor an equivalence test could be computed. This is the substance of finding 1.<\/li>\n<li><strong>Table 1, Age row and Sex row -- cell-by-cell checks<\/strong> \u2014 The age cells print with a trailing unit ('23.9 +/- 5.84 yrs') and the sex cells as a ratio ('16 : 12'); the typed parser returned both as non-numeric with an empty candidate-format list, so no declared format could rescue them. All eight data cells went to check_table and none yielded a per-cell check. Nothing was lost: the age values were checked from the Results prose, which prints the same numbers in readable form, and the sex counts by summation.<\/li>\n<li><strong>Table 1 as a whole -- source provenance<\/strong> \u2014 The XML carries Table 1 as an image with no cells, so the grid used here was recovered from the PDF. Every number in it is independently restated in the Results prose of the XML (both age means with SDs, 3 and 2 infections, 1 dehiscence), so the two sources corroborate each other; the sex counts 16:12 and 14:14 rest on the PDF grid alone, though the prose ratios 4:3 and 1:1 are their correct reduced forms.<\/li>\n<li><strong>Baseline comparability of the two arms (csf_test, bayesian_table1_dispersion)<\/strong> \u2014 Both tools need baseline p-values or a set of baseline rows with means, SDs and ns. The paper reports two baseline characteristics only (age, sex), prints no baseline p-values, and performs no baseline comparison. Two rows is far too few for a dispersion or Carlisle-style similarity test, so neither was run and no statement about randomisation integrity can be made either way.<\/li>\n<li><strong>Duplication across tables (detect_duplication)<\/strong> \u2014 The paper contains a single table with exactly two (mean, SD) pairs, and those differ (23.9/5.84 versus 24.3/6.33). There is no second table or second sample to compare against.<\/li>\n<li><strong>Results, paragraph 1 -- mean duration of surgery (3 h 40 min and 3 h 55 min)<\/strong> \u2014 Bare means in clock units with no dispersion and no accompanying test; no registered check applies, and the paper makes no comparison between arms on this measure.<\/li>\n<li><strong>Results, paragraph 1 -- GRIM on the two age means<\/strong> \u2014 The tool refused, and the refusal is the result: at n = 28 with one decimal place every printable value is attainable as a mean of integers, so GRIM has no resolution here. Recorded so it cannot be read as a pass.<\/li>\n<li><strong>Multiplicity correction (multiplicity_report)<\/strong> \u2014 The paper reports exactly one statistical test of one hypothesis. A single planned confirmatory test needs no correction, and running the tool on one p-value would manufacture a family that does not exist.<\/li>\n<li><strong>GRIM-U rank-sum granularity checks<\/strong> \u2014 Deliberately not run. The paper's only p-value comes from a chi-squared test, and GRIM-U applies exclusively to Mann-Whitney/Wilcoxon rank-sum p-values.<\/li>\n<li><strong>Supplementary materials<\/strong> \u2014 No supplementary files accompany this paper in the provided directory; only the XML and the PDF are present. Nothing was refused or unreadable -- there is nothing to read.<\/li>\n<li><strong>Trial registration and protocol<\/strong> \u2014 The paper reports IRB approval by the College of Dentistry, Yonsei University, but cites no registration number or protocol, so prespecification of the outcome and the power calculation could not be verified against any external record. This system reaches no network and could not have checked a registry in any case.<\/li>\n<li><strong>table rows Age (Mean \u00b1 SD), Age (Mean \u00b1 SD), Sex (Male : Female), Sex (Male : Female)<\/strong> \u2014 no applicable check not run: not a numeric cell<\/li>\n<li><strong>table rows Postoperative infection (n), Postoperative infection (n), Wound dehiscence (n), Wound dehiscence (n)<\/strong> \u2014 no applicable check not run: a bare count contributes to table-level checks only<\/li>\n<\/ul>\n<h2>Questions for the authors<\/h2>\n<p><em>Each of these is answerable from what the authors already have. None presupposes an error on their part: an inconsistency is far more often a reporting slip, or a mistake by this tool in reading the number off the page, than anything else.<\/em><\/p>\n<ol>\n<li>Your report gives p = 0.639 for the comparison of postoperative wound infection between arms, based on 3 of 28 versus 2 of 28. Could you send the corresponding effect estimate with a confidence interval -- a risk difference, relative risk or odds ratio -- so that readers can see the range of effects the data remain compatible with?\n   &lt;sub&gt;Would resolve: The paper's only conclusion is a claim of no difference, and nothing printed allows the largest effect still permitted by the data to be bounded. This is the substance of finding 1.&lt;/sub&gt;<\/li>\n<li>The Methods describe \"Fifty-six patients in their 20s\", while the reported age standard deviations are 5.84 years (experimental) and 6.33 years (control) at n = 28 per arm -- values that no sample confined to ages 20-29 can produce. Could you supply the actual minimum and maximum ages, or the age inclusion criteria applied?\n   &lt;sub&gt;Would resolve: Would resolve directly whether 'in their 20s' was a strict entry rule or descriptive shorthand, which is the whole of finding 3.&lt;/sub&gt;<\/li>\n<li>Could you send the chi-squared statistic and degrees of freedom underlying the reported p = 0.639, and confirm whether an exact test was also considered? The expected counts in both infected cells are 2.5, and Fisher's exact test on the same table returns p = 1.0.\n   &lt;sub&gt;Would resolve: Settles which test convention was used and whether the low expected counts were considered. Our reconstruction indicates an uncorrected Pearson chi-squared, which reproduces the printed p exactly.&lt;/sub&gt;<\/li>\n<li>The Discussion states that samples were selected at alpha = 0.05 and beta = 0.20 with a smaller infection rate of 5% and a difference of 30%. Could you provide the worked sample-size calculation, and confirm the date on which it was performed relative to enrolment?\n   &lt;sub&gt;Would resolve: The calculation appears in the Discussion rather than the Methods and no registration is cited, so its timing relative to data collection cannot be established from the published record.&lt;/sub&gt;<\/li>\n<li>The Methods state that the experimental group \"did not receive the placebo\", although no placebo is described elsewhere in the paper. Could you clarify whether any blinding of patients, treating staff or outcome assessors was in place when the CDC surgical-site-infection criteria were applied?\n   &lt;sub&gt;Would resolve: Three of the four outcome criteria rest on clinician judgement, so who knew the allocation at assessment bears directly on the single reported comparison.&lt;/sub&gt;<\/li>\n<\/ol>\n<h2>Limitations<\/h2>\n<ul>\n<li>This agent reads text and does not see figures. In this case that costs nothing: the paper contains no figures at all, its only display item being Table 1, and no statistic in it appears only in a figure. The figure-extraction pass was therefore not run.<\/li>\n<li>Table 1 is an image in the publisher XML and carries no cells there, so its grid came from the PDF. Every value in it is independently corroborated by the Results prose in the XML except the sex counts (16:12, 14:14), which are consistent with the prose ratios 4:3 and 1:1 but not separately restated as counts.<\/li>\n<li>The <code>quote_not_located<\/code> marker fired on all seven of the sweep's accusations. Re-reading the XML located every span verbatim; the cause was uniformly that the sweep's quotes carry doubled inter-word spacing from a PDF text layer while the XML body text is single-spaced. This was a property of our extraction, not of the evidence.<\/li>\n<li>The age-variability finding rests on translating the phrase \"patients in their 20s\" into the interval [20, 29]. The paper prints no numerals for an age range, so that bound is mine and the finding is capped at <code>suspicious<\/code> accordingly. Both GRIMMER and SPRITE confirm the reported age means and SDs are attainable from whole-year ages once the decade restriction is dropped.<\/li>\n<li>The paper's a-priori power calculation could not be reproduced because no registered tool converts a pair of proportions to Cohen's h. Every input needed is stated by the authors, so this is a limit of our toolkit and not a gap in their reporting.<\/li>\n<li>This system reads one paper and reaches no network. It cannot say whether similar patterns appear in other work by these authors, nor how this trial's infection rates compare with equivalent values from other studies in the field -- both of which a reader would want alongside any judgement about a small single-centre trial.<\/li>\n<li>No image forensics were performed. Duplicated, spliced, rotated or otherwise manipulated image panels -- by some accounts the single most productive source of detected problems in the literature -- are outside what this system checks, and their absence here is not evidence of their absence in the paper.<\/li>\n<\/ul>\n<h2>Coverage<\/h2>\n<ul>\n<li><strong>Statistics found:<\/strong> 20; <strong>checked:<\/strong> 14<\/li>\n<li><strong>Tools run:<\/strong> extract_xml, extract_pdf, statcheck, parse_table, parse_cells_typed, check_table, recalc_chi_squared, check_summation_batch, grim_check, grimmer_check, check_sd_or_se, sprite_reconstruct, flag_round_n<\/li>\n<li><strong>Tables checked:<\/strong> Table 1 (Results according to the Postoperative Antibiotic Prophylaxis) -- image_only in the XML, grid recovered from the PDF and corroborated against the Results prose<\/li>\n<li><strong>Every checkable item:<\/strong> 8 registered; 0 refused with a stated reason; <strong>8 outstanding<\/strong><ul>\n<li>how many were CHECKED is not measured -- no persisted item identity joins a tool call back to a manifest row, so how many items were CHECKED cannot be counted. This is not a count of zero. This is not a count of zero.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Stage-1 findings:<\/strong> 19 raised; 12 carried into this report; 7 not carried<\/li>\n<li><strong>Where a check and this review disagreed:<\/strong> 1 sweep finding recorded a severity the validated check behind it did not return (1 upgraded, 0 downgraded). 1 is marked on the entry above that cites it.<\/li>\n<li><strong>Traceable to the page:<\/strong> 19 of 19 checks recorded the passage their numbers were read from; 18 of those were located in the paper's own text.<\/li>\n<li><strong>1 quoted passage is ours, not the paper's.<\/strong> Every number in it was found in the paper, but the sentence around those numbers was assembled by this review and does not appear as written -- so do not search the PDF for it. The CHECK is sourced; only the quotation marks over-promise.<\/li>\n<\/ul>\n<h2>What each check does<\/h2>\n<p>One entry per check that ran on this paper. The <strong>assumptions<\/strong> are the conditions under which its verdict holds; where one is unmet the verdict is capped, not merely caveated.<\/p>\n<h3><code>check_sd_or_se<\/code> \u2014 probabilistic<\/h3>\n<p>Adjudicates whether a reported dispersion value is an SD or a mislabelled SE.<\/p>\n<p><strong>What its verdict means.<\/strong> Probabilistic (plausible vs highly implausible), UNDER THE ASSUMPTIONS below. A flagged result is unlikely if those assumptions hold; if one fails, the finding may have an innocent explanation. Never reported as <code>impossible<\/code>.<\/p>\n<p><strong>Strongest verdict it may reach:<\/strong> <code>highly_suspicious<\/code><\/p>\n<p><strong>It assumes:<\/strong>\n- SD and SE are linked by SE = SD/sqrt(n); n must be the cell's true denominator.\n- A 'neither reading fits' verdict rests ENTIRELY on the plausibility ceiling implied by the variable's range.\n- A ceiling from an ASSUMED bound caps at <code>suspicious<\/code>; only a stated bound licenses <code>highly_suspicious<\/code>.\n- Under the SE reading the rounding interval stretches by sqrt(n).\n- BASE RATE: mislabelling SE as SD is the norm, not an outlier. Olsen (2002) found 35 of 88 studies (40%) reporting the SEM where they said SD. Heathers (2025): 'usually an honest mistake of statistical ignorance, not anything that implies a problem with research integrity.' Report it as a reporting defect; it moves what the numbers MEAN, not what the authors did.<\/p>\n<h3><code>check_summation_batch<\/code> \u2014 probabilistic<\/h3>\n<p>Runs every summation check in one call; the worst row sets the verdict.<\/p>\n<p><strong>What its verdict means.<\/strong> Probabilistic (plausible vs highly implausible), UNDER THE ASSUMPTIONS below. A flagged result is unlikely if those assumptions hold; if one fails, the finding may have an innocent explanation. Never reported as <code>impossible<\/code>.<\/p>\n<p><strong>Strongest verdict it may reach:<\/strong> <code>highly_suspicious<\/code><\/p>\n<p><strong>It assumes:<\/strong>\n- Same premises as check_summation per row.\n- Give <code>decimals<\/code> per row; a row with no printed precision is refused rather than guessed.\n- An all-unevaluated batch is indeterminate, never <code>consistent<\/code>.<\/p>\n<h3><code>check_table<\/code> \u2014 absolute<\/h3>\n<p>Runs every applicable check on a typed table in one call; the worst row wins.<\/p>\n<p><strong>What its verdict means.<\/strong> Absolute (possible vs impossible). Exact arithmetic over the printed values and their rounding intervals. Subject to the preconditions below, a flagged result cannot be produced by any dataset.<\/p>\n<p><strong>Strongest verdict it may reach:<\/strong> <code>impossible<\/code><\/p>\n<p><strong>It assumes:<\/strong>\n- A ROUTER, so the <code>absolute<\/code> class above describes only its CEILING, not every row it returns. <code>impossible<\/code> can still only come from a bound-free arithmetic check; but a <code>highly_suspicious<\/code> or <code>suspicious<\/code> row may have come from a probabilistic one (a Wald-CI judgement, a dispersion plausibility). Read the per-row <code>tool<\/code> and look up ITS card -- the routed check's evidence class governs, not this one.\n- Variables must be truthfully declared -- data_type, bounds and bound_source gate every downstream check.\n- Declare provenance for figure-read values; the exact-arithmetic checks then refuse them rather than judge them.<\/p>\n<h3><code>extract_pdf<\/code> \u2014 descriptive<\/h3>\n<p>Extracts text and resolvable tables from a PDF; renders no verdict.<\/p>\n<p><strong>What its verdict means.<\/strong> Descriptive. Extracts, parses or computes a quantity; it does not itself render a verdict about the paper.<\/p>\n<p><strong>Strongest verdict it may reach:<\/strong> <code>indeterminate<\/code><\/p>\n<p><strong>It assumes:<\/strong>\n- An empty <code>tables<\/code> list does not mean the paper has no tables -- unresolvable grids remain in <code>text<\/code>.<\/p>\n<h3><code>extract_xml<\/code> \u2014 descriptive<\/h3>\n<p>Indexes body text and tables from publisher XML; renders no verdict.<\/p>\n<p><strong>What its verdict means.<\/strong> Descriptive. Extracts, parses or computes a quantity; it does not itself render a verdict about the paper.<\/p>\n<p><strong>Strongest verdict it may reach:<\/strong> <code>indeterminate<\/code><\/p>\n<p><strong>It assumes:<\/strong>\n- Tables flagged alignment_uncertain or image_only must be reconciled against the PDF before use.<\/p>\n<h3><code>flag_round_n<\/code> \u2014 probabilistic<\/h3>\n<p>Triage flag for several distinct sample sizes that are all suspiciously round.<\/p>\n<p><strong>What its verdict means.<\/strong> Probabilistic (plausible vs highly implausible), UNDER THE ASSUMPTIONS below. A flagged result is unlikely if those assumptions hold; if one fails, the finding may have an innocent explanation. Never reported as <code>impossible<\/code>.<\/p>\n<p><strong>Strongest verdict it may reach:<\/strong> <code>highly_suspicious<\/code><\/p>\n<p><strong>It assumes:<\/strong>\n- A base-rate heuristic: fabricated papers over-represent round Ns, but so do honest recruitment targets.\n- Needs at least three reported sizes with at least two distinct before it says anything.\n- Ceiling <code>suspicious<\/code>: a weak signal that escalates only alongside stronger findings.<\/p>\n<h3><code>grim_check<\/code> \u2014 absolute<\/h3>\n<p>Tests whether a mean of integer data is reachable at all for its n and printed precision.<\/p>\n<p><strong>What its verdict means.<\/strong> Absolute (possible vs impossible). Exact arithmetic over the printed values and their rounding intervals. Subject to the preconditions below, a flagged result cannot be produced by any dataset.<\/p>\n<p><strong>Strongest verdict it may reach:<\/strong> <code>impossible<\/code><\/p>\n<p><strong>It assumes:<\/strong>\n- Observations must be integer-valued; continuous data is refused rather than judged.\n- <code>decimals<\/code> must be the precision AS PRINTED -- '5.9' is 1, not 2; a wrong value accuses, so a missing one is refused.\n- Both the round-half and truncation reporting conventions are tried; a truncation-only pass caps at <code>suspicious<\/code>.\n- Range failures on ASSUMED bounds cap at <code>suspicious<\/code>; only stated bounds license <code>impossible<\/code>.\n- GRANULARITY failures cap at <code>suspicious<\/code> unless <code>discreteness_source<\/code> is <code>stated<\/code> or <code>logically_necessary<\/code>: the arithmetic is airtight only if each subject contributed a whole number, and <code>data_type<\/code> merely asserts that.\n- The mean and n must be printed values; figure-read inputs are refused.<\/p>\n<h3><code>grimmer_check<\/code> \u2014 absolute<\/h3>\n<p>Tests whether an SD is reachable for integer data with the reported mean and n.<\/p>\n<p><strong>What its verdict means.<\/strong> Absolute (possible vs impossible). Exact arithmetic over the printed values and their rounding intervals. Subject to the preconditions below, a flagged result cannot be produced by any dataset.<\/p>\n<p><strong>Strongest verdict it may reach:<\/strong> <code>impossible<\/code><\/p>\n<p><strong>It assumes:<\/strong>\n- Both GRANULARITY modes (mean and SD) cap at <code>suspicious<\/code> unless <code>discreteness_source<\/code> is stated or logically necessary -- they are bound-free, not premise-free.\n- Observations must be integer-valued; ordinary continuous values otherwise read as <code>impossible<\/code>.\n- Printed precision must be supplied or inferred correctly -- a wrong assumed precision accuses.\n- Only integer and parity failures license <code>impossible<\/code>; range-dependent failures on assumed bounds cap at <code>suspicious<\/code>.\n- Both the sample and population SD conventions are tried; a population-only match caps at <code>suspicious<\/code>.<\/p>\n<h3><code>parse_cells_typed<\/code> \u2014 descriptive<\/h3>\n<p>Classifies table cells by kind before any check runs; renders no verdict.<\/p>\n<p><strong>What its verdict means.<\/strong> Descriptive. Extracts, parses or computes a quantity; it does not itself render a verdict about the paper.<\/p>\n<p><strong>Strongest verdict it may reach:<\/strong> <code>indeterminate<\/code><\/p>\n<p><strong>It assumes:<\/strong>\n- Cells returned <code>ambiguous<\/code> carry candidate readings and must not be fed to any forensic tool.<\/p>\n<h3><code>parse_table<\/code> \u2014 probabilistic<\/h3>\n<p>Parses a summary table into normalised cells, and can reconcile two renderings of it.<\/p>\n<p><strong>What its verdict means.<\/strong> Probabilistic (plausible vs highly implausible), UNDER THE ASSUMPTIONS below. A flagged result is unlikely if those assumptions hold; if one fails, the finding may have an innocent explanation. Never reported as <code>impossible<\/code>.<\/p>\n<p><strong>Strongest verdict it may reach:<\/strong> <code>highly_suspicious<\/code><\/p>\n<p><strong>It assumes:<\/strong>\n- Parsing alone renders no verdict; a severity appears only when <code>cross_check<\/code> supplies a second rendering.\n- A cross-check disagreement is evidence about OUR EXTRACTION, not about the paper: the likeliest cause by far is that one of the two parsers mis-read the table, so confirm against the source before citing it.\n- Both renderings must be of the SAME table; comparing different tables produces a meaningless disagreement.\n- Drops cells it cannot reduce to a scalar, such as estimate-plus-CI; use the XML cells route for those.<\/p>\n<h3><code>recalc_chi_squared<\/code> \u2014 probabilistic<\/h3>\n<p>Recomputes chi-squared under both 2x2 conventions, plus Fisher's exact p.<\/p>\n<p><strong>What its verdict means.<\/strong> Probabilistic (plausible vs highly implausible), UNDER THE ASSUMPTIONS below. A flagged result is unlikely if those assumptions hold; if one fails, the finding may have an innocent explanation. Never reported as <code>impossible<\/code>.<\/p>\n<p><strong>Strongest verdict it may reach:<\/strong> <code>highly_suspicious<\/code><\/p>\n<p><strong>It assumes:<\/strong>\n- Independent observations, each unit counted in exactly one cell.\n- Expected cell counts large enough for the chi-square approximation, conventionally at least 5.\n- Both the Pearson and Yates conventions are tried, and Fisher's p, before anything is flagged.\n- The likelihood-ratio (G-test) convention is NOT tried, so a paper reporting G can mismatch innocently.<\/p>\n<h3><code>sprite_reconstruct<\/code> \u2014 absolute<\/h3>\n<p>Searches for integer samples matching a reported mean and SD, and proves when none exists.<\/p>\n<p><strong>What its verdict means.<\/strong> Absolute (possible vs impossible). Exact arithmetic over the printed values and their rounding intervals. Subject to the preconditions below, a flagged result cannot be produced by any dataset.<\/p>\n<p><strong>Strongest verdict it may reach:<\/strong> <code>impossible<\/code><\/p>\n<p><strong>It assumes:<\/strong>\n- <code>grim_fail<\/code> and <code>no_solution_proven<\/code> are bound-free but rest on the observations being integers, so they cap at <code>suspicious<\/code> unless <code>discreteness_source<\/code> is stated or logically necessary.\n- Observations must be integers on a bounded scale; continuous measures are refused.\n- Printed precision drives which totals are admissible, so a wrong value accuses.\n- Only a proven no-solution is evidence; an exhausted search is a failed search, never an anomaly.\n- Range-dependent infeasibility rests on the scale bounds and caps at <code>suspicious<\/code> on assumed ones.\n- The population-SD convention is tried before accusing.<\/p>\n<h3><code>statcheck<\/code> \u2014 probabilistic<\/h3>\n<p>Extracts APA-style results and recomputes their p-values for internal consistency.<\/p>\n<p><strong>What its verdict means.<\/strong> Probabilistic (plausible vs highly implausible), UNDER THE ASSUMPTIONS below. A flagged result is unlikely if those assumptions hold; if one fails, the finding may have an innocent explanation. Never reported as <code>impossible<\/code>.<\/p>\n<p><strong>Strongest verdict it may reach:<\/strong> <code>highly_suspicious<\/code><\/p>\n<p><strong>It assumes:<\/strong>\n- Each p is recomputed assuming a two-tailed, unadjusted test.\n- Only APA-formatted results are extracted; everything else is invisible to it.\n- A p correct at its own printed precision is not an error.\n- Inconsistencies are near-universal in honest work and must never support a misconduct verdict alone.<\/p>\n<h2>Narrative<\/h2>\n<p>This is a small single-centre prospective trial from Yonsei University: 56 patients undergoing Le Fort I osteotomy with bilateral intraoral vertical ramus osteotomy were allocated by Excel-generated randomisation codes to receive either a single preoperative dose of cefpiramide or that dose plus three further days of twice-daily antibiotic. The outcome was postoperative wound infection by CDC surgical-site-infection criteria, assessed to two weeks. Three infections occurred in the experimental arm and two in the control arm, and the authors conclude that prolonged prophylaxis may not be necessary.<\/p>\n<p><strong>What the checks bought.<\/strong> Fourteen of the nineteen checks attempted actually ran, and every one of the seven arithmetic checks passed. The paper's entire inferential content is a single sentence, and that sentence reproduces exactly: an uncorrected Pearson chi-squared on the Table 1 counts gives chi-squared = 0.2196, df = 1, p = 0.639339, which rounds to the printed 0.639 -- and the match is close enough to pin down which convention was used. All five count relationships hold exactly with zero tolerance: the arms sum to the enrolled total, both sex breakdowns sum to their arm's n, the per-arm infections sum to five, and -- the most informative of these, because it is an independent restatement rather than a column total -- the narrative account of individual cases (one diagnosed by sinus haziness, four by mandibular signs) sums to the same five. The prose sex ratios 4:3 and 1:1 are the correct reduced forms of the tabulated 16:12 and 14:14. Both age mean/SD pairs are attainable from whole-year ages once no artificial range is imposed. Sample sizes of 56 and 28 do not trip the round-N heuristic. That is what a small, carefully prepared paper looks like, and it is worth saying plainly: nothing in this paper's numbers contradicts anything else in it.<\/p>\n<p>That verdict comes with the open questions named in the same breath, because they are real and a reader should carry them.<\/p>\n<p><strong>On the null conclusion.<\/strong> The paper's problem is not its arithmetic but the distance between what it measured and what it concludes. Five infections across fifty-six patients is very thin evidence for a claim of equivalence, and the paper offers the reader no instrument for judging how thin: no confidence interval, no risk difference, no relative risk, no odds ratio, for any quantity anywhere. The only effect estimate obtainable is one derived here from the counts -- a Fisher odds ratio of 1.56, itself unbounded. The authors' own design parameters say the rest: sized for a contrast between a 5% and a 35% infection rate, this trial was built to detect a thirty-percentage-point gap and observed a one-patient difference. The Discussion does concede that \"the number was small\" and calls for larger studies. The Abstract does not, and the Abstract is what most readers will see.<\/p>\n<p><strong>On the age description.<\/strong> The one genuine tension between two of the paper's own statements is that a cohort described as \"patients in their 20s\" cannot produce age standard deviations of 5.84 and 6.33 years. I should be direct that the ceiling here is mine: the paper prints no age range, so translating that phrase into [20, 29] is my reading, and the checks cap themselves at <code>suspicious<\/code> for exactly that reason. The likeliest explanation by a wide margin is loose phrasing rather than a strict entry rule -- an SD near six years is entirely ordinary for an orthognathic-surgery cohort, and the standard-error misreading is ruled out too, since as standard errors these values would imply SDs of thirty years. Nothing the paper concludes depends on age. It belongs in the review only because the paper never states the range that would settle it.<\/p>\n<p><strong>On the test and the design.<\/strong> Two smaller points, neither of which changes an answer. The chi-squared approximation is being asked to work with expected counts of 2.5 in both infected cells, where an exact test is the conventional choice; the conclusion is unchanged under all three conventions (Pearson 0.639, Yates 1.0, Fisher 1.0), so what is at stake is only how much weight the figure 0.639 deserves. And the paper reports its p-value without the statistic or degrees of freedom that produced it -- ordinarily an obstacle to verification, though here fully remediable, since Table 1 supplies the counts and the test was rebuilt from them.<\/p>\n<p>Finally, a design observation that no number can express: with no placebo given, everyone knew which patients were still receiving antibiotics, while three of the four criteria defining the outcome rest on clinician judgement of swelling, redness and pain. The Methods sentence referring to \"the placebo\" -- a placebo introduced nowhere else in the paper -- suggests wording carried over from a design that was not the one run.<\/p>\n<p>The numbers reported here reconcile with each other and with the statistics printed beside them. The conclusion drawn from them is weaker than the abstract implies.<\/p>\n<h2>How to read this<\/h2>\n<p><strong>What this document is.<\/strong> An automated check of a paper against itself: whether\nthe numbers it reports are mutually consistent, whether any dataset could have\nproduced them, whether its statistics follow from the values printed beside\nthem, and whether its own record -- tables, references, supplementary material\n-- holds together. Where it says a value is \"impossible\", it means the reported\nfigures contradict one another arithmetically.<\/p>\n<p><strong>What this document is not.<\/strong> It is not a finding of fraud, misconduct, error,\nor bad faith, and it is not adequate for definitive detection of any of those.\nAn inconsistency has many ordinary causes, and the innocent ones are far more\ncommon than the guilty ones: typographical error, rounding or transcription\nslips, a mislabelled sample size, values copied from a superseded analysis, or\n-- most often -- a mistake by this tool in reading the number off the page.<\/p>\n<p><strong>The base rates that matter here.<\/strong> In our own ground-truth corpus, half of the\nclean control papers contain at least one statcheck inconsistency. Reporting\nerrors are near-universal in honest work. Separately, nearly all of this\npipeline's failure lives in getting numbers off a PDF, not in the arithmetic:\nthe arithmetic is exact and the extraction is not. Any individual flag in this\nreport is therefore much more likely to be our extraction error than the\nauthors' misconduct.<\/p>\n<p><strong>Anything marked <code>indeterminate<\/code> is a refusal, not a negative result.<\/strong> It means\na precondition could not be verified and the tool declined to judge. It is not\nevidence of a problem, and it is not evidence of the absence of one.<\/p>\n<p><strong>What it has been tested on.<\/strong> at least 37 runs over 19 papers, almost all of them\nprimary biomedical or psychology research and most of them human randomised\ntrials. No qualitative, bench-science, -omics, or non-biomedical paper has ever\nbeen through it, and no claim here about its accuracy transfers to one. It is\n<strong>not designed for narrative reviews<\/strong> -- their numbers belong to the papers\nthey cite, so a flag would land on the wrong authors -- and auditing a\n<strong>meta-analysis or systematic review<\/strong> is a separate undertaking with different\ntools, which this is not. The full breakdown is in \"What this has been tested\non\", below.<\/p>\n<p><strong>Before treating anything here as a problem:<\/strong> verify the number by hand against\nthe published paper, since the most likely explanation is that this tool misread\nit. If it holds up, the appropriate next step is to contact the corresponding\nauthor and ask -- most discrepancies are resolved by a correction or an\nexplanation. Requesting the raw data is the only thing that can actually settle\nthe question. Public allegations are not an appropriate use of this output.<\/p>\n<h2>What this has been tested on<\/h2>\n<p>The checks in this report were built and calibrated against a small corpus. Naming it is not modesty -- it is the denominator you need in order to know how much of it to believe for YOUR paper.<\/p>\n<p>The archive holds <strong>35 runs over 19 papers<\/strong> (three of them blinded). Of those, 28 runs on 16 identifiable papers have been classified by design, by reading the reports:<\/p>\n<ul>\n<li>Human randomised trials and their follow-ups -- 12 runs (the bulk of it -- 3-arm rTMS trial, stroke RCTs, a pooled 2-RCT analysis, a home-visiting follow-up, blinded-control and antibiotics trials)<\/li>\n<li>Rodent / preclinical neuroscience -- 2 runs (nanoparticle toxicity, ischaemia models)<\/li>\n<li>Observational multilevel community psychology -- 3 runs (coalition study)<\/li>\n<li>Complex-survey cross-sectional epidemiology -- 2 runs (veterans / suicidality)<\/li>\n<li>Social-psychology laboratory experiments -- 2 runs (one of them retracted)<\/li>\n<li>Cost-effectiveness analysis -- 1 run (a Markov cost-utility model)<\/li>\n<li>Retrospective records with latent-class analysis -- 1 run (inpatient comorbidities)<\/li>\n<li>Ecological momentary assessment / intensive longitudinal -- 4 runs (mediation model; three of the four are 2026-08-11 re-runs of the same paper -- the warrant-schema run and the clamped re-run are the repeat-run pair)<\/li>\n<li>A correction notice -- 1 run (not a study at all; the run correctly said so and audited the notice)<\/li>\n<\/ul>\n<p><strong>Designs with no representation at all.<\/strong> Nothing resembling these has ever been through this pipeline, so no claim here about its accuracy transfers to them:<\/p>\n<ul>\n<li>qualitative and mixed-methods research<\/li>\n<li>bench chemistry, materials science and physics<\/li>\n<li>genomics and other high-throughput -omics<\/li>\n<li>economics, political science and other quantitative social science outside psychology<\/li>\n<li>any field outside biomedicine and psychology (one environmental-journal paper is itself a clinical rehabilitation study)<\/li>\n<li>single-case and small-N designs<\/li>\n<li>simulation and modelling studies<\/li>\n<\/ul>\n<p><strong>Document kinds this is not the instrument for:<\/strong><\/p>\n<ul>\n<li><strong>A narrative review<\/strong> -- not designed for. Nearly every number in a narrative review is quoted from somebody else's paper. Checking those numbers tests the papers being reviewed, not the review, so a flag lands on authors who did not produce the value. Do not use this output to judge a narrative review.<\/li>\n<li><strong>A systematic review<\/strong> -- a separate undertaking. Auditing a systematic review means auditing its search strategy, its inclusion criteria and how they were applied, its extraction procedure and its risk-of-bias assessment. None of that is what the checks here test. Treat any consistency result below as narrow bookkeeping about the numbers printed, not as an assessment of the review.<\/li>\n<li><strong>A meta-analysis<\/strong> -- a separate undertaking. A meta-analysis's own numbers are pooled estimates, weights and heterogeneity statistics. What makes one sound -- search completeness, correct effect-size conversion, publication-bias analysis, the independence of the included samples -- is a different audit with different tools, and this toolkit does not perform it. Granularity checks in particular say nothing useful about a pooled standardised mean difference.<\/li>\n<\/ul>", "report_obj": {"confidence": "medium", "verdict": "reconciles", "headline": {"statement": "Every number this paper prints reconciles with every other number it prints -- the single significance test reproduces exactly from the counts in Table 1 -- but the paper draws a conclusion of \"no difference\" from five infections in fifty-six patients without reporting any confidence interval or effect estimate, and describes its cohort as \"patients in their 20s\" while reporting age variability no single decade can produce.", "severity": "none", "rests_on": "logical_necessity", "evidence": "\"There were 3 infections in the experimental group and 2 infections in the control group\" and \"there was no significant difference in the prevalence of postoperative wound infections ... (p = 0.639)\": the uncorrected Pearson chi-squared on [[3,25],[2,26]] gives chi2 = 0.2196, df = 1, p = 0.639339, which rounds to the printed 0.639. All five count sums reconcile exactly (28+28=56; 16+12=28; 14+14=28; 3+2=5; 1+4=5).", "reproduction": "metascience chi2 --observed \"[[3,25],[2,26]]\" --reported-p 0.639 --decimals-p 3", "plain": "The arithmetic in this small surgical trial holds up: the one statistical test it reports can be reproduced exactly from the patient counts it prints, and every total adds up. What the reader should weigh instead is that only five patients in the whole study developed an infection, and from that the authors conclude that extra antibiotics after surgery \"may not be necessary\" withou             ", "anchor": "sweep_ancestor", "anchored": true}, {"rank": 2, "title": "Trial sized only to detect a 30-percentage-point difference in infection rates, and the abstract states the null conclusion without that qualification", "severity": "suspicious", "confidence": "high", "location": "Discussion, paragraph 5, read against Table 1 and the Abstract Conclusion", "reported": "\"Twenty eight patients were enrolled in each group. The samples were selected at a significance level of alpha = 0.05 and a test power beta = 0.20. A smaller infection rate was set to 5%, and the difference in the estimated infection rate was set to 30%.\" Observed: 3 of 28 versus 2 of 28.", "computed": "Not computed. Stated by quotation from the paper's own design parameters: the design targets a contrast between a 5% and a 35% infection rate, and the observed contrast is a one-patient difference. The a-priori calculation could not be reproduced -- verify_power_analysis and required_n both take Cohen's h for a two-proportions design and no registered tool converts a pair of proportions to h, so this is recorded as a gap in our toolkit and not as a defect in the paper.", "assumptions": "None beyond the paper's own statements. No arithmetic is claimed for this finding; the power calculation itself was not verified, and every input needed to verify it is stated by the paper.", "warrant": "logical", "reproduction": "no command applies; this is a reading of the paper's own stated design parameters in Discussion paragraph 5 against the counts in Table 1", "stage1_finding_ids": ["design_powered_only_for_a_very_large_effect", "power_analysis_unverifiable"], "consequence": {"flips_significance": false, "claims_affected": 1, "basis": "asserted", "explanation": "The Abstract's unqualified conclusion that prophylaxis 'may not be necessary' rests on a design the paper's own printed parameters show was sized only for a 30-percentage-point difference, so a clinically meaningful smaller difference was never detectable."}, "plain": "Before running the study the authors calculated how many patients they needed, assuming they were looking for a very large difference -- roughly 5% of one group getting infected versus 35% of the other. A study built to spot a gap that big is nearly blind to a smaller but still important one. The main text does acknowledge that the numbers were small and that larger studies are needed; the abstract, which is what most readers see, states the conclusion without that caveat. Two further points a reader should note: the power calculation appears in the discussion rather than the methods, and the paper cites no trial registration, so there is no way to confirm it was done before the data were collected.", "reproduction_valid": null, "reproduction_kind": "no_command_applies", "anchor": "sweep_ancestor", "anchored": true}, {"rank": 4, "title": "Chi-squared applied where all expected infected-cell counts are 2.5, with no exact test reported", "severity": "suspicious", "confidence": "high", "location": "Patients and Methods, statistical analysis paragraph; Results, final paragraph", "reported": "\"Statistical analysis was performed using a chi-squared test on the Statistical Package for the Social Sciences (SPSS for windows, ver. 12.0)\", yielding \"(p = 0.639)\". No exact test is mentioned anywhere.", "computed": "The expected-count array from the 2x2 is [[2.5, 25.5], [2.5, 25.5]] -- both infected cells fall below the conventional minimum of 5 for the chi-squared approximation. The reported p is nonetheless exactly right for the convention actually used: uncorrected Pearson gives p = 0.639339. Under the alternatives ordinarily preferred at these counts, Fisher's exact gives p = 1.0 and the Yates-corrected chi-squared gives p = 1.0.", "assumptions": "The minimum-expected-count rule of 5 is Cochran's convention, an external standard I supply; the paper claims no guideline and states no analysis assumptions. Under every convention the result is non-significant, so the conclusion is unaffected.", "warrant": "field_norm", "reproduction": "metascience chi2 --observed \"[[3,25],[2,26]]\" --reported-p 0.639 --decimals-p 3", "stage1_finding_ids": ["chi2_expected_counts_below_5", "chi2_reproduces"], "consequence": {"flips_significance": false, "claims_affected": 1, "basis": "asserted", "explanation": "The paper's sole claim is non-significant under Pearson (p = 0.639), Yates (p = 1.0) and Fisher exact (p = 1.0) alike, so the choice of test changes only how much confidence the printed p-value deserves, not the conclusion."}, "plain": "With only five infections spread across fifty-six patients, the standard chi-squared test the authors used is not really the right tool -- it is an approximation that needs more events than this to be reliable, and an exact test is the usual choice. This is not a case where it matters to the answer: the result is 'no significant difference' whichever of the three standard tests you run. It matters to how much weight the specific figure 0.639 should carry. Reaching for the software's default output here is extremely common in this literature.", "reproduction_kind": "command", "reproduction_valid": false, "reproduction_problem": "exited 2: Usage: metascience chi2 [OPTIONS]\nTry 'metascience chi2 --help' for help.\n\u256d\u2500 Error \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u256e\n\u2502 No such option: --decimals-p               ", "anchor": "sweep_ancestor", "anchored": true}, {"rank": 5, "title": "Unblinded assessment of a largely subjective outcome, and a Methods sentence referring to a placebo the study never used", "severity": "suspicious", "confidence": "high", "location": "Patients and Methods, paragraph 2", "reported": "\"The patients in the experimental group received only 1.0 g of a third-generation cephalosporin (Cefpiramide) intravenously 30 minutes before surgery and did not receive the placebo.\" Allocation was by \"randomization codes generated by Microsoft Excel\"; no blinding, no allocation concealment beyond that code list, and no trial registration is described.", "computed": "Not computed; this is a reading of the Methods text against the outcome definition. Three of the four CDC surgical-site-infection criteria the paper adopts rest on clinician judgement of swelling, redness, pain, and the decision to open a wound -- and the paper records that the wounds \"were opened by a surgeon\" in the infected cases.", "assumptions": "CONSORT item 11a (blinding: if done, who was blinded and how; if not, say so) is an external standard; the paper claims no guideline and predates CONSORT 2010, though the equivalent item existed in CONSORT 2001. The direction of any ascertainment bias is unknown and is not asserted here.", "warrant": "named_guideline", "reproduction": "no command applies; this is a reading of the Methods text in Patients and Methods, paragraph 2", "stage1_finding_ids": ["unblinded_no_placebo_subjective_outcome"], "consequence": {"flips_significance": null, "claims_affected": 1, "basis": "asserted", "explanation": "The single reported comparison depends on assessors who necessarily knew each patient's arm judging signs that are largely subjective, so it is open to ascertainment bias in an undetermined direction."}, "plain": "Nobody was blinded: with no dummy treatment given, the patients and the surgical team always knew who was still receiving antibiotics, while the decision about whether a wound counted as infected rested largely on a clinician's judgement of swelling, redness and pain. That combination can push results in either direction and the  the paper does not state.", "warrant": "logical", "reproduction": "metascience sd-or-se --reported-value 5.84 --n 28 --reported-as SD --decimals 2 --variable-range-min 20 --variable-range-max 29 --bound-source assumed", "stage1_finding_ids": ["age_sd_vs_in_their_20s_experimental", "age_sd_vs_in_their_20s_control", "sprite_age_within_a_single_decade", "grimmer_age_experimental", "grimmer_age_control"], "consequence": {"flips_significance": false, "claims_affected": 0, "basis": "asserted", "explanation": "Age is a baseline descriptor here; no analysis in the paper is conditioned on it, so no reported result changes either way -- what is in question is only how homogeneous the cohort actually was."}, "plain": "The methods describe the participants as patients in their twenties. The ages reported are spread too widely for that to be literally true: with an average of about 24 and the spread the authors report, some patients must have been outside their twenties. The likeliest explanation by far is simply loose wording -- 'in their 20s' meaning 'young adults' rather than a strict entry rule -- and the age figures themselves are perfectly ordinary and internally sound for a jaw-surgery group. Nothing the study concludes depends on this. It is worth noting only because the paper never states the actual age range, so a reader cannot check who was really enrolled.", "reproduction_kind": "command", "reproduction_valid": false, "reproduction_problem": "exited 2: Usage: metascience sd-or-se [OPTIONS] REPORTED_VALUE N\nTry 'metascience sd-or-se --help' for help.\n\u256d\u2500 Error \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u256e\n\u2502 No such option: --", "anchor": "sweep_ancestor", "anchored": true}, {"rank": 6, "title": "The chi-squared statistic and its degrees of freedom are absent from both the Results and the Abstract", "severity": "suspicious", "confidence": "high", "location": "Results, final paragraph; Abstract, Results", "reported": "\"According to the chi-squared test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).\" The test statistic and degrees of freedom appear in neither location.", "computed": "statcheck run over the body text returned 0 statistics -- there is no complete test result anywhere in the paper for it to verify. The omission is fully remediable here: Table 1 prints the underlying counts, so the test was reconstructed (chi2 = 0.2196, df = 1, p = 0.639339).", "assumptions": "None beyond the paper's own text. This is an external reporting expectation I supply -- that a p-value be accompanied by the statistic and degrees of freedom that produced it -- and the paper claims no reporting guideline.", "warrant": "field_norm", "reproduction": "metascience statcheck --text \"According to the chi-squared test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).\"", "stage1_finding_ids": ["no_test_statistic_or_df_reported"], "consequence": {"flips_significance": false, "claims_affected": 0, "basis": "asserted", "explanation": "No conclusion is affected: Table 1 supplies the cell counts, so the test is recomputable and was recomputed, reproducing the printed p exactly."}, "plain": "The paper gives a p-value but not the test result behind it, so on its face the single statistical claim in the study cannot be independently checke "This is a small single-centre prospective trial from Yonsei University: 56 patients undergoing Le Fort I osteotomy with bilateral intraoral vertical ramus osteotomy were allocated by Excel-generated randomisation codes to receive either a single preoperative dose of cefpiramide or that dose plus three further days of twice-daily antibiotic. The outcome was postoperative wound infection by CDC surgical-site-infection criteria, assessed to two weeks. Three infections occurred in the experimental arm and two in the control arm, and the authors conclude that prolonged prophylaxis may not be necessary.\n\n**What the checks bought.** Fourteen of the nineteen checks attempted actually ran, and every one of the seven arithmetic checks passed. The paper's entire inferential content is a single sentence, and that sentence reproduces exactly: an uncorrected Pearson chi-squared on the Table 1 counts gives chi-squared = 0.2196, df = 1, p = 0.639339, which rounds to the printed 0.639 -- and the match is close enough to pin down which convention was used. All five count relationships hold exactly with zero tolerance: the arms sum to the enrolled total, both sex breakdowns sum to their arm's n, the per-arm infections sum to five, and -- the most informative of these, because it is an independent restatement rather than a column total -- the narrative account of individual cases (one diagnosed by sinus haziness, four by mandibular signs) sums to the same five. The prose sex ratios 4:3 and 1:1 are the correct reduced forms of the tabulated 16:12 and 14:14. Both age mean/SD pairs are attainable from whole-year ages once no artificial range is imposed. Sample sizes of 56 and 28 do not trip the round-N heuristic. That is what a small, carefully prepared paper looks like, and it is worth saying plainly: nothing in this paper's numbers contradicts anything else in it.\n\nThat verdict comes with the open questions named in the same breath, because they are real and a reader should carry them.\n\n**On the null conclusion.** The paper's problem is not its arithmetic but the distance between what it measured and what it concludes. Five infections across fifty-six patients is very thin evidence for a claim of equivalence, and the paper offers the reader no instrument for judging how thin: no confidence interval, no risk difference, no relative risk, no odds ratio, for any quantity anywhere. The only effect estimate obtainable is one derived here from the counts -- a Fisher odds ratio of 1.56, itself unbounded. The authors' own design parameters say the rest: sized for a contrast between a 5% and a 35% infection rate, this trial was built to detect a thirty-percentage-point gap and observed a one-patient difference. The Discussion does concede that \"the number was small\" and calls for larger studies. The Abstract does not, and the Abstract is what most readers will see.\n\n**On the age description.** The one genuine tension between two of the paper's own statements is that a cohort described as \"patients in their 20s\" cannot produce age standard deviations of 5.84 and 6.33 years. I should be direct that the ceiling here is mine: the paper prints no age range, so translating that phrase into [20, 29] is my reading, and the checks cap themselves at `suspicious` for exactly that reason. The likeliest explanation by a wide margin is loose phrasing rather than a strict entry rule -- an SD near six years is entirely ordinary for an orthognathic-surgery cohort, and the standard-error misreading is ruled out too, since as standard errors these values would imply SDs of thirty years. Nothing the paper concludes depends on age. It belongs in the review only because the paper never states the range that would settle it.\n\n**On the test and the design.** Two smaller points, neither of which changes an answer. The chi-squared approximation is being asked to work with expected counts of 2.5 in both infected cells, where an exact test is the conventional choice; the conclusion is unchanged under all three conventions (Pearson 0.639, Yates 1.0, Fisher 1.0), so what is at stake is only how much weight the figure 0.639 deserves. And the paper reports its p-value without the statistic or degrees of freedom that produced it -- ordinarily an obstacle to verification, though here fully remediable, since Table 1 supplies the counts and the test was rebuilt from them.\n\nFinally, a design observation that no number can express: with no placebo given, everyone knew which patients were still receiving antibiotics, while three of the four criteria defining the outcome rest on clinician judgement of swelling, redness and pain. The Methods sentence referring to \"the placebo\" -- a placebo introduced nowhere else in the paper -- suggests wording carried over from a design that was not the one run.\n\nThe numbers reported here reconcile with each other and with the statistics printed beside them. The conclusion drawn from them is weaker than the abstract implies."}, "run_meta": {"paper_id": "10.3349--ymj.2009.50.1.55", "mode": "two_stage", "schema_version": "1.0", "analysed_at": "2026-08-18 12:15 UTC", "version": "0.1.0", "effort": "high", "git_dirty": "unknown", "prompt_sha256": "6c57afcbac14716f", "registry_sha256": "95687062d36d7532", "text_provenance": {"by_file": {"10.3349--ymj.2009.50.1.55.pdf": {"extractor": "docling", "n_chars": 20011}}, "docling_version": "2.119.0", "n_docling": 1, "n_pdfplumber": 0, "all_high_fidelity": true, "note": "1 file(s) read by docling, 0 by pdfplumber."}, "stages": {"sweep": {"model": "opus", "input_tokens": 20, "output_tokens": 60822, "cache_creation_input_tokens": 118048, "cache_read_input_tokens": 1236713, "wall_seconds": 659.09, "return_code": 0, "is_error": false, "error_subtype": null, "truncated_by_budget": false, "models_resolved": ["claude-haiku-4-5-20251001", "claude-opus-5"], "model_usage": {"claude-haiku-4-5-20251001": {}, "claude-opus-5": {}}, "primary_billed_model": "claude-opus-5", "fallba sourceable": false, "is_error": false, "input": {"xml_path": "<home>/agent_for_forensic_metascience/eval/ground_truth/papers/10.3349--ymj.2009.50.1.55/10.3349--ymj.2009.50.1.55.xml"}, "result": "{\n  \"text\": \"## The Efficacy of Postoperative Prophylactic Antibiotics in Orthognathic Surgery: A Prospective Study in Le Fort I Osteotomy and Bilateral Intraoral Vertical Ramus Osteotomy\\n\\n## INTRODUCTION\\nAntibiotics are used to treat and prevent postoperative infections. In 1960, it was reported that pathogens are present during surgery[1],[2] regardless of how aseptic the surgery might appear. Moreover, the correlation between prophylactic antibiotics and postoperative wound infections was demonstrated. Therefore, prophylactic antibiotics are now used in almost all surgical procedures. The most effective method of antibiotic prophylaxis is the preoperative administration of antibiotics because it can act at the time when the wound is potentially contaminated by bacteria.[2]\\u207b[4] On the other hand, it was also reported that the use of antibiotics after 3 - 4 hours of a bacterial invasion is unsuitable.[5]\\n\\nProphylactic antibiotics are generally administered both preoperatively and postoperatively. Hence, the effects of the indiscriminate method and period of administration are unclear, considering the multiple factors that contribute to postoperative wound infections.[6]\\u207b[8]\\n\\nThe use of antibiotic prophylaxis is controversial even in orthognathic surgery, which is a representative procedure for oral and maxillofacial surgery. There are reports show no increase in the incidence of infection without the administration of postoperative prophylactic antibiotics.[9],[10] On the other hand, there are reports to suggest the necessity of continuous antibiotic administration.[11] However, orthognathic surgery is mainly performed on young patients without a specific medical history. Moreover, the number of factors associated with the development of postoperative wound infections decreases as the procedure becomes more generalized and its technique advances.\\n\\nThe aims of this clinical study were to evaluate the prevalence of postoperative wound infections wi\n... [clipped]", "vignette": {"asked": {"question": "Indexes body text and tables from publisher XML; renders no verdict.", "no_question": false, "not_a_check": false, "values": [{"name": "xml_path", "value": "10.3349--ymj.2009.50.1.55.xml", "role": "input"}]}, "paper": {"state": "not_offered", "note": "This call reads the document rather than a reported value, so it was never offered a source passage. There is no quote to show and none is missing."}, "computed": {"errored": false, "verdict": null, "method": "", "no_method": true, "detail": "", "figures": [{"name": "tables_mode", "value": "index"}, {"name": "how_to_get_a_table", "value": "Cells are not included here. Call get_table(xml_path, table_num) for the full grid of any table listed above, with its footnotes."}, {"name": "num_pages", "value": "6"}, {"name": "truncated", "value": "no"}, {"name": "source_format", "value": "jats"}, {"name": "unit", "value": "section"}, {"name": "n_tables", "value": "1"}, {"name": "n_tables_image_only", "value": "1"}], "n_more": 6}, "means": {"verdict": null, "scope": "This call returned DATA, not a judgement. Descriptive tools render no verdict; what follows from these numbers is decided by the checks that read them.", "evidence": "descriptive", "evidence_meaning": "Descriptive. Extracts, parses or computes a quantity; it does not itself render a verdict about the paper.", "ceiling": "indeterminate"}, "changes": [{"lever": "1 value this call could not read", "detail": "1 table(s) are images in the XML and have no cells; get them from the PDF or record them as unchecked A value we could not parse was not checked. It is not a value the paper got wrong, and nothing about it is cleared by this call's verdict."}, {"lever": "A different extraction would give this call different

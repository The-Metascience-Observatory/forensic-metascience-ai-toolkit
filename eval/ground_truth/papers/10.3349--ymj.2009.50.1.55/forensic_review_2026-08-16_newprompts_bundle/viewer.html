im to follow CONSORT. The direction of any resulting bias is not determinable from what is reported, and with 3 and 2 events the question does not affect the significance of the result. The paper is transparent that no placebo was given, which is to its credit.", "warrant": "named_guideline", "reproduction": "No command applies: this is a design observation read from the Methods, not a computation.", "stage1_finding_ids": ["unblinded_allocation_with_subjective_outcome"], "consequence": {"flips_significance": null, "claims_affected": 1, "basis": "asserted", "explanation": "The infection counts that the single reported test is computed from were judged in part on subjective signs by an unmasked assessor, which bears directly on the primary outcome."}, "plain": "Deciding whether a surgical wound is infected involves judgement calls about swelling, redness and pain. In this trial the surgeon who performed every operation also knew which patients had been given the extra antibiotics, and no one independent was brought in to make that call. That does not mean the counts are wrong, and the paper is upfront that no dummy treatment was used -- but a reader who assumes a randomised trial means an impartial assessment should know that this one did not have one.", "reproduction_valid": null, "reproduction_kind": "no_command_applies", "anchor": "sweep_ancestor", "anchored": true}, {"rank": 5, "title": "\"Test power \u03b2=0.20\" mislabels the type II error rate in the sentence justifying the sample size", "severity": "suspicious", "confidence": "high", "location": "Discussion, sample-size paragraph", "reported": "\"The samples were selected at a significance level of \u03b1=0.05 and a test power \u03b2=0.20.\"", "computed": "No computation. As printed, the sentence asserts 20% power alongside \u03b1 = 0.05, which describes a design no one would run and which is inconsistent with the 28-per-group sample the same paragraph reports. The conventional reading -- \u03b2 as the type II error rate, giving power of 1 \u2212 \u03b2 = 0.80 -- is the one the stated sample size fits.", "assumptions": "None beyond the paper's own statements. The intended meaning is unambiguous from context; this is recorded because it sits in a load-bearing methods sentence rather than in incidental text.", "warrant": "logical", "reproduction": "No command applies: this is a notation error read off the sentence, not a computation.", "stage1_finding_ids": ["beta_labelled_as_test_power"], "consequence": {"flips_significance": false, "claims_affected": 0, "basis": "asserted", "explanation": "No reported number changes; the sample size of 28 per arm is stated independently and is consistent with the conventional reading of \u03b2 = 0.20 as the type II error rate."}, "plain": "One sentence calls the number 0.20 the study's \"test power\". By standard convention 0.20 there is the chance of missing a real effect, which makes the power 0.80 -- and 0.80 is what the study's group sizes fit. Taken literally the sentence would describe a study designed to fail four times out of five. It is a wording slip that changes none of the results, but it sits in the one sentence a reader would use to check how the sample size was chosen.", "reproduction_valid": null, "reproduction_kind": "no_command_applies", "anchor": "sweep_ancestor", "anchored": true}, {"rank": 6, "title": "No numeric age range reported, leaving the cohort-homogeneity premise that motivates the study unverifiable", "severity": "indeterminate", "confidence": "medium", "location": "Patients and Methods, first sentence; Table 1 Age row; Discussion, paragraph 3", "reported": "\"Fifty-six patients in their 20s without a specific medical history ... were enrolled in this study.\" Table 1 gives ages as \"23.9\u00b15.84 yrs\" and \"24.3\u00b16.33 yrs\". The Discussion criticises prior work because \"wide range of patient's age, small group size, and various osteomies may cause difficulties when precisely evaluating the efficacy of prophylactic antibiotics\", and positions this study as examining \"young patients\". No minimum or maximum age is printed anywhere.", "computed": "Both age cells PASS the arithmetic check that applies to them: grimmer_check finds valid integer (sum, sum-of-squares) solutions for 23.9 \u00b1 5.84 at n = 28 (five combinations, e.g. sum 669, sum-of-squares 16905) and for 24.3 \u00b1 6.33 (four combinations), so the printed pairs are internally coherent. Separately, check_sd_range against an age band of 20-29 returns both SDs above the 4.583 ceiling that band permits (5.84 is 1.27x, 6.33 is 1.38x) -- but [20, 29] is MY translation of the prose \"in their 20s\", not numerals the paper prints, so that result establishes nothing about the paper. check_proportion_from_normal on 0 of 28 below age 20 gives binomial p = 0.00062 yet explicitly does NOT violate its distribution-free bound [0.0000, 0.6916], so a skewed age distribution accounts for the SDs without any reporting error.", "assumptions": "The [20, 29] range is assumed, not stated -- it is a reading of the phrase \"in their 20s\", which reads at least as naturally as loose shorthand for a young-adult cohort as it does as an inclusion criterion. The paper is silent, so the innocent explanation stands and this is graded indeterminate rather than as a defect. CONSORT 2001 item 3 (eligibility criteria for participants) is cited as the reason a numeric range would have settled it; the paper does not claim CONSORT.", "warrant": "named_guideline", "reproduction": "metascience sd-range --sd 5.84 --min-val 20 --max-val 29 --n 28 --decimals-sd 2 --bound-source assumed", "stage1_finding_ids": ["age_sd_versus_stated_age_band", "age_proportion_below_twenty"], "consequence": {"flips_significance": false, "claims_affected": 1, "basis": "asserted", "explanation": "The study's stated rationale is that a narrow, young age range removes a confounder that compromised earlier trials, and with no numeric range printed a reader cannot check whether this cohort was in fact narrower than the ones it criticises."}, "plain": "The paper describes its patients only as being \"in their 20s\", and never gives the youngest and oldest ages. Its own spread figures suggest a wider age span than that phrase implies, though a genuinely lopsided age distribution would explain both without anything being wrong -- and the arithmetic of the age figures themselves checks out. This matters because the study's whole rationale is that earlier trials were muddied by patients of widely varying ages, so a reader has no way to confirm that this trial actually avoided the problem it set out to fix. This is an open question, not an error.", "reproduction_kind": "command", "reproduction_valid": false, "reproduction_problem": "THE COMMAND DISAGREES WITH THE FINDING: it reports `highly_suspicious` where the finding claims `indeterminate`. The command ran perfectly well -- that is the point. Re-read the finding before the paper.", "anchor": "sweep_ancestor", "anchored": true}], "triage": [{"stage1_finding_id": "age_sd_versus_stated_age_band", "disposition": "downgraded", "reason": "Downgraded suspicious -> indeterminate. check_sd_range returns highly_suspicious only against a [20, 29] band that is my translation of the prose \"in their 20s\"; the paper prints no numeric age range anywhere, so under the silence rule the loose-shorthand reading stands and the tool result establishes nothing about the paper. Both markers on this item are resolved: the quoted span was located verbatim in the XML Methods, and the assumed bound is now named in the finding and caps it. GRIMMER, which needs no invented bound, passes both age cells."}, {"stage1_finding_id": "age_proportion_below_twenty", "disposition": "merged", "reason": "Merged into the age finding above -- it is the same tension viewed distribution-aware, and it declines to convict: the observed 0/28 below age 20 sits inside the distribution-free bound [0.0000, 0.6916], so a skewed age distribution explains the SDs and the prose together."}, {"stage1_finding_id": "design_powered_for_a_much_larger_difference", "disposition": "merged", "reason": "Merged into the null-conclusion finding. Both are one underlying problem -- the paper accepts the null without stating what its data could exclude -- and reporting them separately would double-count a single defect against the same claim."}, {"stage1_finding_id": "no_trial_registration", "disposition": "discarded", "reason": "An era-contingent absence, not a defect. The trial was submitted in March 2008, the paper names IRB approval, and the sweep itself graded this indeterminate while stating it was not presented as a defect; publishing it would read to a lay reader as a violation of a rule this paper never owed."}, {"stage1_finding_id": "table1_cell_typing_coverage_gap", "disposition": "discarded", "reason": "This is our extraction defect, not the paper's -- the parser cannot strip the trailing unit in \"23.9 \u00b1 5.84 yrs\" or read the ratio notation \"16 : 12\". Moved to limitations, where a coverage gap belongs, rather than sitting among findings about the paper."}], "not_checked": [{"location": "Discussion, sample-size paragraph (\u03b1 = 0.05, \u03b2 = 0.20, 5% smaller rate, 30% difference, 28 per group)", "reason": "verify_power_analysis and required_n both need the effect size on the test's own metric -- Cohen's h for a two-proportion design. The paper prints the two proportions but not h, and deriving h requires arcsine arithmetic this stage may not perform by hand. The stated design is therefore recorded but not reproduced. A genuine gap in the toolkit for proportion-based power statements."}, {"location": "Abstract and Results, the p = 0.639 null claim", "reason": "absence_of_evidence needs either a confidence interval or a coefficient with a standard error, and the paper prints neither. No registered tool derives an interval from a 2x2 count table, so the largest difference in infection rate the data still permit could not be quantified. Reported as a finding rather than a computed bound."}, {"location": "Table 1, Wound dehiscence row (0 versus 1)", "reason": "The paper reports no test on this row and makes no claim about it. Tabulating a comparison the authors did not make would manufacture a test that does not exist in the paper."}, {"location": "Age means 23.9 and 24.3 (GRIM)", "reason": "GRIM has no discriminating power at n = 28 with one decimal place -- every value printable to 1 dp is attainable as a mean of 28 integers. The age means were therefore NOT cleared by GRIM; the check simply could not have caught anything. GRIMMER, which can discriminate here, passed both cells."}, {"location": "Baseline similarity (csf_test and bayesian_table1_dispersion not run)", "reason": "Not applicable. The paper reports no baseline p-values at all -- Table 1 gives age, sex, infection and dehiscence with no between-arm comparisons -- so there is no set of baseline p-values to test for excess uniformity, and two baseline rows would make a dispersion estimate uninformative even if constructed."}, {"location": "Cross-table duplication (detect_duplication not run)", "reason": "Not applicable. The paper contains exactly one table describing one sample, so there is no second block of means and SDs to compare it against."}, {"location": "Multiplicity correction (multiplicity_report not run)", "reason": "Not applicable. The paper reports a single planned confirmatory test of a single hypothesis; there is no family to correct over."}, {"location": "Group sizes 56, 28, 28 (flag_round_n not run)", "reason": "A deliberate decision. Roundness carries no signal here: the paper states that 28 per arm came from an a-priori sample-size calculation, so the value is design-determined rather than a convenient total."}, {"location": "Literature values cited in the Discussion (52.6%; 10-15%; 5.6-33.4%)", "reason": "Statistics attributed to references 13, 14 and 17, not computed from these data, and no denominators are given for them here. Verifying them requires the cited papers, which are outside the scope of a single-paper analysis."}, {"location": "Average duration of surgery (3 h 40 min; 3 h 55 min)", "reason": "Reported as means with no SD, no dispersion and no accompanying test, in hours-and-minutes form. No granularity or comparison check applies to a location statistic with no spread and no comparison claimed."}, {"location": "Supplementary materials", "reason": "No supplementary files are referenced in the article text and none are present in the paper directory. Recorded as not provided, which is distinct from present-but-unreadable."}], "limitations": ["This agent reads text and does not see figures. The figure pass was not run and no figure was read. Nothing was lost to that here: the paper contains no figures at all -- the XML returned no figure elements, the PDF text layer over all five pages contains no figure caption, and the only display item is Table 1.", "Table 1 is an image in the publisher XML and carries no cells, so it would have gone unchecked from that source alone. It was recovered from the PDF text layer on page 3, and every value in it is independently restated in the Results prose (both age mean/SD pairs, both sex ratios, both infection counts), so the numbers checked here are corroborated by two agreeing extractions rather than single-sourced.", "The `quote_not_located` marker fired on all 7 of the sweep's accusations. This is an instrument artefact, not a weakness in the evidence: the sweep copied its spans from the PDF text layer, which carries justification double-spaces (\"Fifty-six  patients  in  their  20s\") and renders the chi glyph in a private-use codepoint, so those spans cannot match the XML body text they are searched against. Every one of the seven was located verbatim in the paper on re-reading. Zero of seven was a real problem.", "GRIM could not discriminate at n = 28 with one-decimal means, so th ", "location": "Discussion, paragraph 3", "checkable": {"tools": [], "reason": "A percentage attributed to reference 14; the denominator is not given here, so grim_percentage has no n to work from and the value belongs to another paper."}, "problems": [], "verification": {"quote_located": false, "values_in_quote": true, "problems": ["the quoted span was not found in the paper text"]}}, {"id": "R16", "source": "prose", "kind": "percentage", "values": {"low_pct": 10, "high_pct": 15}, "quote": "Orthognathic surgeries are classified as clean contaminated procedures with postoperative wound  infection  of  10%  to  15%", "location": "Discussion, paragraph 3", "checkable": {"tools": [], "reason": "A literature benchmark attributed to reference 13, with no denominator reported; not a statistic computed from these data."}, "problems": [], "verification": {"quote_located": true, "values_in_quote": true, "problems": []}}, {"id": "R17", "source": "prose", "kind": "other", "values": {"exp_hours": 3, "exp_minutes": 40, "ctrl_hours": 3, "ctrl_minutes": 55}, "quote": "The average duration of surgery was 3 hours and 40 minutes.", "location": "Results, paragraph 1", "checkable": {"tools": [], "reason": "A mean reported with no SD, no n-specific precision and in hours-and-minutes form; no dispersion is printed, so no granularity or comparison check applies."}, "problems": [], "verification": {"quote_located": true, "values_in_quote": false, "problems": ["value(s) not present in the row's own quote: 55"]}}], "n_rows": 17, "n_duplicates": 3, "n_unique": 14, "n_checkable": 7, "n_verified": 4, "n_malformed": 0, "by_source": {"abstract": 1, "prose": 10, "table": 3}, "floor": {"ok": true, "n_floor": 8, "n_unmatched": 0, "unmatched": [], "note": "every statistic the independent enumerator found is accounted for in the register"}, "provenance": {"by_file": {"10.3349--ymj.2009.50.1.55.pdf": {"extractor": "docling", "n_chars": 20011}}, "docling_version": "2.119.0", "n_docling": 1, "n_pdfplumber": 0, "all_high_fidelity": true, "note": "1 file(s) read by docling, 0 by pdfplumber."}, "note": "`n_unique` is the count of statistics THE AGENT LOCATED, not of statistics the paper contains. Enumeration recall is unmeasured; the floor below is a lower bound on it, not an estimate of it."}, "stage1_reconciliation": {"n_stage1": 15, "n_carried": 8, "n_dropped": 7, "dropped_by_severity": {"consistent": 4, "indeterminate": 3}, "n_accusatory_dropped": 0, "accusatory_dropped": [], "n_accusatory_unexplained": 0, "accusatory_unexplained": [], "clean": true, "reconcilable": true, "note": "7 of 15 stage-1 findings are not cited by any editorial finding. A `consistent` result belongs nowhere in a findings report, so most of this is ordinary editorial work. None of the dropped findings was accusatory."}}, "questions_for_authors": [{"question": "Table 1 reports mean ages of 23.9 \u00b1 5.84 years and 24.3 \u00b1 6.33 years, while Patients and Methods describes the cohort as \"Fifty-six patients in their 20s\". Could you send the minimum and maximum age in each arm, so the age span of the cohort can be compared with the \"wide range of patient's age\" the Discussion identifies as a limitation of earlier studies?", "why": "Settles whether the cohort was in fact age-homogeneous, which is the premise the study's rationale rests on, and resolves the only open tension between the prose and the printed dispersion.", "finding_ids": ["6"]}, {"question": "With 3 and 2 infections in arms of 28, the expected counts in both infection cells are 2.5. The reported p = 0.639 reproduces exactly as an uncorrected Pearson chi-squared; Yates-corrected and Fisher's exact both give p = 1.0 on the same counts. Could you confirm which SPSS output the reported value was taken from, and whether an exact test was also examined?", "why": "Confirms the test convention and establishes whether the small-count alternatives were considered, which the Methods sentence does not say.", "finding_ids": ["2"]}, {"question": "Could you supply a confidence interval, or a risk difference with its standard error, for the comparison of 3/28 versus 2/28 infections between arms?", "why": "Would let a reader see how large a difference in infection rate the trial can still exclude, which is what the conclusion that prolonged prophylaxis \"may not be necessary\" depends on and which the paper does not report.", "finding_ids": ["1"]}, {"question": "The Discussion states \"a significance level of \u03b1=0.05 and a test power \u03b2=0.20\", with a smaller infection rate of 5% and an estimated difference of 30%. Could you confirm whether \u03b2=0.20 denotes the type II error rate (that is, power of 0.80), and send the calculation that produced 28 patients per group?", "why": "Resolves the notation in the load-bearing sample-size sentence and would allow the stated power calculation to be reproduced, which could not be done from the values printed.", "finding_ids": ["5", "1"]}], "report_markdown": "This is a small single-centre trial from Yonsei University asking whether prophylactic antibiotics need to be continued after orthognathic surgery. Fifty-six young patients undergoing Le Fort I osteotomy with bilateral intraoral vertical ramus osteotomy, all operated on by the same surgeon, were randomised by Excel-generated codes to receive a single 1.0 g preoperative dose of cefpiramide alone, or the same dose plus twice-daily cefpiramide to the third postoperative day. Surgical site infections were assessed at two weeks against CDC criteria. Three infections occurred in the experimental arm and two in the control arm, and the authors conclude that prolonged prophylaxis may not be necessary.\n\n## What the checks bought\n\nThe arithmetic here is clean, and the cleanliness is worth stating precisely rather than in the aggregate. The paper's single inferential result reproduces exactly from the counts it prints: the 2x2 of 3/28 against 2/28 gives Pearson chi-squared of 0.2196 on one degree of freedom and p = 0.639339, against the printed p = 0.639. Every count reconciles with exact tolerance -- the sex counts against each arm (16 + 12 = 28, 14 + 14 = 28), the arms against the stated total (28 + 28 = 56), and the per-arm infections against the five patients narrated individually in the Results (3 + 2 = 5). Both age mean/SD pairs are reconstructible from integer ages at n = 28: valid sum and sum-of-squares combinations exist for 23.9 \u00b1 5.84 and for 24.3 \u00b1 6.33. That is what a carefully prepared paper looks like, and on a paper this short it is close to everything there was to check.\n\nOne qualification a reader is owed: the age means were not cleared by every available check. GRIM has no resolution at n = 28 with one decimal place, so it could not have caught anything there and correctly returned no verdict. GRIMMER, which can discriminate at these values, passed both.\n\n## Where the trouble is, and where it is not\n\nNothing in this paper contradicts anything else in it. The open questions are all about what the result can be made to support.\n\nThe central one is that a conclusion of \"no difference\" is drawn from an event count of three against two. The paper is more forthcoming than most about how it was sized -- it states plainly that it targeted a contrast between a 5% and a 35% infection rate -- and that candour is what makes the problem legible. A trial built for a 30-percentage-point gap has essentially no purchase on the differences that would actually change clinical practice, and the paper reports no interval, no risk difference and no effect size that would tell a reader which differences remain live. The point estimate recoverable from the counts is an odds ratio of 1.56, pointing weakly toward more infection in the arm that received fewer antibiotics -- the opposite of the conclusion's direction, though on five events in total that is noise rather than signal. It cannot be given an interval here because no tool in this kit derives one from a 2x2 table, and that limitation is ours to own.\n\nThe test choice compounds this rather than causing it. Expected counts of 2.5 per infection cell are half what the chi-squared approximation conventionally wants, and the exact alternatives appropriate at these counts both return p = 1.0. The conclusion is unaffected in direction under every convention, so this makes the figure 0.639 falsely precise rather than wrong -- and uncorrected chi-squared on small 2x2 tables was ordinary practice in 2008. It is also worth noting that the paper reports neither the chi-squared statistic nor its degrees of freedom, so its one confirmatory claim was recoverable only because Table 1 happens to print patient counts rather than percentages.\n\nTwo design points belong beside these. The trial was randomised but not masked -- the paper says so directly, which is to its credit -- and two of the four CDC criteria it adopts are assessor-judged, with the assessment made by the surgeon who performed every operation and knew each allocation. And the study motivates itself by criticising earlier work for a \"wide range of patient's age\", while printing no age range of its own; its dispersion figures sit awkwardly with the phrase \"in their 20s\", though a lopsided age distribution would reconcile both without any reporting error, and the arithmetic of those figures checks out. I have graded that last point as unresolved rather than as a defect, because the paper is simply silent on the question and the innocent reading is at least as natural as the alternative.\n\nA note on one thing I did not do. The sweep flagged both age standard deviations as exceeding what an age band of 20 to 29 permits. That band is a translation of prose, not a range the paper prints, and a bound the reviewer supplies can invert this kind of check rather than merely weaken it. It has been capped accordingly and is reported as an open question about missing information, not as an anomaly in the numbers.\n e": "sweep", "seq": 1, "tool": "extract_xml", "surface": "forensic_mcp", "validated": true, "severity": null, "sourceable": false, "input": {"xml_path": "<home>/agent_for_forensic_metascience/eval/ground_truth/papers/10.3349--ymj.2009.50.1.55/10.3349--ymj.2009.50.1.55.xml"}, "result": "{\n  \"text\": \"## The Efficacy of Postoperative Prophylactic Antibiotics in Orthognathic Surgery: A Prospective Study in Le Fort I Osteotomy and Bilateral Intraoral Vertical Ramus Osteotomy\\n\\n## INTRODUCTION\\nAntibiotics are used to treat and prevent postoperative infections. In 1960, it was reported that pathogens are present during surgery[1],[2] regardless of how aseptic the surgery might appear. Moreover, the correlation between prophylactic antibiotics and postoperative wound infections was demonstrated. Therefore, prophylactic antibiotics are now used in almost all surgical procedures. The most effective method of antibiotic prophylaxis is the preoperative administration of antibiotics because it can act at the time when the wound is potentially contaminated by bacteria.[2]\\u207b[4] On the other hand, it was also reported that the use of antibiotics after 3 - 4 hours of a bacterial invasion is unsuitable.[5]\\n\\nProphylactic antibiotics are generally administered both preoperatively and postoperatively. Hence, the effects of the indiscriminate method and period of administration are unclear, considering the multiple factors that contribute to postoperative wound infections.[6]\\u207b[8]\\n\\nThe use of antibiotic prophylaxis is controversial even in orthognathic surgery, which is a representative procedure for oral and maxillofacial surgery. There are reports show no increase in the incidence of infection without the administration of postoperative prophylactic antibiotics.[9],[10] On the other hand, there are reports to suggest the necessity of continuous antibiotic administration.[11] However, orthognathic surgery is mainly performed on young patients without a specific medical history. Moreover, the number of factors associated with the development of postoperative wound infections decreases as the procedure becomes more generalized and its technique advances.\\n\\nThe aims of this clinical study were to evaluate the prevalence of postoperative wound infections wi\n... [clipped]"}, {"stage": "sweep", "seq": 2, "tool": "extract_pdf", "surface": "forensic_mcp", "validated": true, "severity": null, "sourceable": false, "input": {"pdf_path": "<home>/agent_for_forensic_metascience/eval/ground_truth/papers/10.3349--ymj.2009.50.1.55/10.3349--ymj.2009.50.1.55.pdf"}, "result": "{\n  \"text\": \"## The  Efficacy  of  Postoperative  Prophylactic  Antibiotics  in Orthognathic  Surgery:  A  Prospective  Study  in  Le  Fort  I Osteotomy  and  Bilateral  Intraoral  Vertical  Ramus  Osteotomy\\n\\nSang-Hoon  Kang, 1,2 J ae-Ha  Yoo, 1,3 and  Choong-Kook  Yi 1\\n\\nDepartment  of  Oral  and  Maxillofacial  Surgery, 1 College  of  Dentistry,  Yonsei  University,  Seoul; 2 National  Health  Insurance Corporation  Ilsan  Hospital,  Gyeonggi; 3 Wonju  Christian  Hospital,  Kangwon,  Korea.\\n\\nPurpose: This study examined the efficacy of the postoperative  prophylactic  antibiotics  used  in  orthognathic  surgery.  The prevalence  of  surgical  site  infections  (SSIs)  was  determined according to the use of postoperative prophylactic antibiotics. Patients  and  Methods: Fifty-six  patients  were  divided  into  2 groups.  Each  patient  intravenously  received  1.0 g  of  a  thirdgeneration cephalosporin (Cefpiramide) 30 minutes before surgery. Among them, 28 patients in the control group received 1.0 g  Cefpiramide twice daily until  the  third  day  after  surgery. The  postoperative  wounds  were  examined  regularly  for  the presence of infectious signs. Results: There was no significant difference  in  the  incidence  of  postoperative  wound  infections between patients who had received postoperative prophylactic antibiotic  administration  and  those  who  had  not  ( p = 0.639). Conclusion: Prolonged prophylactic antibiotic use after orthognathic surgery may not be necessary, provided that there are no  other  significant  factors  for  wound  infections.\\n\\nKey  Words: Orthognathic  surgery,  prophylactic  antibiotics, surgical  site  infection\\n\\n## INTRODUCTION\\n\\nAntibiotics  are  used  to  treat  and  prevent  postoperative  infections.  In  1960,  it  was  reported  that pathogens are present during surgery 1,2 regardless of how aseptic the surgery might appear. Moreover, the  correlation  between  prophylactic  antibiotics and  postoperative \n... [clipped]"}, {"stage": "sweep", "seq": 3, "tool": "statcheck", "surface": "forensic_mcp", "validated": true, "severity": null, "sourceable": true, "input": {"text": "The mean (SD) age of the experimental group was 23.9 years (5.84) with male-female ratio of 4 : 3. The average duration of surgery was 3 hours and 40 minutes. The mean (SD) age of the control group was 24.3 years (6.33) with male-female ratio of 1 : 1. The average duration of surgery was 3 hours and 55 minutes.\n\nThere were 3 infections in the experimental group and 2 infections in the control group, observed 2 weeks after surgery (Table 1). One patient in the experimental group was diagnosed with an infection by facial swelling, redness and sinus haziness in the waters' view, and the other 4 patients were diagnosed with a postoperative infection by swelling and redness, and pain on the mandibular area. Therefore, the wounds were opened by a surgeon and the patients were treated with antibiotics. However, only 1 patient in the control group developed wound dehiscence only without any drainage, fever, or swelling in the maxillary area. According to the \u03c7\u00b2-test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).\n\nTwenty eight patients were enrolled in each group. The samples were selected at a significance level of \u03b1= 0.05 and a test power \u03b2= 0.20. A smaller infection rate was set to 5%, and the difference in the estimated infection rate was set to 30%, based on previous report that the incidence of postoperative wound infection using prophylactic antibiotics, ranges from 5.6% to 33.4%.", "source_locator": "Results and Discussion, prose", "source_quote": "According to the \u03c7\u00b2-test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639)."}, "result": "{\n  \"success\": true,\n  \"stats_found\": 0,\n  \"message\": \"No statistics found in text\",\n  \"source_quote\": \"According to the \\u03c7\\u00b2-test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).\",\n  \"source_locator\": \"Results and Discussion, prose\",\n  \"source_quote_supplied\": true\n}", "source_quote": "According to the \u03c7\u00b2-test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).", "source_locator": "Results and Discussion, prose", "source_quote_verified": "verbatim", "source_quote_source": "the paper's text"}, {"stage": "sweep", "seq": 4, "tool": "recalc_chi_squared", "surface": "forensic_mcp", "validated": true, "severity": "consistent", "sourceable": true, "input": {"observed": [[3, 25], [2, 26]], "reported_p": 0.639, "decimals_p": 3, "source_locator": "Results, final paragraph, and Table 1 infection row", "source_quote": "According to the \u03c7\u00b2-test, there was no significant difference in t y": "consistent", "quote": "According to the \u03c7\u00b2-test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).", "reported": {"p": 0.639, "test": "chi-squared"}, "computed": {"calculated_chi2_pearson": 0.2196078431372549, "calculated_p_pearson": 0.639338884785466, "df": 1, "p_matches": true}, "inputs": {"observed": [[3, 25], [2, 26]], "reported_p": 0.639, "decimals_p": 3}, "reproduction": "metascience chi2 --observed \"[[3,25],[2,26]]\" --reported-p 0.639 --decimals-p 3", "notes": "The paper's single inferential result reproduces exactly from the counts printed in Table 1. The reported p = 0.639 matches the uncorrected Pearson value 0.63934 to three decimals, which also identifies which convention SPSS was run under. This is the strongest positive evidence in the sweep: the headline number is exactly what the reported data produce."}, {"id": "chi_squared_expected_counts_below_five", "location": "Results, final paragraph (test choice), against Table 1 infection row", "technique": "recalc_chi_squared", "consistent": false, "severity": "suspicious", "quote": "Statistical  analysis  was  performed  using  a \ue0b2 2 -test on  the  Statistical  Package  for  the  Social  Sciences (SPSS  for  windows,  ver.  12.0,  SPSS  Inc.,  Chicago, IL,  USA).", "reported": {"test": "chi-squared", "p": 0.639}, "computed": {"expected_counts_infection_cells": 2.5, "conventional_minimum_expected_count": 5, "yates_corrected_p": 1, "fisher_exact_p": 1, "pearson_p_the_paper_reported": 0.639338884785466}, "inputs": {"observed": [[3, 25], [2, 26]], "reported_p": 0.639, "decimals_p": 3}, "reproduction": "metascience chi2 --observed \"[[3,25],[2,26]]\" --reported-p 0.639 --decimals-p 3", "consequence": {"basis": "computed", "flips_significance": false, "claims_affected": 1, "explanation": "The paper's sole conclusion is unaffected in direction: the uncorrected Pearson test it reports (p = 0.639), the Yates-corrected test (p = 1.0) and Fisher's exact test (p = 1.0) are all non-significant, so the stated finding of no difference stands under every convention."}, "notes": "The tool's own output gives expected counts of 2.5 in both infection cells, half the conventional minimum of 5 for the chi-squared approximation; Fisher's exact test is the standard choice at these counts. This is a test-selection issue (rulebook rule 5), not a numerical error, and it does not change the paper's conclusion -- it makes the reported p optimistically precise rather than wrong in direction. Recorded as suspicious rather than higher because uncorrected 2x2 chi-squared on small counts was routine practice in 2009 clinical reporting."}, {"id": "no_test_statistic_or_df_reported", "location": "Results, final paragraph, and Abstract", "technique": "not_computational", "consistent": false, "severity": "suspicious", "quote": "According to the \u03c7\u00b2-test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).", "reported": {"p": 0.639, "chi2_statistic": "not reported", "df": "not reported"}, "computed": {"statcheck_stats_found": 0}, "inputs": {"text": "Results and Discussion prose as extracted from the XML body"}, "reproduction": "metascience statcheck --text \"According to the chi2-test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).\"", "notes": "statcheck returned stats_found = 0 over the full Results and Discussion text. That is not a defect of the scanner: the paper reports its only inferential test as a bare p-value, with neither the chi-squared statistic nor its degrees of freedom, so there is no APA-format triple to parse and no internal redundancy against which the p could have been checked by a reader. The check was recoverable here only because Table 1 prints the underlying cell counts; had it not, the paper's single claim would have been unverifiable. Recorded as a reporting-completeness finding, not an arithmetic one."}, {"id": "null_conclusion_without_interval_or_effect_size", "location": "Abstract (Results and Conclusion) and Discussion, final paragraph", "technique": "not_computational", "consistent": false, "severity": "suspicious", "quote": "Conclusion: Prolonged prophylactic antibiotic use after orthognathic surgery may not be necessary, provided that there are no  other  significant  factors  for  wound  infections.", "reported": {"conclusion": "no significant difference; prolonged use may not be necessary", "p": 0.639, "confidence_interval": "none reported", "effect_size": "none reported"}, "computed": {"odds_ratio_from_the_printed_2x2_via_recalc_chi_squared": 1.56, "interval_on_that_odds_ratio": "not obtainable -- no registered tool derives a CI from a 2x2 count table"}, "inputs": {"observed": [[3, 25], [2, 26]]}, "reproduction": "metascience chi2 --observed \"[[3,25],[2,26]]\" --reported-p 0.639 --decimals-p 3", "consequence": {"basis": "asserted", "flips_significance": false, "claims_affected": 1, "explanation": "The paper's headline recommendation -- that prolonged postoperative prophylaxis may be unnecessary -- is an acceptance of the null argued from p = 0.639 alone, with no interval stating how large a difference in infection rate the data still permit."}, "notes": "absence_of_evidence could not be run because the paper prints no confidence interval and no coefficient with a standard error, so there is nothing to pass it. The point estimate recoverable from the counts (Fisher odds ratio 1.56, from recalc_chi_squared) actually favours MORE infection in the arm that received fewer antibiotics, and with 3 and 2 events the interval around it would be very wide. This is the ordinary and widespread practice of reading a non-significant p as evidence of no effect; it is a limitation of the inference, not a sign of anything wrong with the numbers."}, {"id": "design_powered_for_a_thirtyfold_larger_difference", "location": "Discussion, sample-size paragraph, against Table 1 infection row", "technique": "not_computational", "consistent": false, "severity": "suspicious", "quote": "The samples were selected at a significance level of \u03b1 =0.05 and a test power \u03b2 =0.20. A smaller infection  rate  was  set  to  5%,  and  the  difference  in the  estimated infection rate was set to 30%", "reported": {"design_smaller_rate_pct": 5, "design_difference_pct": 30, "n_per_group": 28, "observed_infections_exp": 3, "observed_infections_ctrl": 2}, "computed": {"comparison": "The stated design targets a 30 percentage-point difference between arms; the observed difference is one patient (3 events versus 2 events out of 28 per arm). No arithmetic is performed here -- the design target and the observed event counts are both quoted as printed."}, "inputs": {"stated_alpha": 0.05, "stated_beta": 0.2, "stated_smaller_rate": 0.05, "stated_difference": 0.3, "n_per_group": 28}, "reproduction": "metascience chi2 --observed \"[[3,25],[2,26]]\" --reported-p 0.639 --decimals-p 3", "consequence": {"basis": "asserted", "flips_significance": false, "claims_affected": 1, "explanation": "The conclusion that prolonged prophylaxis 'may not be necessary' rests on a design sized to detect only a very large difference (5% versus 35%), so a clinically meaningful smaller difference could not have been detected by this trial and its absence from the results is uninformative."}, "notes": "This is a reading of the paper's own stated design parameters against its own reported counts, with no calculation. A quantitative sensitivity figure was NOT computed: required_n and verify_power_analysis both need the effect size on the test's own metric (Cohen's h for two proportions), which the paper does not print and which I am not permitted to derive by hand. The paper is commendably explicit about its design assumptions, which is what makes this visible at all; many papers state none."}, {"id": "age_sd_versus_stated_age_band", "location": "Patients and Methods, first sentence, against Table 1 Age row", "technique": "check_sd_range", "consistent": false, "severity": "suspicious", "quote": "Fifty-six  patients  in  their  20s  without  a  specific medical history", "reported": {"SD_experimental": 5.84, "SD_control": 6.33, "M_experimental": 23.9, "M_control": 24.3, "n_per_group": 28, "stated_age_description": "in their 20s"}, "computed": {"assumed_range_used": [20, 29], "max_possible_sd_for_that_range_at_n28": 4.582575694955841, "reported_sd_as_fraction_of_max_experimental": 1.2743924789781953, "reported_sd_as_fraction_of_max_control": 1.3813192451938316}, "inputs": {"sd": 5.84, "min_val": 20, "max_val": 29, "n": 28, "decimals_sd": 2, "bound_source": "assumed"}, "reproduction": "metascience sd-range --sd 5.84 --min-val 20 --max-val 29 --n 28 --decimals-sd 2 --bound-source assumed", "severity_source": {"tool": "check_sd_range", "model": "claude-opus-5", "direction": "downgraded", "explained": true, "note": "The tool returned highly_suspicious for both rows. Downgraded to suspicious under rulebook rule 4: the [20, 29] range is MY translation of the prose phrase 'in their 20s', not numerals the paper printed, and an assumption-dependent finding is capped at suspicious and must not be the headline."}, "notes": "Both SDs exceed the maximum an age range of 20-29 permits, so the two statements cannot both be literally true. The innocent explanation is strong and is probably the right one: 'in their 20s' reads naturally as loose shorthand for a young-adult cohort rather than a strict inclusion criterion, and the paper states no numeric age range anywhere. A supporting check points the same way -- check_proportion_from_normal on 0 of 28 patients below age 20 gives binomial p = 0.00062 against a normal N(23.9, 5.84) model, but the result explicitly does NOT violate its distribution-free bound [0.0000, 0.6916], so a right-skewed age distribution with a hard floor near 20 explains the SDs and the phrase together. The Discussion also criticises earlier studies for a 'wide range of patient's age', which sits awkwardly beside SDs of nearly 6 years, but that is a rhetorical tension rather than an arithmetic one. Recorded so a reader can see it; not treated as evidence against the paper."}, {"id": "age_proportion_below_twenty", "location": "Patients and Methods, first sentence, against Table 1 Age row", "technique": "check_proportion_from_normal", "consistent": true, "severity": "indeterminate", "quote": "Fifty-six  patients  in  their  20s  without  a  specific medical history", "reported": {"implied_proportion_below_20": 0, "M": 23.9, "SD": 5.84, "n": 28}, "computed": {"theoretical_proportion_below_20_under_normal": 0.25212800967996707, "binomial_p_two_sided": 0.000615350068596305, "distribution_free_bound_95": [0, 0.6915783241002849], "distribution_free_violation": false}, "inputs": {"reported_proportion": 0, "mean": 23.9, "sd": 5.84, "n": 28, "threshold": 20, "direction": "below"}, "reproduction": "metascience prop-from-normal --reported-proportion 0 --mean 23.9 --sd 5.84 --n 28 --threshold 20 --direction below", "notes": "Run as a second, distribution-aware view of the same tension as age_sd_versus_stated_age_band, and it declines to convict. Under a normal model a quarter of the experimental arm would fall below 20, which is incompatible with 'in their 20s' -- but the observed 0/28 stays inside the distribution-free bound, so a skewed age distribution accounts for it without any reporting error. The control arm gives the same picture (theoretical 0.2485, binomial p = 0.000605, no distribution-free violation). Recorded as indeterminate: the check ran and could not decide between a wrong SD and loose prose. Note also that the reported_proportion of 0 is my inference from the phrase 'in their 20s', not a proportion the paper printed."}, {"id": "grimmer_age_cells", "location": "Table 1, Age row (both groups)", "technique": "grimmer", "consistent": true, "severity": "consistent", "quote": "| Age (Mean \u00b1 SD)             | 23.9 \u00b1 5.84 yrs                                                 | 24.3 \u00b1 6.33 yrs                                                    |", "reported": {"M_experimental": 23.9, "SD_experimental": 5.84, "M_control": 24.3, "SD_control": 6.33, "n": 28}, "computed": {"experimental_working_combinations_found": 5, "experimental_example": {"sum": 669, "sum_squares": 16905, "exact_mean": 23.89286, "exact_sd": 5.839453}, "control_working_combinations_found": 4, "control_example": {"sum": 680, "sum_squares": 17596, "exact_mean": 24.28571, "exact_sd": 6.329573}}, "inputs": {"mean": 23.9, "sd": 5.84, "n": 28, "scale_min": 10, "scale_max": 60, "decimals": 1, "decimals_sd": 2, "data_type": "integer", "discreteness_source": "assumed"}, "reproduction": "metascience grimmer --mean 23.9 --sd 5.84 --n 28 --scale-min 10 --scale-max 60 --decimals 1 --decimals-sd 2 --data-type integer", "notes": "Both age mean/SD pairs are reconstructible from integer ages at n = 28: valid (sum, sum-of-squares) combinations exist for each. IMPORTANT CORRECTION TO THE RECORD: a first pass omitted scale_min/scale_max and the tool fell back to a 1-7 Likert default, returning 'out_of_range' for both rows. That was an artefact of my inputs, not a property of the paper, and it is reported here so the false alarm is visible rather than buried. The discreteness premise (ages recorded in whole years) is ASSUMED -- the paper never states it -- but that assumption only matters for a failing verdict, and these pass."}, {"id": "grim_no_discriminating_power", "location": "Table 1, Age row (both groups)", "technique": "grim", "consistent": true, "severity": "indeterminate", "quote": "| Age (Mean \u00b1 SD)             | 23.9 \u00b1 5.84 yrs                                                 | 24.3 \u00b1 6.33 yrs                                                    |", "reported": {"M_experimental": 23.9, "M_control": 24.3, "n": 28, "decimals": 1}, "computed": {"check_can_fail": false, "failure_mode": "no_discriminating_power", "tool_verdict": "Every value printable to 1 dp is attainable as a mean of 28 integers, so no reported figure could have failed this check."}, "inputs": {"mean": 23.9, "n": 28, "decimals": 1, "data_type": "integer", "scale_min": 10, "scale_max": 60, "bound_source": "assumed", "discreteness_source": "assumed"}, "reproduction": "metascience grim --mean 23.9 --n 28 --decimals 1 --data-type integer --scale-min 10 --scale-max 60 --bound-source assumed", "notes": "GRIM has no resolution at n = 28 with one decimal place, so it returns indeterminate rather than a vacuous pass. Recorded deliberately: a reader should know that the age means were NOT cleared by GRIM, only that GRIM could not have caught anything here. The same applies to the control mean of 24.3."}, {"id": "counts_reconcile", "location": "Table 1, all rows, against Methods and Results prose", "technique": "check_summation_batch", "consistent": true, "severity": "consistent", "quote": "| Sex (Male : Female)         | 16 : 12                                                         | 14 : 14                                                            |", "reported": {"sex_experimental": [16, 12], "sex_control": [14, 14], "group_ns": [28, 28], "infections": [3, 2]}, "computed": {"n_rows": 4, "n_evaluated": 4, "n_inconsistent": 0, "all_differences": 0}, "inputs": {"rows": [{"values": [16, 12], "expected_sum": 28}, {"values": [14, 14], "expected_sum": 28}, {"values": [28, 28], "expected_sum": 56}, {"values": [3, 2], "expected_sum": 5}]}, "reproduction": "metascience summation-batch --rows \"[{\\\"values\\\":[16,12],\\\"expected_sum\\\":28,\\\"decimals\\\":[0,0],\\\"tolerance\\\":0},{\\\"values\\\":[14,14],\\\"expected_sum\\\":28,\\\"decimals\\\":[0,0],\\\"tolerance\\\":0},{\\\"values\\\":[28,28],\\\"expected_sum\\\":56,\\\"decimals\\\":[0,0],\\\"tolerance\\\":0},{\\\"values\\\":[3,2],\\\"expected_sum\\\":5,\\\"decimals\\\":[0,0],\\\"tolerance\\\":0}]\"", "notes": "Every count in the paper reconciles exactly, including three separate cross-references: the Table 1 sex counts against the prose ratios (16:12 is 4:3, 14:14 is 1:1), the two arms against the stated total of 56, and the per-arm infection counts against the five infected patients narrated individually in the Results ('One patient in the experimental group... and the other 4 patients'). Arithmetic tolerance was set to exactly 0, as these are integer counts."}, {"id": "table1_cell_typing_coverage_gap", "location": "Table 1, Age row and Sex row", "technique": "parse_cells_typed", "consistent": false, "severity": "indeterminate", "quote": "| Age (Mean \u00b1 SD)             | 23.9 \u00b1 5.84 yrs                                                 | 24.3 \u00b1 6.33 yrs                                                    |", "reported": {"cells_in_table": 8}, "computed": {"coverage": 0.5, "n_unread": 4, "n_unread_numeric_shaped": 4, "unread_shapes": ["9.9 \u00b1 9.9 A", "9 : 9"], "candidate_formats_offered": 0}, "inputs": {"cells": "the 8 Table 1 cells recovered from the PDF grid"}, "reproduction": "metascience parse-cells --cells \"[{\\\"raw\\\":\\\"23.9 \u00b1 5.84 yrs\\\",\\\"row_label\\\":\\\"Age (Mean \u00b1 SD)\\\",\\\"col_label\\\":\\\"Experimental group without postoperative antibiotics (n = 28)\\\"},{\\\"raw\\\":\\\"16 : 12\\\",\\\"row_label\\\":\\\"Sex (Male : Female)\\\",\\\"col_label\\\":\\\"Experimental group without postoperative antibiotics (n = 28)\\\"}]\"", "notes": "This is OUR defect, not the paper's, and it is recorded so the coverage figure is honest. Half of Table 1's eight cells could not be typed automatically: the mean-SD cells carry a trailing unit ('23.9 \u00b1 5.84 yrs') that the parser does not strip, and the sex cells use ratio notation ('16 : 12') that no format in the vocabulary expresses. Both clusters returned an EMPTY candidate_formats list, so parse_cells_as_declared could not rescue them either. The four values were therefore read by eye from two independent extractions that agree exactly -- the docling markdown grid and the raw page-3 text layer, which both render '23.9\u00b15.84 yrs' and '16 : 12' -- and checked individually with grimmer, check_sd_range and check_summation_batch rather than through check_table."}, {"id": "table1_image_only_in_xml", "location": "Table 1 (XML), recovered from PDF page 3", "technique": "not_computational", "consistent": true, "severity": "consistent", "quote": "[Table 1: Results according to the Postoperative Antibiotic Prophylaxis \u2014 image only, no cells; see tables]", "reported": {"n_tables_in_xml": 1, "n_tables_image_only": 1}, "computed": {"resolution": "The table was recovered in full from the PDF text layer on page 3, giving all four data rows and both column headers."}, "inputs": {"xml_path": "10.3349--ymj.2009.50.1.55.xml", "pdf_path": "10.3349--ymj.2009.50.1.55.pdf"}, "reproduction": "metascience extract --pdf-path <home>/agent_for_forensic_metascience/eval/ground_truth/papers/10.3349--ymj.2009.50.1.55/10.3349--ymj.2009.50.1.55.pdf --first-page 3 --last-page 3", "notes": "The XML carries Table 1 as a picture with no cells, which would have left the paper's only table unchecked. Pass 2 recovered it from the PDF, where it appears twice in agreement -- once as a reconstructed markdown grid and once in the page text -- so the recovery is corroborated rather than single-sourced. Recorded as consistent because the gap was closed, not because nothing was wrong with the source."}, {"id": "beta_labelled_as_test_power", "location": "Discussion, sample-size paragraph", "technique": "not_computational", "consistent": false, "severity": "suspicious", "quote": "The samples were selected at a significance level of \u03b1 =0.05 and a test power \u03b2 =0.20.", "reported": {"stated": "a test power \u03b2 = 0.20"}, "computed": {"reading": "As printed the sentence asserts 20% power alongside alpha = 0.05, which would be an unusable design. The conventional reading is that beta is the type II error rate and power is 1 - beta = 0.80, which is what 28 per group is consistent with."}, "inputs": {"alpha": 0.05, "beta": 0.2}, "reproduction": "No command applies: this is a notation error read off the sentence, not a computation.", "consequence": {"basis": "asserted", "flips_significance": false, "claims_affected": 0, "explanation": "No reported number changes -- the intended design (alpha = 0.05, power = 0.80) is unambiguous from context, and the sample size of 28 per arm is reported independently."}, "notes": "A terminology slip: beta = 0.20 is the type II error rate, not the test power. Recorded because it sits in the sentence that justifies the sample size -- a load-bearing methods statement -- rather than in incidental text. It changes nothing arithmetically and the intended meaning is clear."}, {"id": "unblinded_allocation_with_subjective_outcome", "location": "Patients and Methods, allocation paragraph, and SSI criteria list", "technique": "not_computational", "consistent": false, "severity": "suspicious", "quote": "The  patients  in  the  experimental  group received  only  1.0 g  of  a  third-generation  cephalosporin (Cefpiramide)  intravenously 30  minutes before  surgery  and  did  not  receive  the  placebo.", "reported": {"randomisation": "Microsoft Excel randomisation codes", "placebo": "not given", "outcome_ascertainment": "CDC SSI criteria assessed clinically"}, "computed": {"reading": "Allocation was randomised but not masked; the paper reports no blinding of patients, of the operating surgeon, or of the assessor who applied the SSI criteria."}, "inputs": {"design": "two-arm randomised trial without placebo"}, "reproduction": "No command applies: this is a design observation read from the Methods, not a computation.", "consequence": {"basis": "asserted", "flips_significance": null, "claims_affected": 1, "explanation": "The primary outcome includes assessor-judged signs -- 'pain or tenderness, localized swelling, redness or heat' and 'Diagnosis of SSI by the surgeon or attending physician' -- so the absence of masking bears directly on the infection counts that the single reported test is computed from."}, "notes": "The paper is transparent about this: it states plainly that no placebo was given, and the surgery was performed by a single surgeon. The direction of any resulting bias is not determinable from what is reported, and with 3 and 2 events the question is moot for the significance of the result. Recorded because the outcome definition is partly subjective and the trial is presented as prospective and randomised, where a reader may assume masking."}, {"id": "no_trial_registration", "location": "Patients and Methods, final paragraph", "technique": "not_computational", "consistent": false, "severity": "indeterminate", "quote": "The study protocol was approved by the Institutional Review Board of the College of Dentistry, Yonsei University (YUDC).", "reported": {"ethics_approval": "IRB, College of Dentistry, Yonsei University", "trial_registration": "none stated"}, "computed": {"reading": "The paper names an IRB approval but no trial registry identifier and no protocol citation anywhere in the text."}, "inputs": {"searched": "full XML body text and full PDF text"}, "reproduction": "No command applies: this is an absence read from the full text, not a computation.", "notes": "Recorded so that the anatomy's hypothesis status is auditable: H1 is classed 'confirmatory' rather than 'preregistered_confirmatory' because the paper states its aim in advance but cites no registration. For a 2009 trial this is unremarkable and is NOT presented as a defect -- prospective registration was not yet universally enforced. Severity indeterminate: an absence in the text is not evidence that no protocol existed."}], "coverage": {"stats_found": 17, "tables_checked": ["Table 1 (image-only in XML; recovered from PDF page 3)"], "tools_run": ["extract_xml", "extract_pdf", "statcheck", "parse_cells_typed", "recalc_chi_squared", "check_summation_batch", "grim_check", "grimmer_check", "check_sd_range", "check_proportion_from_normal"]}, "unchecked": [{"location": "Discussion, sample-size paragraph (alpha = 0.05, beta = 0.20, 5% smaller rate, 30% difference, 28 per group)", "reason": "verify_power_analysis and required_n both require the effect size on the test's own metric -- Cohen's h for a two-proportion design. The paper prints the two proportions but not h, and deriving h requires arcsine arithmetic I am not permitted to perform by hand. The stated design is therefore recorded but not reproduced. This is a genuine gap in the toolkit for proportion-based power statements."}, {"location": "Abstract and Results, the p = 0.639 null claim", "reason": "absence_of_evidence needs either a confidence interval or a coefficient with a standard error, and the paper prints neither. No registered tool derives an interval from a 2x2 count table, so the largest difference in infection rate the data still permit could not be quantified. Recorded instead as the finding null_conclusion_without_interval_or_effect_size."}, {"location": "Table 1, Wound dehiscence row (0 versus 1)", "reason": "The paper reports no test on this row and makes no claim about it, so there is no reported statistic to verify. Tabulating a comparison the authors did not make would manufacture a test that does not exist in the paper."}, {"location": "Group sizes 56, 28, 28 (flag_round_n not run)", "reason": "Deliberate decision, not an omission. Roundness carries no signal here: the paper states that 28 per arm was produced by an a-priori sample-size calculation, so the value is design-determined rather than a suspiciously convenient total, and 56 is simply its double."}, {"location": "Cross-table duplication (detect_duplication not run)", "reason": "Not applicable. The paper contains exactly one table describing one sample, so there is no second block of means and SDs to compare it against, within or across studies."}, {"location": "Multiplicity correction (multiplicity_report not run)", "reason": "Not applicable. The paper reports a single planned confirmatory test of a single hypothesis. Rulebook guidance is explicit that one hypothesis tested once needs no correction, and pooling it with nothing would be meaningless."}, {"location": "Literature values cited in the Discussion (52.6%; 10-15%; 5.6-33.4%)", "reason": "These are statistics attributed to references 13, 14 and 17, not computed from these data, and no denominators are given for them here. Verifying them requires the cited papers, which are outside the scope of this sweep."}, {"location": "Average duration of surgery (3 h 40 min; 3 h 55 min)", "reason": "Reported as means with no SD, no dispersion and no accompanying test, in hours-and-minutes form. No granularity or comparison check applies to a location statistic with no spread and no comparison claimed."}, {"location": "Figures", "reason": "The paper contains no figures. extract_xml returned no figure elements and the PDF text layer over all five pages contains no figure caption; the only display item is Table 1. extract_figures was therefore not run."}, {"location": "Supplementary materials", "reason": "No supplementary files are referenced in the article text and none are present in the paper directory. Recorded as not provided, which is distinct from present-but-unreadable."}]}, "result": "Output does not match required schema: /findings/9/technique: must be equal to one of the allowed values, /findings/10/technique: must be equal to one of the allowed values, /anatomy/tests/0/statistic_value: must be number"}, {"stage": "sweep", "seq": 18, "tool": "StructuredOutput", "surface": "harness", "validated": false, "severity": null, "sourceable": false, "input": {"schema_version": "1.0", "paper_id": "10.3349--ymj.2009.50.1.55", "paper_title": "The Efficacy of Postoperative Prophylactic Antibiotics in Orthognathic Surgery: A Prospective Study in Le Fort I Osteotomy and Bilateral Intraoral Vertical Ramus Osteotomy", "paper_metadata": {"authors": "Sang-Hoon Kang, Jae-Ha Yoo, Choong-Kook Yi", "journal": "Yonsei Medical Journal", "year": "2009", "doi": "10.3349/ymj.2009.50.1.55", "study_design": "Two-arm randomised prospective trial (allocation by Microsoft Excel randomisation codes), no placebo, single surgeon, 56 patients"}, "anatomy": {"studies": [{"id": "S1", "label": "Prospective randomised trial of postoperative prophylactic antibiotics after Le Fort I osteotomy + bilateral IVRO", "design": "rct", "n": 56, "n_per_group": [{"label": "experimental (no postoperative antibiotics)", "n": 28}, {"label": "control (Cefpiramide twice daily to day 3)", "n": 28}], "unit_of_analysis": "patient", "clustered": false, "preregistered": false, "sample_flow": [{"stage": "enrolled", "n": 56, "unit": "participants"}, {"stage": "allocated to experimental arm", "n": 28, "unit": "participants"}, {"stage": "allocated to control arm", "n": 28, "unit": "participants"}, {"stage": "analysed", "n": 56, "unit": "participants", "reason": "No withdrawals, losses to follow-up or exclusions are reported anywhere in the paper; the analysed total is inferred from the fact that both arms are reported at n = 28 in Table 1", "inferred": true}]}], "hypotheses": [{"id": "H1", "study_id": "S1", "statement": "The prevalence of postoperative surgical site infection after orthognathic surgery does not differ between patients given prophylactic antibiotics only preoperatively and patients given them for a further 3 days postoperatively.", "status": "confirmatory", "appears_in_abstract": true, "confidence": "high", "provenance_quote": "The aims of this clinical study we

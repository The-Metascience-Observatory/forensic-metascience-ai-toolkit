source_quote_source": "the paper's text", "vignette": {"asked": {"question": "Runs every summation check in one call; the worst row sets the verdict.", "no_question": false, "not_a_check": false, "values": [{"name": "rows", "value": "[{\"values\": [28, 28], \"expected_sum\": 56, \"decimals\": [0, 0], \"decimals_total\": 0, \"tolerance\": 0, \"description\": \"arms sum to enrolled total\"}, {\"values\": [16, ...", "role": "input"}]}, "paper": {"state": "quoted"}, "computed": {"errored": false, "verdict": "consistent", "method": "Batched summation. Each row is checked independently by check_summation; the aggregate severity is the worst row, and a batch in which nothing could be evaluated reports `indeterminate` rather than `consistent`.", "no_method": false, "detail": "All 5 evaluated sums reconcile within tolerance.", "figures": [{"name": "n_rows", "value": "5"}, {"name": "n_evaluated", "value": "5"}, {"name": "n_indeterminate", "value": "0"}, {"name": "n_inconsistent", "value": "0"}], "n_more": 1}, "means": {"verdict": "consistent", "scope": "A PASS, and only on what this check tests. It does not say the analysis is correct, that the underlying data exist, or that any other check would pass -- only that these numbers do not contradict each other in the way this check looks for.", "evidence": "probabilistic", "evidence_meaning": "Probabilistic (plausible vs highly implausible), UNDER THE ASSUMPTIONS below. A flagged result is unlikely if those assumptions hold; if one fails, the finding may have an innocent explanation. Never reported as `impossible`.", "ceiling": "highly_suspicious"}, "changes": [{"lever": "The numbers were read from a passage we located in the paper", "detail": "The quoted passage was found in the paper's own text. If any value above is not what the paper printed, this verdict is about a number the paper does not contain."}, {"lever": "3 further preconditions this check declares", "detail": "Where one of these is unmet the verdict is capped, not merely caveated.", "card": "check_summation_batch"}]}}, {"stage": "editorial", "seq": 6, "tool": "StructuredOutput", "surface": "harness", "validated": false, "severity": null, "sourceable": false, "is_error": false, "input": {"confidence": "medium", "verdict": "reconciles", "headline": {"statement": "Every number this paper prints reconciles with every other number it prints -- the single significance test reproduces exactly from the counts in Table 1 -- but the paper draws a conclusion of \"no difference\" from five infections in fifty-six patients without reporting any confidence interval or effect estimate, and describes its cohort as \"patients in their 20s\" while reporting age variability no single decade can produce.", "severity": "none", "rests_on": "logical_necessity", "evidence": "\"There were 3 infections in the experimental group and 2 infections in the control group\" and \"there was no significant difference in the prevalence of postoperative wound infections ... (p = 0.639)\": the uncorrected Pearson chi-squared on [[3,25],[2,26]] gives chi2 = 0.2196, df = 1, p = 0.639339, which rounds to the printed 0.639. All five count sums reconcile exactly (28+28=56; 16+12=28; 14+14=28; 3+2=5; 1+4=5).", "reproduction": "metascience chi2 --observed \"[[3,25],[2,26]]\" --reported-p 0.639 --decimals-p 3", "plain": "The arithmetic in this small surgical trial holds up: the one statistical test it reports can be reproduced exactly from the patient counts it prints, and every total adds up. What the reader should weigh instead is that only five patients in the whole study developed an infection, and from that the authors conclude that extra antibiotics after surgery \"may not be necessary\" without ever saying how large a real benefit their study could still have missed."}, "findings": [{"rank": 1, "title": "Conclusion of \"no difference\" reported with no confidence interval, risk difference or effect estimate of any kind", "severity": "suspicious", "confidence": "high", "location": "Abstract, Conclusion; Results, final paragraph; Discussion, final paragraph", "reported": "\"Prolonged prophylactic antibiotic use after orthognathic surgery may not be necessary, provided that there are no other significant factors for wound infections.\" The only quantity supporting this is \"(p = 0.639)\". The paper prints no confidence interval, no risk difference, no relative risk and no odds ratio for any quantity anywhere.", "computed": "The largest effect still compatible with these data could not be bounded, because absence_of_evidence requires an interval, or a coefficient with its standard error, and the paper supplies neither. The only effect estimate obtainable is one derived here from the Table 1 counts: Fisher odds ratio 1.56, itself with no interval. With 5 events across 56 patients, Pearson p = 0.639339, Yates p = 1.0 and Fisher exact p = 1.0 -- all non-significant, none of them informative about magnitude.", "assumptions": "None beyond the paper's own statements. CONSORT 2010 item 17a is cited as the named standard; the paper predates it, but the identically-worded requirement to report each outcome's effect size with its precision was CONSORT 2001 item 17, which did not. The paper claims no guideline.", "warrant": "named_guideline", "reproduction": "metascience chi2 --observed \"[[3,25],[2,26]]\" --reported-p 0.639 --decimals-p 3", "stage1_finding_ids": ["null_conclusion_with_no_interval", "chi2_reproduces"], "consequence": {"basis": "asserted", "flips_significance": false, "claims_affected": 1, "explanation": "The paper's sole conclusion -- that prolonged postoperative prophylaxis may be unnecessary -- is a claim of no effect, and the paper prints nothing from which a reader could tell 'no difference' from 'a difference this study was too small to see'."}, "plain": "The authors conclude that carrying on with antibiotics after this jaw surgery may be unnecessary. Their evidence is that three patients in one group and two in the other got infected, a difference that could easily be chance. But they never report the range of effects their data would still be compatible with -- so a reader cannot tell whether the study rules out a worthwhile benefit or simply was not big enough to detect one. Reporting that range is a standard requirement for trials, and it is what turns 'we found no difference' into a usable result."}, {"rank": 2, "title": "Trial sized only to detect a 30-percentage-point difference in infection rates, and the abstract states the null conclusion without that qualification", "severity": "suspicious", "confidence": "high", "location": "Discussion, paragraph 5, read against Table 1 and the Abstract Conclusion", "reported": "\"Twenty eight patients were enrolled in each group. The samples were selected at a significance level of alpha = 0.05 and a test power beta = 0.20. A smaller infection rate was set to 5%, and the difference in the estimated infection rate was set to 30%.\" Observed: 3 of 28 versus 2 of 28.", "computed": "Not computed. Stated by quotation from the paper's own design parameters: the design targets a contrast between a 5% and a 35% infection rate, and the observed contrast is a one-patient difference. The a-priori calculation could not be reproduced -- verify_power_analysis and required_n both take Cohen's h for a two-proportions design and no registered tool converts a pair of proportions to h, so this is recorded as a gap in our toolkit and not as a defect in the paper.", "assumptions": "None beyond the paper's own statements. No arithmetic is claimed for this finding; the power calculation itself was not verified, and every input needed to verify it is stated by the paper.", "warrant": "logical", "reproduction": "no command applies; this is a reading of the paper's own stated design parameters in Discussion paragraph 5 against the counts in Table 1", "stage1_finding_ids": ["design_powered_only_for_a_very_large_effect", "power_analysis_unverifiable"], "consequence": {"basis": "asserted", "flips_significance": false, "claims_affected": 1, "explanation": "The Abstract's unqualified conclusion that prophylaxis 'may not be necessary' rests on a design the paper's own printed parameters show was sized only for a 30-percentage-point difference, so a clinically meaningful smaller difference was never detectable."}, "plain": "Before running the study the authors calculated how many patients they needed, assuming they were looking for a very large difference -- roughly 5% of one group getting infected versus 35% of the other. A study built to spot a gap that big is nearly blind to a smaller but still important one. The main text does acknowledge that the numbers were small and that larger studies are needed; the abstract, which is what most readers see, states the conclusion without that caveat. Two further points a reader should note: the power calculation appears in the discussion rather than the methods, and the paper cites no trial registration, so there is no way to confirm it was done before the data were collected."}, {"rank": 3, "title": "Reported age variability is unreachable for a cohort confined to \"patients in their 20s\"", "severity": "suspicious", "confidence": "medium", "location": "Patients and Methods, paragraph 1 (inclusion) read against Results, paragraph 1 and Table 1, Age row", "reported": "\"Fifty-six patients in their 20s without a specific medical history\" (Methods); \"The mean (SD) age of the experimental group was 23.9 years (5.84)\" and \"The mean (SD) age of the control group was 24.3 years (6.33)\" (Results). The paper prints no age range and no numeric inclusion cut-offs.", "computed": "Treating \"in their 20s\" as the interval [20, 29], the largest standard deviation any 28-person sample can have is 4.58 years. The reported SDs are 5.84 (127% of that ceiling) and 6.33 (138%). The standard-error misreading is worse, not better: read as standard errors these would imply SDs of 30.9 and 33.5 years. Crucially, both values are perfectly attainable once the decade restriction is dropped -- GRIMMER returns consistent for both triples on an unrestricted age range (example: sum 669, sum-of-squares 16905 gives mean 23.893, SD 5.839), and SPRITE reports feasible_ignoring_bounds: true.", "assumptions": "THE BOUND IS MINE, AND IT IS DECISIVE. The paper prints no numerals for an age range; [20, 29] is my translation of the phrase \"in their 20s\", so per rulebook rule 4 this is capped at suspicious and cannot be the paper's headline problem. The tool applied the same cap on its own, reporting bound_source 'assumed'. Ages are also assumed to be whole years, which the paper does not state.", "warrant": "logical", "reproduction": "metascience sd-or-se --reported-value 5.84 --n 28 --reported-as SD --decimals 2 --variable-range-min 20 --variable-range-max 29 --bound-source assumed", "stage1_finding_ids": ["age_sd_vs_in_their_20s_experimental", "age_sd_vs_in_their_20s_control", "sprite_age_within_a_single_decade", "grimmer_age_experimental", "grimmer_age_control"], "consequence": {"basis": "asserted", "flips_significance": false, "claims_affected": 0, "explanation": "Age is a baseline descriptor here; no analysis in the paper is conditioned on it, so no reported result changes either way -- what is in question is only how homogeneous the cohort actually was."}, "plain": "The methods describe the participants as patients in their twenties. The ages reported are spread too widely for that to be literally true: with an average of about 24 and the spread the authors report, some patients must have been outside their twenties. The likeliest explanation by far is simply loose wording -- 'in their 20s' meaning 'young adults' rather than a strict entry rule -- and the age figures themselves are perfectly ordinary and internally sound for a jaw-surgery group. Nothing the study concludes depends on this. It is worth noting only because the paper never states the actual age range, so a reader cannot check who was really enrolled."}, {"rank": 4, "title": "Chi-squared applied where all expected infected-cell counts are 2.5, with no exact test reported", "severity": "suspicious", "confidence": "high", "location": "Patients and Methods, statistical analysis paragraph; Results, final paragraph", "reported": "\"Statistical analysis was performed using a chi-squared test on the Statistical Package for the Social Sciences (SPSS for windows, ver. 12.0)\", yielding \"(p = 0.639)\". No exact test is mentioned anywhere.", "computed": "The expected-count array from the 2x2 is [[2.5, 25.5], [2.5, 25.5]] -- both infected cells fall below the conventional minimum of 5 for the chi-squared approximation. The reported p is nonetheless exactly right for the convention actually used: uncorrected Pearson gives p = 0.639339. Under the alternatives ordinarily preferred at these counts, Fisher's exact gives p = 1.0 and the Yates-corrected chi-squared gives p = 1.0.", "assumptions": "The minimum-expected-count rule of 5 is Cochran's convention, an external standard I supply; the paper claims no guideline and states no analysis assumptions. Under every convention the result is non-significant, so the conclusion is unaffected.", "warrant": "field_norm", "reproduction": "metascience chi2 --observed \"[[3,25],[2,26]]\" --reported-p 0.639 --decimals-p 3", "stage1_finding_ids": ["chi2_expected_counts_below_5", "chi2_reproduces"], "consequence": {"basis": "computed", "flips_significance": false, "claims_affected": 1, "explanation": "The paper's sole claim is non-significant under Pearson (p = 0.639), Yates (p = 1.0) and Fisher exact (p = 1.0) alike, so the choice of test changes only how much confidence the printed p-value deserves, not the conclusion."}, "plain": "With only five infections spread across fifty-six patients, the standard chi-squared test the authors used is not really the right tool -- it is an approximation that needs more events than this to be reliable, and an exact test is the usual choice. This is not a case where it matters to the answer: the result is 'no significant difference' whichever of the three standard tests you run. It matters to how much weight the specific figure 0.639 should carry. Reaching for the software's default output here is extremely common in this literature."}, {"rank": 5, "title": "Unblinded assessment of a largely subjective outcome, and a Methods sentence referring to a placebo the study never used", "severity": "suspicious", "confidence": "high", "location": "Patients and Methods, paragraph 2", "reported": "\"The patients in the experimental group received only 1.0 g of a third-generation cephalosporin (Cefpiramide) intravenously 30 minutes before surgery and did not receive the placebo.\" Allocation was by \"randomization codes generated by Microsoft Excel\"; no blinding, no allocation concealment beyond that code list, and no trial registration is described.", "computed": "Not computed; this is a reading of the Methods text against the outcome definition. Three of the four CDC surgical-site-infection criteria the paper adopts rest on clinician judgement of swelling, redness, pain, and the decision to open a wound -- and the paper records that the wounds \"were opened by a surgeon\" in the infected cases.", "assumptions": "CONSORT item 11a (blinding: if done, who was blinded and how; if not, say so) is an external standard; the paper claims no guideline and predates CONSORT 2010, though the equivalent item existed in CONSORT 2001. The direction of any ascertainment bias is unknown and is not asserted here.", "warrant": "named_guideline", "reproduction": "no command applies; this is a reading of the Methods text in Patients and Methods, paragraph 2", "stage1_finding_ids": ["unblinded_no_placebo_subjective_outcome"], "consequence": {"basis": "asserted", "flips_significance": null, "claims_affected": 1, "explanation": "The single reported comparison depends on assessors who necessarily knew each patient's arm judging signs that are largely subjective, so it is open to ascertainment bias in an undetermined direction."}, "plain": "Nobody was blinded: with no dummy treatment given, the patients and the surgical team always knew who was still receiving antibiotics, while the decision about whether a wound counted as infected rested largely on a clinician's judgement of swelling, redness and pain. That combination can push results in either direction and the paper does not address it. Separately, the sentence saying patients \"did not receive the placebo\" refers to a placebo that is never introduced anywhere else in the paper -- wording that appears to have been carried over from a placebo-controlled design that was not the study actually run."}, {"rank": 6, "title": "The chi-squared statistic and its degrees of freedom are absent from both the Results and the Abstract", "severity": "suspicious", "confidence": "high", "location": "Results, final paragraph; Abstract, Results", "reported": "\"According to the chi-squared test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).\" The test statistic and degrees of freedom appear in neither location.", "computed": "statcheck run over the body text returned 0 statistics -- there is no complete test result anywhere in the paper for it to verify. The omission is fully remediable here: Table 1 prints the underlying counts, so the test was reconstructed (chi2 = 0.2196, df = 1, p = 0.639339).", "assumptions": "None beyond the paper's own text. This is an external reporting expectation I supply -- that a p-value be accompanied by the statistic and degrees of freedom that produced it -- and the paper claims no reporting guideline.", "warrant": "field_norm", "reproduction": "metascience statcheck --text \"According to the chi-squared test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).\"", "stage1_finding_ids": ["no_test_statistic_or_df_reported"], "consequence": {"basis": "asserted", "flips_significance": false, "claims_affected": 0, "explanation": "No conclusion is affected: Table 1 supplies the cell counts, so the test is recomputable and was recomputed, reproducing the printed p exactly."}, "plain": "The paper gives a p-value but not the test result behind it, so on its face the single statistical claim in the study cannot be independently checked. In this case it does no harm, because the table prints the raw patient counts and the test can be rebuilt from them -- which is what was done here, and it matches. It is worth flagging only because this one sentence is the entire statistical content of the paper."}], "triage": [{"stage1_finding_id": "quote_not_located (all 7 accusations)", "disposition": "discarded", "reason": "Global extraction artefact, settled once: the sweep's quotes carry doubled inter-word spacing from a PDF text layer while the XML body is single-spaced, so no span could string-match. Re-reading the XML located all seven verbatim; zero were real weaknesses."}, {"stage1_finding_id": "null_conclusion_with_no_interval", "disposition": "superseded", "reason": "Sweep graded it indeterminate because absence_of_evidence could not run for want of an interval; the reportable defect is not the failed check but the paper stating a null conclusion with no effect estimate at all, which is a reading that stands on its own at suspicious."}, {"stage1_finding_id": "power_analysis_unverifiable", "disposition": "merged", "reason": "Folded into the design-sensitivity finding; the unreproduced power calculation is our toolkit gap (no proportions-to-Cohen's-h conversion) and is recorded in not_checked, not charged to the paper."}, {"stage1_finding_id": "sprite_age_within_a_single_decade", "disposition": "merged", "reason": "Same assumed 20-29 bound as the two check_sd_or_se age findings, reached by a second engine; reporting it separately would triple-count one observation."}, {"stage1_finding_id": "age_sd_vs_in_their_20s_control", "disposition": "merged", "reason": "Both arms fail the same assumed ceiling for the same reason; presented as one finding covering both age rows."}, {"stage1_finding_id": "grimmer_default_scale_artifact", "disposition": "discarded", "reason": "A defect in the sweep's own first call, not in the paper -- GRIMMER's 1-7 Likert default was applied to an age of 23.9; the sweep already retracted it and re-running with an age-appropriate range returns consistent."}, {"stage1_finding_id": "grim_age_no_resolution", "disposition": "merged", "reason": "A refusal, correctly recorded: at n=28 with one decimal every printable mean is attainable, so GRIM has no discriminating power here. Carried into not_checked so it cannot read as a pass."}, {"stage1_finding_id": "table1_supports_no_per_cell_check", "disposition": "merged", "reason": "A coverage statement about our parser, not about the paper; carried into not_checked with the two parse causes named."}], "not_checked": [{"location": "Discussion, paragraph 5 -- the a-priori power calculation", "reason": "Every input is stated (alpha 0.05, power 0.80, p1 = 5%, difference 30 percentage points, n = 28 per arm), so the calculation is in principle fully reproducible. It could not be run because verify_power_analysis and required_n both take Cohen's h for a two-proportions design and no registered tool converts a pair of proportions to h. This is a gap in our toolkit, not a reporting failure by the authors."}, {"location": "Results, final paragraph -- the largest effect still compatible with the null result", "reason": "absence_of_evidence requires a confidence interval, or a coefficient with its standard error. The paper prints no interval, risk difference, relative risk or odds ratio for any quantity, and states no smallest effect size of interest, so neither a permitted-effect bound nor an equivalence test could be computed. This is the substance of finding 1."}, {"location": "Table 1, Age row and Sex row -- cell-by-cell checks", "reason": "The age cells print with a trailing unit ('23.9 +/- 5.84 yrs') and the sex cells as a ratio ('16 : 12'); the typed parser returned both as non-numeric with an empty candidate-format list, so no declared format could rescue them. All eight data cells went to check_table and none yielded a per-cell check. Nothing was lost: the age values were checked from the Results prose, which prints the same numbers in readable form, and the sex counts by summation."}, {"location": "Table 1 as a whole -- source provenance", "reason": "The XML carries Table 1 as an image with no cells, so the grid used here was recovered from the PDF. Every number in it is independently restated in the Results prose of the XML (both age means with SDs, 3 and 2 infections, 1 dehiscence), so the two sources corroborate each other; the sex counts 16:12 and 14:14 rest on the PDF grid alone, though the prose ratios 4:3 and 1:1 are their correct reduced forms."}, {"location": "Baseline comparability of the two arms (csf_test, bayesian_table1_dispersion)", "reason": "Both tools need baseline p-values or a set of baseline rows with means, SDs and ns. The paper reports two baseline characteristics only (age, sex), prints no baseline p-values, and performs no baseline comparison. Two rows is far too few for a dispersion or Carlisle-style similarity test, so neither was run and no statement about randomisation integrity can be made either way."}, {"location": "Duplication across tables (detect_duplication)", "reason": "The paper contains a single table with exactly two (mean, SD) pairs, and those differ (23.9/5.84 versus 24.3/6.33). There is no second table or second sample to compare against."}, {"location": "Results, paragraph 1 -- mean duration of surgery (3 h 40 min and 3 h 55 min)", "reason": "Bare means in clock units with no dispersion and no accompanying test; no registered check applies, and the paper makes no comparison between arms on this measure."}, {"location": "Results, paragraph 1 -- GRIM on the two age means", "reason": "The tool refused, and the refusal is the result: at n = 28 with one decimal place every printable value is attainable as a mean of integers, so GRIM has no resolution here. Recorded so it cannot be read as a pass."}, {"location": "Multiplicity correction (multiplicity_report)", "reason": "The paper reports exactly one statistical test of one hypothesis. A single planned confirmatory test needs no correction, and running the tool on one p-value would manufacture a family that does not exist."}, {"location": "GRIM-U rank-sum granularity checks", "reason": "Deliberately not run. The paper's only p-value comes from a chi-squared test, and GRIM-U applies exclusively to Mann-Whitney/Wilcoxon rank-sum p-values."}, {"location": "Supplementary materials", "reason": "No supplementary files accompany this paper in the provided directory; only the XML and the PDF are present. Nothing was refused or unreadable -- there is nothing to read."}, {"location": "Trial registration and protocol", "reason": "The paper reports IRB approval by the College of Dentistry, Yonsei University, but cites no registration number or protocol, so prespecification of the outcome and the power calculation could not be verified against any external record. This system reaches no network and could not have checked a registry in any case."}], "limitations": ["This agent reads text and does not see figures. In this case that costs nothing: the paper contains no figures at all, its only display item being Table 1, and no statistic in it appears only in a figure. The figure-extraction pass was therefore not run.", "Table 1 is an image in the publisher XML and carries no cells there, so its grid came from the PDF. Every value in it is independently corroborated by the Results prose in the XML except the sex counts (16:12, 14:14), which are consistent with the prose ratios 4:3 and 1:1 but not separately restated as counts.", "The `quote_not_located` marker fired on all seven of the sweep's accusations. Re-reading the XML located every span verbatim; the cause was uniformly that the sweep's quotes carry doubled inter-word spacing from a PDF text layer while the XML body text is single-spaced. This was a property of our extraction, not of the evidence.", "The age-variability finding rests on translating the phrase \"patients in their 20s\" into the interval [20, 29]. The paper prints no numerals for an age range, so that bound is mine and the finding is capped at `suspicious` accordingly. Both GRIMMER and SPRITE confirm the reported age means and SDs are attainable from whole-year ages once the decade restriction is dropped.", "The paper's a-priori power calculation could not be reproduced because no registered tool converts a pair of proportions to Cohen's h. Every input needed is stated by the authors, so this is a limit of our toolkit and not a gap in their reporting.", "This system reads one paper and reaches no network. It cannot say whether similar patterns appear in other work by these authors, nor how this trial's infection rates compare with equivalent values from other studies in the field -- both of which a reader would want alongside any judgement about a small single-centre trial."], "coverage_summary": {"stats_found": 20, "stats_checked": 14, "tools_run": ["extract_xml", "extract_pdf", "statcheck", "parse_table", "parse_cells_typed", "check_table", "recalc_chi_squared", "check_summation_batch", "grim_check", "grimmer_check", "check_sd_or_se", "sprite_reconstruct", "flag_round_n"], "tables_checked": ["Table 1 (Results according to the Postoperative Antibiotic Prophylaxis) -- image_only in the XML, grid recovered from the PDF and corroborated against the Results prose"]}, "questions_for_authors": [{"question": "Your report gives p = 0.639 for the comparison of postoperative wound infection between arms, based on 3 of 28 versus 2 of 28. Could you send the corresponding effect estimate with a confidence interval -- a risk difference, relative risk or odds ratio -- so that readers can see the range of effects the data remain compatible with?", "why": "The paper's only conclusion is a claim of no difference, and nothing printed allows the largest effect still permitted by the data to be bounded. This is the substance of finding 1."}, {"question": "The Methods describe \"Fifty-six patients in their 20s\", while the reported age standard deviations are 5.84 years (experimental) and 6.33 years (control) at n = 28 per arm -- values that no sample confined to ages 20-29 can produce. Could you supply the actual minimum and maximum ages, or the age inclusion criteria applied?", "why": "Would resolve directly whether 'in their 20s' was a strict entry rule or descriptive shorthand, which is the whole of finding 3."}, {"question": "Could you send the chi-squared statistic and degrees of freedom underlying the reported p = 0.639, and confirm whether an exact test was also considered? The expected counts in both infected cells are 2.5, and Fisher's exact test on the same table returns p = 1.0.", "why": "Settles which test convention was used and whether the low expected counts were considered. Our reconstruction indicates an uncorrected Pearson chi-squared, which reproduces the printed p exactly."}, {"question": "The Discussion states that samples were selected at alpha = 0.05 and beta = 0.20 with a smaller infection rate of 5% and a difference of 30%. Could you provide the worked sample-size calculation, and confirm the date on which it was performed relative to enrolment?", "why": "The calculation appears in the Discussion rather than the Methods and no registration is cited, so its timing relative to data collection cannot be established from the published record."}, {"question": "The Methods state that the experimental group \"did not receive the placebo\", although no placebo is described elsewhere in the paper. Could you clarify whether any blinding of patients, treating staff or outcome assessors was in place when the CDC surgical-site-infection criteria were applied?", "why": "Three of the four outcome criteria rest on clinician judgement, so who knew the allocation at assessment bears directly on the single reported comparison."}], "report_markdown": "This is a small single-centre prospective trial from Yonsei University: 56 patients undergoing Le Fort I osteotomy with bilateral intraoral vertical ramus osteotomy were allocated by Excel-generated randomisation codes to receive either a single preoperative dose of cefpiramide or that dose plus three further days of twice-daily antibiotic. The outcome was postoperative wound infection by CDC surgical-site-infection criteria, assessed to two weeks. Three infections occurred in the experimental arm and two in the control arm, and the authors conclude that prolonged prophylaxis may not be necessary.\n\n**What the checks bought.** Fourteen of the nineteen checks attempted actually ran, and every one of the seven arithmetic checks passed. The paper's entire inferential content is a single sentence, and that sentence reproduces exactly: an uncorrected Pearson chi-squared on the Table 1 counts gives chi-squared = 0.2196, df = 1, p = 0.639339, which rounds to the printed 0.639 -- and the match is close enough to pin down which convention was used. All five count relationships hold exactly with zero tolerance: the arms sum to the enrolled total, both sex breakdowns sum to their arm's n, the per-arm infections sum to five, and -- the most informative of these, because it is an independent restatement rather than a column total -- the narrative account of individual cases (one diagnosed by sinus haziness, four by mandibular signs) sums to the same five. The prose sex ratios 4:3 and 1:1 are the correct reduced forms of the tabulated 16:12 and 14:14. Both age mean/SD pairs are attainable from whole-year ages once no artificial range is imposed. Sample sizes of 56 and 28 do not trip the round-N heuristic. That is what a small, carefully prepared paper looks like, and it is worth saying plainly: nothing in this paper's numbers contradicts anything else in it.\n\nThat verdict comes with the open questions named in the same breath, because they are real and a reader should carry them.\n\n**On the null conclusion.** The paper's problem is not its arithmetic but the distance between what it measured and what it concludes. Five infections across fifty-six patients is very thin evidence for a claim of equivalence, and the paper offers the reader no instrument for judging how thin: no confidence interval, no risk difference, no relative risk, no odds ratio, for any quantity anywhere. The only effect estimate obtainable is one derived here from the counts -- a Fisher odds ratio of 1.56, itself unbounded. The authors' own design parameters say the rest: sized for a contrast between a 5% and a 35% infection rate, this trial was built to detect a thirty-percentage-point gap and observed a one-patient difference. The Discussion does concede that \"the number was small\" and calls for larger studies. The Abstract does not, and the Abstract is what most readers will see.\n\n**On the age description.** The one genuine tension between two of the paper's own statements is that a cohort described as \"patients in their 20s\" cannot produce age standard deviations of 5.84 and 6.33 years. I should be direct that the ceiling here is mine: the paper prints no age range, so translating that phrase into [20, 29] is my reading, and the checks cap themselves at `suspicious` for exactly that reason. The likeliest explanation by a wide margin is loose phrasing rather than a strict entry rule -- an SD near six years is entirely ordinary for an orthognathic-surgery cohort, and the standard-error misreading is ruled out too, since as standard errors these values would imply SDs of thirty years. Nothing the paper concludes depends on age. It belongs in the review only because the paper never states the range that would settle it.\n\n**On the test and the design.** Two smaller points, neither of which changes an answer. The chi-squared approximation is being asked to work with expected counts of 2.5 in both infected cells, where an exact test is the conventional choice; the conclusion is unchanged under all three conventions (Pearson 0.639, Yates 1.0, Fisher 1.0), so what is at stake is only how much weight the figure 0.639 deserves. And the paper reports its p-value without the statistic or degrees of freedom that produced it -- ordinarily an obstacle to verification, though here fully remediable, since Table 1 supplies the counts and the test was rebuilt from them.\n\nFinally, a design observation that no number can express: with no placebo given, everyone knew which patients were still receiving antibiotics, while three of the four criteria defining the outcome rest on clinician judgement of swelling, redness and pain. The Methods sentence referring to \"the placebo\" -- a placebo introduced nowhere else in the paper -- suggests wording carried over from a design that was not the one run.\n\nThe numbers reported here reconcile with each other and with the statistics printed beside them. The conclusion drawn from them is weaker than the abstract implies."}, "result": "Structured output provided successfully", "vignette": {"asked": {"question": "Not a forensic check. This call reads a file or emits the run's structured output; it asks nothing of the paper.", "no_question": true, "not_a_check": true, "values": [{"name": "confidence", "value": "medium", "role": "input"}, {"name": "verdict", "value": "reconciles", "role": "input"}, {"name": "headline", "value": "{\"statement\": \"Every number this paper in": "The strictest common correction: divide your threshold by the number of tests. Safe, and often so conservative that real effects are missed.", "example": "Twenty tests means each needs p < .0025 rather than p < .05.", "detects": ["multiplicity_report"]}, {"term": "Family-wise error rate", "plain": "The chance that AT LEAST ONE test in a family comes out 'significant' by luck alone. It grows with every extra test, which is the whole reason corrections exist: Bonferroni controls exactly this quantity.", "example": "One test at the usual threshold risks a 5% false alarm; twenty independent ones together risk about 64%.", "detects": ["multiplicity_report"]}, {"term": "Granularity", "plain": "Averages of whole numbers cannot land anywhere. With 20 people answering 1-5, the mean moves in steps of 1/20 -- so some printed averages are arithmetically impossible.", "example": "A mean of 3.47 from 20 integer responses. No set of answers produces it.", "detects": ["grim_check", "grim_percentage", "grimmer_check", "debit_check"]}, {"term": "Clustering", "plain": "When measurements come in groups -- several from each patient, or each clinic -- they are not independent, and treating them as if they were makes results look more certain than they are.", "example": "Fifty observations from ten people is not fifty independent data points.", "detects": ["multiplicity_report"]}, {"term": "Multicollinearity", "plain": "Two predictors that measure nearly the same thing. The model cannot tell their effects apart, so individual coefficients become unstable and can even flip sign.", "example": "Two questionnaires correlated at r = .95 entered together; each 'effect' is really the pair's.", "detects": []}, {"term": "SD versus SE", "plain": "The standard deviation describes how spread out the people are; the standard error describes how precisely you know the average. The SE is always the smaller, by a factor of the square root of the sample size, and swapping them makes results look far weep, editorial", "detail": ""}], "pdf_name": "10.3349--ymj.2009.50.1.55.pdf", "pdf_pages": [{"doc": 0, "page": 1, "img": "pages/p001.jpg", "pw": 595.2, "ph": 842.0, "lines": [{"t": "Yonsei Med J 50(1):55 - 59, 2009", "x": 56.7, "y": 77.3, "w": 125.4, "h": 10.2}, {"t": "DOI 10.3349/ymj.2009.50.1.55", "x": 56.7, "y": 89.3, "w": 113.7, "h": 10.2}, {"t": "Yonsei Med J Vol. 50, No. 1, 2009", "x": 415.8, "y": 755.6, "w": 122.8, "h": 8.9}, {"t": "The Efficacy of Postoperative Prophylactic Antibiotics in ", "x": 54.6, "y": 145.6, "w": 457.6, "h": 19.9}, {"t": "Orthognathic Surgery: A Prospective Study in Le Fort I ", "x": 54.6, "y": 165.6, "w": 454.4, "h": 19.9}, {"t": "Osteotomy and Bilateral Intraoral Vertical Ramus Osteotomy ", "x": 54.6, "y": 185.6, "w": 482.8, "h": 19.9}, {"t": "Sang-Hoon Kang,1,2 Jae-Ha Yoo,1,3 and Choong-Kook Yi1", "x": 54.6, "y": 218.3, "w": 247.2, "h": 12.8}, {"t": "Department of Oral and Maxillofacial Surgery, 1College of Dentistry, Yonsei University, Seoul; 2National Health Insurance ", "x": 54.6, "y": 243.5, "w": 484.0, "h": 11.6}, {"t": "Corporation Ilsan Hospital, Gyeonggi; 3Wonju Christian Hospital, Kangwon, Korea.", "x": 54.6, "y": 255.5, "w": 325.2, "h": 11.6}, {"t": "Received March 7, 2008", "x": 67.3, "y": 663.2, "w": 88.7, "h": 9.7}, {"t": "Accepted April 14, 2008", "x": 67.3, "y": 673.2, "w": 89.8, "h": 9.7}, {"t": "Reprint address: requests to Dr. Choong-Kook Yi, Department ", "x": 67.3, "y": 686.1, "w": 214.1, "h": 9.7}, {"t": "of Oral and Maxillofacial Surgery, College of Dentistry, Yonsei ", "x": 57.4, "y": 696.1, "w": 224.1, "h": 9.7}, {"t": "University, 250 Seongsanno, Seodaemun-gu, Seoul 120-752, Korea. ", "x": 57.4, "y": 706.1, "w": 224.3, "h": 9.7}, {"t": "Tel: 82-2-2228-3138, Fax: 82-2-364-0992, E-mail: choongomfs@ ", "x": 57.4, "y": 716.1, "w": 224.0, "h": 9.7}, {"t": "yuhs.ac", "x": 57.4, "y": 726.1, "w": 24.4, "h": 9.7}, {"t": "Purpose: This study examined the efficacy of the postopera-", "x": 66.7, "y": 291.4, "w": 217.1, "h": 10.0}, {"t": "tive prophylactic antibiotics used in orthognathic surgery. The ", "x": 56.7, "y": 302.8, "w": 229.1, "h": 10.0}, {"t": "prevalence of surgical site infections (SSIs) was determined ", "x": 56.7, "y": 314.2, "w": 229.0, "h": 10.0}, {"t": "according to the use of postoperative prophylactic antibiotics. ", "x": 56.7, "y": 325.6, "w": 229.2, "h": 10.0}, {"t": "Patients and Methods: Fifty-six patients were divided into 2 ", "x": 56.7, "y": 337.0, "w": 229.0, "h": 10.0}, {"t": "groups. Each patient intravenously received 1.0 g of a third- ", "x": 56.7, "y": 348.4, "w": 229.1, "h": 10.0}, {"t": "generation cephalosporin (Cefpiramide) 30 minutes before ", "x": 56.7, "y": 359.8, "w": 229.0, "h": 10.0}, {"t": "surgery. Among them, 28 patients in the control group received ", "x": 56.7, "y": 371.2, "w": 229.5, "h": 10.0}, {"t": "1.0 g Cefpiramide twice daily until the third day after surgery. ", "x": 56.7, "y": 382.6, "w": 229.5, "h": 10.0}, {"t": "The postoperative wounds were examined regularly for the ", "x": 56.7, "y": 394.0, "w": 229.0, "h": 10.0}, {"t": "presence of infectious signs. Results: There was no significant ", "x": 56.7, "y": 405.4, "w": 229.1, "h": 10.0}, {"t": "difference in the incidence of postoperative wound infections ", "x": 56.7, "y": 416.8, "w": 229.0, "h": 10.0}, {"t": "between patients who had received postoperative prophylactic ", "x": 56.7, "y": 428.2, "w": 229.4, "h": 10.0}, {"t": "antibiotic administration and those who had not (p = 0.639). ", "x": 56.7, "y": 439.6, "w": 229.0, "h": 10.0}, {"t": "Conclusion: Prolonged prophylactic antibiotic use after ortho-", "x": 56.7, "y": 451.0, "w": 226.7, "h": 10.0}, {"t": "gnathic surgery may not be necessary, provided that there are ", "x": 56.7, "y": 462.4, "w": 229.3, "h": 10.0}, {"t": "no other significant factors for wound infections. ", "x": 56.7, "y": 473.8, "w": 188.1, "h": 10.0}, {"t": "Key Words: Orthognathic surgery, prophylactic antibiotics, ", "x": 56.7, "y": 490.9, "w": 229.0, "h": 10.0}, {"t": "surgical site infection", "x": 56.7, "y": 501.9, "w": 80.5, "h": 10.0}, {"t": "INTRODUCTION", "x": 56.7, "y": 538.4, "w": 91.1, "h": 13.3}, {"t": "Antibiotics are used to treat and prevent post-", "x": 66.7, "y": 564.5, "w": 216.8, "h": 12.0}, {"t": "operative infections. In 1960, it was reported that ", "x": 56.7, "y": 577.5, "w": 229.3, "h": 12.0}, {"t": "pathogens are present during surgery1,2 regardless ", "x": 56.7, "y": 588.8, "w": 229.7, "h": 13.7}, {"t": "of how aseptic the surgery might appear. Moreover, ", "x": 56.7, "y": 603.5, "w": 229.5, "h": 12.0}, {"t": "the correlation between prophylactic antibiotics ", "x": 56.7, "y": 616.5, "w": 229.3, "h": 12.0}, {"t": "and postoperative wound infections was demon-", "x": 56.7, "y": 629.5, "w": 226.8, "h": 12.0}, {"t": "strated. Therefore, prophylactic antibiotics are ", "x": 311.8, "y": 291.0, "w": 229.3, "h": 12.0}, {"t": "now used in almost all surgical procedures. The ", "x": 311.8, "y": 304.0, "w": 229.3, "h": 12.0}, {"t": "most effective method of antibiotic prophylaxis is ", "x": 311.8, "y": 317.0, "w": 229.7, "h": 12.0}, {"t": "the preoperative administration of antibiotics ", "x": 311.8, "y": 330.0, "w": 229.3, "h": 12.0}, {"t": "because it can act at the time when the wound is ", "x": 311.8, "y": 343.0, "w": 229.6, "h": 12.0}, {"t": "potentially contaminated by bacteria.2-4 On the ", "x": 311.8, "y": 354.3, "w": 229.2, "h": 13.7}, {"t": "other hand, it was also reported that the use of ", "x": 311.8, "y": 369.0, "w": 229.3, "h": 12.0}, {"t": "antibiotics after 3 - 4 hours of a bacterial invasion ", "x": 311.8, "y": 382.0, "w": 229.3, "h": 12.0}, {"t": "is unsuitable.5", "x": 311.8, "y": 393.3, "w": 64.3, "h": 13.7}, {"t": "Prophylactic antibiotics are generally admini-", "x": 321.8, "y": 408.0, "w": 216.8, "h": 12.0}, {"t": "stered both preoperatively and postoperatively. ", "x": 311.8, "y": 421.0, "w": 229.3, "h": 12.0}, {"t": "Hence, the effects of the indiscriminate method ", "x": 311.8, "y": 434.0, "w": 229.3, "h": 12.0}, {"t": "and period of administration are unclear, consi-", "x": 311.8, "y": 447.0, "w": 226.8, "h": 12.0}, {"t": "dering the multiple factors that contribute to ", "x": 311.8, "y": 460.0, "w": 229.3, "h": 12.0}, {"t": "postoperative wound infections.6-8", "x": 311.8, "y": 471.3, "w": 156.3, "h": 13.7}, {"t": "The use of antibiotic prophylaxis is controver-", "x": 321.8, "y": 486.0, "w": 216.8, "h": 12.0}, {"t": "sial even in orthognathic surgery, which is a ", "x": 311.8, "y": 499.0, "w": 229.2, "h": 12.0}, {"t": "representative procedure for oral and maxillo-", "x": 311.8, "y": 512.0, "w": 226.8, "h": 12.0}, {"t": "facial surgery. There are reports show no increase ", "x": 311.8, "y": 525.0, "w": 229.4, "h": 12.0}, {"t": "in the incidence of infection without the admini-", "x": 311.8, "y": 538.0, "w": 226.8, "h": 12.0}, {"t": "stration of postoperative prophylactic antibiotics. ", "x": 311.8, "y": 551.0, "w": 229.3, "h": 12.0}, {"t": "9,10 On the other hand, there are reports to suggest ", "x": 311.8, "y": 562.4, "w": 229.5, "h": 13.7}, {"t": "the necessity of continuous antibiotic administra-", "x": 311.8, "y": 577.0, "w": 226.8, "h": 12.0}, {"t": "tion.11 However, orthognathic surgery is mainly ", "x": 311.8, "y": 588.3, "w": 229.2, "h": 13.7}, {"t": "performed on young patients without a specific ", "x": 311.8, "y": 603.0, "w": 229.2, "h": 12.0}, {"t": "medical history. Moreover, the number of factors ", "x": 311.8, "y": 616.0, "w": 229.3, "h": 12.0}, {"t": "associated with the development of postoperative ", "x": 311.8, "y": 629.0, "w": 229.7, "h": 12.0}, {"t": "wound infections decreases as the procedure ", "x": 311.8, "y": 642.0, "w": 229.3, "h": 12.0}, {"t": "becomes more generalized and its technique ", "x": 311.8, "y": 655.0, "w": 229.2, "h": 12.0}, {"t": "advances.", "x": 311.8, "y": 668.0, "w": 43.6, "h": 12.0}, {"t": "The aims of this clinical study were to evaluate ", "x": 321.8, "y": 681.0, "w": 219.5, "h": 12.0}, {"t": "the prevalence of postoperative wound infections ", "x": 311.8, "y": 694.0, "w": 229.3, "h": 12.0}, {"t": "with or without antibiotic prophylaxis after ortho-", "x": 311.8, "y": 707.0, "w": 226.9, "h": 12.0}, {"t": "gnathic surgery in young patients without any ", "x": 311.8, "y": 720.0, "w": 229.2, "h": 12.0}]}, {"doc": 0, "page": 2, "img": "pages/p002.jpg", "pw": 595.2, "ph": 842.0, "lines": [{"t": "Sang-Hoon Kang, et al.", "x": 256.4, "y": 77.6, "w": 82.4, "h": 8.9}, {"t": "56", "x": 56.7, "y": 79.0, "w": 11.0, "h": 11.3}, {"t": "Yonsei Med J Vol. 50, No. 1, 2009", "x": 56.7, "y": 755.6, "w": 122.8, "h": 8.9}, {"t": "specific medical history, and to identify criteria for ", "x": 56.7, "y": 102.7, "w": 229.5, "h": 12.0}, {"t": "appropriate use of prophylactic antibiotics in ", "x": 56.7, "y": 115.8, "w": 229.3, "h": 12.0}, {"t": "orthognathic surgery.", "x": 56.7, "y": 128.7, "w": 98.3, "h": 12.0}, {"t": "PATIENTS AND METHODS ", "x": 56.7, "y": 167.6, "w": 153.8, "h": 13.3}, {"t": "Fifty-six patients in their 20s without a specific ", "x": 66.7, "y": 193.8, "w": 219.3, "h": 12.0}, {"t": "medical history, and who were to undergo ortho-", "x": 56.7, "y": 206.7, "w": 226.9, "h": 12.0}, {"t": "gnathic surgical procedures at the department of ", "x": 56.7, "y": 219.7, "w": 229.3, "h": 12.0}, {"t": "oral and maxillofacial surgery at the dental hospi-", "x": 56.7, "y": 232.8, "w": 226.8, "h": 12.0}, {"t": "tal of Yonsei University were enrolled in this ", "x": 56.7, "y": 245.7, "w": 229.2, "h": 12.0}, {"t": "study. A horizontal maxillary osteotomy and ver-", "x": 56.7, "y": 258.7, "w": 226.8, "h": 12.0}, {"t": "tical ramus mandibular osteotomy were per-", "x": 56.7, "y": 271.8, "w": 226.7, "h": 12.0}, {"t": "formed by the same oral surgeon with the aid of ", "x": 56.7, "y": 284.7, "w": 229.3, "h": 12.0}, {"t": "trained nurses and residents under hypotensive ", "x": 56.7, "y": 297.7, "w": 229.2, "h": 12.0}, {"t": "general anesthesia. No bone grafts were per-", "x": 56.7, "y": 310.8, "w": 226.7, "h": 12.0}, {"t": "formed. The duration of surgery was less than 5 ", "x": 56.7, "y": 323.7, "w": 229.3, "h": 12.0}, {"t": "hours. During surgery, maxillomandibular fixation ", "x": 56.7, "y": 336.7, "w": 229.5, "h": 12.0}, {"t": "was placed using steel wires, and drainage tubes ", "x": 56.7, "y": 349.8, "w": 229.3, "h": 12.0}, {"t": "were placed on both sides of the mandible. The ", "x": 56.7, "y": 362.7, "w": 229.2, "h": 12.0}, {"t": "drainage tubes were removed 2 days after surgery. ", "x": 56.7, "y": 375.7, "w": 229.6, "h": 12.0}, {"t": "The wires used for maxillomandibular fixation ", "x": 56.7, "y": 388.8, "w": 229.3, "h": 12.0}, {"t": "were removed and the sutures were taken out ", "x": 56.7, "y": 401.7, "w": 229.3, "h": 12.0}, {"t": "from the wounds 7 days after surgery. The patients ", "x": 56.7, "y": 414.7, "w": 229.5, "h": 12.0}, {"t": "received a non-steroid anti-inflammatory drug ", "x": 56.7, "y": 427.8, "w": 229.3, "h": 12.0}, {"t": "(Ketorolac trometamine 30 mg) intramuscularly ", "x": 56.7, "y": 440.7, "w": 229.3, "h": 12.0}, {"t": "immediately after surgery and every 6 hours until ", "x": 56.7, "y": 453.7, "w": 229.7, "h": 12.0}, {"t": "the next day. Compression bandages and ice packs ", "x": 56.7, "y": 466.8, "w": 229.3, "h": 12.0}, {"t": "were applied to the facial area until the second ", "x": 56.7, "y": 479.7, "w": 229.3, "h": 12.0}, {"t": "day after surgery. ", "x": 56.7, "y": 492.7, "w": 85.9, "h": 12.0}, {"t": "The 56 patients were divided into 2 groups ", "x": 66.7, "y": 505.8, "w": 219.2, "h": 12.0}, {"t": "according to the randomization codes generated ", "x": 56.7, "y": 518.7, "w": 229.3, "h": 12.0}, {"t": "by Microsoft Excel: an experimental and control ", "x": 56.7, "y": 531.7, "w": 229.2, "h": 12.0}, {"t": "group. The patients in the experimental group ", "x": 56.7, "y": 544.8, "w": 229.2, "h": 12.0}, {"t": "received only 1.0 g of a third-generation cephalo-", "x": 56.7, "y": 557.7, "w": 226.8, "h": 12.0}, {"t": "sporin (Cefpiramide) intravenously 30 minutes ", "x": 56.7, "y": 570.7, "w": 229.2, "h": 12.0}, {"t": "before surgery and did not receive the placebo. ", "x": 56.7, "y": 583.8, "w": 229.3, "h": 12.0}, {"t": "The control group also received 1.0 g of Cefpira-", "x": 56.7, "y": 596.7, "w": 226.8, "h": 12.0}, {"t": "mide 30 minutes before surgery as well as twice ", "x": 56.7, "y": 609.7, "w": 229.2, "h": 12.0}, {"t": "daily until 3 days after surgery. The patients were ", "x": 56.7, "y": 622.8, "w": 229.3, "h": 12.0}, {"t": "evaluated every day during the first 3 days and ", "x": 56.7, "y": 635.7, "w": 229.3, "h": 12.0}, {"t": "at the end of the 1st and 2nd week after surgery ", "x": 56.7, "y": 648.7, "w": 229.3, "h": 12.0}, {"t": "for any postoperative infections in reference to the ", "x": 56.7, "y": 661.8, "w": 229.4, "h": 12.0}, {"t": "criteria for defining a surgical site infection (SSI), ", "x": 56.7, "y": 674.7, "w": 229.3, "h": 12.0}, {"t": "recommended by the Centers for Disease Control ", "x": 56.7, "y": 687.7, "w": 229.3, "h": 12.0}, {"t": "and Prevention (CDC).12 Postoperative wound ", "x": 56.7, "y": 699.1, "w": 229.3, "h": 13.7}, {"t": "infection was defined by at least 1 of the following ", "x": 56.7, "y": 713.7, "w": 229.6, "h": 12.0}, {"t": "criteria:", "x": 56.7, "y": 726.7, "w": 33.8, "h": 12.0}, {"t": "1. Purulent drainage from the surgical site with ", "x": 321.8, "y": 102.7, "w": 219.6, "h": 12.0}, {"t": "or without laboratory confirmation. ", "x": 334.0, "y": 115.8, "w": 167.4, "h": 12.0}, {"t": "2. At least 1 of the following signs or symptoms ", "x": 321.8, "y": 128.7, "w": 219.3, "h": 12.0}, {"t": "of infection: pain or tenderness, localized ", "x": 333.8, "y": 141.7, "w": 207.3, "h": 12.0}, {"t": "swelling, redness or heat, and a superficial ", "x": 333.8, "y": 154.8, "w": 207.2, "h": 12.0}, {"t": "incision deliberately opened by surgeon, ", "x": 333.8, "y": 167.7, "w": 207.3, "h": 12.0}, {"t": "unless the incision is culture-negative.", "x": 333.8, "y": 180.7, "w": 178.2, "h": 12.0}, {"t": "3. An abscess or other evidence of infection is ", "x": 321.8, "y": 193.8, "w": 219.3, "h": 12.0}, {"t": "found on a direct examination, during reope-", "x": 334.1, "y": 206.7, "w": 204.5, "h": 12.0}, {"t": "ration, or by the histopathological or radiolo-", "x": 334.1, "y": 219.7, "w": 204.5, "h": 12.0}, {"t": "gic examination. ", "x": 334.1, "y": 232.8, "w": 77.8, "h": 12.0}, {"t": "4. Diagnosis of SSI by the surgeon or attending ", "x": 321.8, "y": 245.7, "w": 219.5, "h": 12.0}, {"t": "physician. ", "x": 334.0, "y": 258.7, "w": 47.8, "h": 12.0}, {"t": "Statistical analysis was performed using a \ue0b22-test ", "x": 321.8, "y": 270.1, "w": 219.4, "h": 13.7}, {"t": "on the Statistical Package for the Social Sciences ", "x": 311.8, "y": 284.7, "w": 229.3, "h": 12.0}, {"t": "(SPSS for windows, ver. 12.0, SPSS Inc., Chicago, ", "x": 311.8, "y": 297.7, "w": 229.3, "h": 12.0}, {"t": "IL, USA). The study protocol was approved by the ", "x": 311.8, "y": 310.8, "w": 229.6, "h": 12.0}, {"t": "Institutional Review Board of the College of ", "x": 311.8, "y": 323.7, "w": 229.3, "h": 12.0}, {"t": "Dentistry, Yonsei University (YUDC). ", "x": 311.8, "y": 336.7, "w": 176.4, "h": 12.0}, {"t": "RESULTS ", "x": 311.8, "y": 375.7, "w": 51.6, "h": 13.3}, {"t": "The mean (SD) age of the experimental group ", "x": 321.8, "y": 401.7, "w": 219.3, "h": 12.0}, {"t": "was 23.9 years (5.84) with male-female ratio of 4 ", "x": 311.8, "y": 414.7, "w": 229.3, "h": 12.0}, {"t": ": 3. The average duration of surgery was 3 hours ", "x": 311.8, "y": 427.8, "w": 229.3, "h": 12.0}, {"t": "and 40 minutes. The mean (SD) age of the control ", "x": 311.8, "y": 440.7, "w": 229.5, "h": 12.0}, {"t": "group was 24.3 years (6.33) with male-female ratio ", "x": 311.8, "y": 453.7, "w": 229.5, "h": 12.0}, {"t": "of 1 : 1. The average duration of surgery was 3 ", "x": 311.8, "y": 466.8, "w": 229.2, "h": 12.0}, {"t": "hours and 55 minutes. ", "x": 311.8, "y": 479.7, "w": 108.0, "h": 12.0}, {"t": "There were 3 infections in the experimental group ", "x": 321.8, "y": 492.7, "w": 219.4, "h": 12.0}, {"t": "and 2 infections in the control group, observed 2 ", "x": 311.8, "y": 505.8, "w": 229.3, "h": 12.0}, {"t": "weeks after surgery (Table 1). One patient in the ", "x": 311.8, "y": 518.7, "w": 229.3, "h": 12.0}, {"t": "experimental group was diagnosed with an infec-", "x": 311.8, "y": 531.7, "w": 226.8, "h": 12.0}, {"t": "tion by facial swelling, redness and sinus haziness ", "x": 311.8, "y": 544.8, "w": 229.6, "h": 12.0}, {"t": "in the waters\u2019 view, and the other 4 patients were ", "x": 311.8, "y": 557.7, "w": 229.4, "h": 12.0}, {"t": "diagnosed with a postoperative infection by swel-", "x": 311.8, "y": 570.7, "w": 226.9, "h": 12.0}, {"t": "ling and redness, and pain on the mandibular area. ", "x": 311.8, "y": 583.8, "w": 229.5, "h": 12.0}, {"t": "Therefore, the wounds were opened by a surgeon ", "x": 311.8, "y": 596.7, "w": 229.6, "h": 12.0}, {"t": "and the patients were treated with antibiotics. ", "x": 311.8, "y": 609.7, "w": 229.3, "h": 12.0}, {"t": "However, only 1 patient in the control group ", "x": 311.8, "y": 622.8, "w": 229.3, "h": 12.0}, {"t": "developed wound dehiscence only without any ", "x": 311.8, "y": 635.7, "w": 229.2, "h": 12.0}, {"t": "drainage, fever, or swelling in the maxillary area. ", "x": 311.8, "y": 648.7, "w": 229.5, "h": 12.0}, {"t": "According to the \ue0b22-test, there was no significant ", "x": 311.8, "y": 660.1, "w": 229.3, "h": 13.7}, {"t": "difference in the prevalence of postoperative ", "x": 311.8, "y": 674.7, "w": 229.3, "h": 12.0}, {"t": "wound infections between the patients who had ", "x": 311.8, "y": 687.7, "w": 229.3, "h": 12.0}, {"t": "received postoperative prophylactic antibiotic ", "x": 311.8, "y": 700.8, "w": 229.2, "h": 12.0}, {"t": "administration and those who had not (p = 0.639).", "x": 311.8, "y": 713.7, "w": 226.8, "h": 12.0}]}, {"doc": 0, "page": 3, "img": "pages/p003.jpg", "pw": 595.2, "ph": 842.0, "lines": [{"t": "The Efficacy of Postoperative Prophylactic Antibiotics in Orthognathic Surgery", "x": 160.9, "y": 77.6, "w": 273.6, "h": 8.9}, {"t": "57", "x": 527.6, "y": 79.0, "w": 10.9, "h": 11.3}, {"t": "Yonsei Med J Vol. 50, No. 1, 2009", "x": 415.8, "y": 755.6, "w": 122.8, "h": 8.9}, {"t": "Table 1. Results according to the Postoperative Antibiotic Prophylaxis ", "x": 71.5, "y": 105.6, "w": 292.0, "h": 10.8}, {"t": "Experimental group without ", "x": 219.8, "y": 125.9, "w": 118.4, "h": 10.8}, {"t": "postoperative antibiotics (n = 28)", "x": 211.6, "y": 138.1, "w": 132.4, "h": 10.8}, {"t": "Control group with postoperative ", "x": 370.5, "y": 125.9, "w": 140.9, "h": 10.8}, {"t": "antibiotics for 3 days (n = 28)", "x": 379.0, "y": 138.1, "w": 121.7, "h": 10.8}, {"t": "Age (Mean \u00b1 SD)", "x": 71.5, "y": 155.6, "w": 69.2, "h": 10.8}, {"t": "23.9 \u00b1 5.84 yrs", "x": 249.5, "y": 155.6, "w": 56.8, "h": 10.8}, {"t": "24.3 \u00b1 6.33 yrs", "x": 411.4, "y": 155.6, "w": 56.8, "h": 10.8}, {"t": "Sex (Male : Female)", "x": 71.5, "y": 173.0, "w": 82.6, "h": 10.8}, {"t": "16 : 12", "x": 263.5, "y": 173.0, "w": 28.8, "h": 10.8}, {"t": "14 : 14", "x": 425.5, "y": 173.0, "w": 28.8, "h": 10.8}, {"t": "Postoperative infection (n)", "x": 71.5, "y": 190.5, "w": 107.7, "h": 10.8}, {"t": "3", "x": 275.6, "y": 190.5, "w": 4.5, "h": 10.8}, {"t": "2", "x": 437.6, "y": 190.5, "w": 4.5, "h": 10.8}, {"t": "Wound dehiscence (n)", "x": 71.5, "y": 208.0, "w": 91.7, "h": 10.8}, {"t": "0", "x": 275.6, "y": 208.0, "w": 4.5, "h": 10.8}, {"t": "1", "x": 437.6, "y": 208.0, "w": 4.5, "h": 10.8}, {"t": "DISCUSSION ", "x": 56.7, "y": 243.7, "w": 71.8, "h": 13.3}, {"t": "The method of antibiotic prophylaxis is deter-", "x": 66.7, "y": 269.8, "w": 216.8, "h": 12.0}, {"t": "mined by an evaluation of the patient, procedure, ", "x": 56.7, "y": 282.8, "w": 229.3, "h": 12.0}, {"t": "and surgical wound. The preoperative and imme-", "x": 56.7, "y": 295.8, "w": 227.0, "h": 12.0}, {"t": "diate postoperative administration of antibiotics is ", "x": 56.7, "y": 308.8, "w": 229.6, "h": 12.0}, {"t": "a method generally used for antibiotic prophylaxis ", "x": 56.7, "y": 321.8, "w": 229.7, "h": 12.0}, {"t": "in almost all surgical procedures. However, anti-", "x": 56.7, "y": 334.8, "w": 226.8, "h": 12.0}, {"t": "biotics are continuously used postoperatively in ", "x": 56.7, "y": 347.8, "w": 229.3, "h": 12.0}, {"t": "most procedures because it is difficult to assess ", "x": 56.7, "y": 360.8, "w": 229.2, "h": 12.0}, {"t": "the factors associated with postoperative wound ", "x": 56.7, "y": 373.8, "w": 229.3, "h": 12.0}, {"t": "infections or appropriate antibiotic prophylaxis ", "x": 56.7, "y": 386.8, "w": 229.3, "h": 12.0}, {"t": "method. ", "x": 56.7, "y": 399.8, "w": 39.3, "h": 12.0}, {"t": "On the other hand, orthognathic surgery is ", "x": 66.7, "y": 412.8, "w": 219.3, "h": 12.0}, {"t": "mainly performed on young patients without an ", "x": 56.7, "y": 425.8, "w": 229.3, "h": 12.0}, {"t": "underlying illness or comorbidity. Moreover, the ", "x": 56.7, "y": 438.8, "w": 229.3, "h": 12.0}, {"t": "number of factors affecting the development of ", "x": 56.7, "y": 451.8, "w": 229.3, "h": 12.0}, {"t": "postoperative wound infections decreases with ", "x": 56.7, "y": 464.8, "w": 229.3, "h": 12.0}, {"t": "the improvement of the surgical instruments, ", "x": 56.7, "y": 477.8, "w": 229.3, "h": 12.0}, {"t": "materials, techniques, and more generalized pro-", "x": 56.7, "y": 490.8, "w": 226.8, "h": 12.0}, {"t": "cedure.", "x": 56.7, "y": 503.8, "w": 32.6, "h": 12.0}, {"t": "Peterson13 suggested that the prophylactic anti-", "x": 66.7, "y": 515.1, "w": 216.8, "h": 13.7}, {"t": "biotic administration for postoperative wound ", "x": 56.7, "y": 529.8, "w": 229.3, "h": 12.0}, {"t": "infections in oral and maxillofacial surgery should ", "x": 56.7, "y": 542.8, "w": 229.4, "h": 12.0}, {"t": "be performed if there is a strong probability of ", "x": 56.7, "y": 555.8, "w": 229.3, "h": 12.0}, {"t": "infection, and appropriate antibiotics must be ", "x": 56.7, "y": 568.8, "w": 229.3, "h": 12.0}, {"t": "given in high-dose but for only a short period of ", "x": 56.7, "y": 581.8, "w": 229.3, "h": 12.0}, {"t": "time. Orthognathic surgeries are classified as clean ", "x": 56.7, "y": 594.8, "w": 229.4, "h": 12.0}, {"t": "contaminated ", "x": 56.7, "y": 607.8, "w": 63.3, "h": 12.0}, {"t": "procedures ", "x": 129.1, "y": 607.8, "w": 52.3, "h": 12.0}, {"t": "with ", "x": 190.6, "y": 607.8, "w": 22.8, "h": 12.0}, {"t": "postoperative ", "x": 222.6, "y": 607.8, "w": 63.3, "h": 12.0}, {"t": "wound infection of 10% to 15%, and Peterson13 ", "x": 56.7, "y": 619.2, "w": 228.3, "h": 13.7}, {"t": "reported that an incidence of an anticipated in-", "x": 56.7, "y": 633.8, "w": 226.8, "h": 12.0}, {"t": "fection in oral clean contaminated surgery could ", "x": 56.7, "y": 646.8, "w": 229.3, "h": 12.0}, {"t": "be reduced by using prophylactic antibiotics. ", "x": 56.7, "y": 659.8, "w": 229.3, "h": 12.0}, {"t": "Zijderveld et al.14 suggested that the incidence of ", "x": 56.7, "y": 671.1, "w": 229.3, "h": 13.7}, {"t": "postoperative infections (52.6%) increased without ", "x": 56.7, "y": 685.8, "w": 229.3, "h": 12.0}, {"t": "the administration of prophylactic antibiotics. ", "x": 56.7, "y": 698.8, "w": 229.3, "h": 12.0}, {"t": "Martis and Karabouta9 suggested that the routine ", "x": 56.7, "y": 710.1, "w": 229.5, "h": 13.7}, {"t": "use of prophylactic antibiotics in orthognathic ", "x": 56.7, "y": 724.8, "w": 229.2, "h": 12.0}, {"t": "surgery is unnecessary, and Lindeboom et al.15 ", "x": 311.8, "y": 242.1, "w": 229.3, "h": 13.7}, {"t": "also suggested that the use of postoperative pro-", "x": 311.8, "y": 256.8, "w": 226.8, "h": 12.0}, {"t": "phylactic antibiotics (clindamycin) is unnecessary ", "x": 311.8, "y": 269.8, "w": 229.3, "h": 12.0}, {"t": "in orthognathic surgery (SSRO). Furthermore, ", "x": 311.8, "y": 282.8, "w": 229.2, "h": 12.0}, {"t": "Fridrich et al.16 and Baqain et al.17 suggested that ", "x": 311.8, "y": 294.2, "w": 229.3, "h": 13.7}, {"t": "the long-term use of antibiotics does not decrease ", "x": 311.8, "y": 308.8, "w": 229.6, "h": 12.0}, {"t": "the frequency of postoperative infections. However, ", "x": 311.8, "y": 321.8, "w": 229.7, "h": 12.0}, {"t": "wide range of patient's age, small group size, and ", "x": 311.8, "y": 334.8, "w": 229.3, "h": 12.0}, {"t": "various osteomies may cause difficulties when ", "x": 311.8, "y": 347.8, "w": 229.2, "h": 12.0}, {"t": "precisely evaluating the efficacy of prophylactic ", "x": 311.8, "y": 360.8, "w": 229.2, "h": 12.0}, {"t": "antibiotics. ", "x": 311.8, "y": 373.8, "w": 50.8, "h": 12.0}, {"t": "Therefore, this study was undertaken to ex-", "x": 321.8, "y": 386.8, "w": 216.7, "h": 12.0}, {"t": "amine the prevalence of postoperative wound ", "x": 311.8, "y": 399.8, "w": 229.3, "h": 12.0}, {"t": "infections in young patients after orthognathic ", "x": 311.8, "y": 412.8, "w": 229.3, "h": 12.0}, {"t": "surgery (Le Fort I osteotomy and bilateral in-", "x": 311.8, "y": 425.8, "w": 226.8, "h": 12.0}, {"t": "traoral vertical ramus osteotomy) with or without ", "x": 311.8, "y": 438.8, "w": 229.6, "h": 12.0}, {"t": "the use of postoperative prophylactic antibiotics. ", "x": 311.8, "y": 451.8, "w": 229.3, "h": 12.0}, {"t": "Twenty eight patients were enrolled in each ", "x": 311.8, "y": 464.8, "w": 229.2, "h": 12.0}, {"t": "group. The samples were selected at a significance ", "x": 311.8, "y": 477.8, "w": 229.7, "h": 12.0}, {"t": "level of \u03b1 = 0.05 and a test power \u03b2= 0.20. A smaller ", "x": 311.8, "y": 490.8, "w": 229.6, "h": 12.0}, {"t": "infection rate was set to 5%, and the difference in ", "x": 311.8, "y": 503.8, "w": 229.7, "h": 12.0}, {"t": "the estimated infection rate was set to 30%, based ", "x": 311.8, "y": 516.8, "w": 229.3, "h": 12.0}, {"t": "on previous report that the incidence of post-", "x": 311.8, "y": 529.8, "w": 226.7, "h": 12.0}, {"t": "operative wound infection using prophylactic ", "x": 311.8, "y": 542.8, "w": 229.3, "h": 12.0}, {"t": "antibiotics, ranges from 5.6% to 33.4%.17 In this ", "x": 311.8, "y": 554.1, "w": 229.3, "h": 13.7}, {"t": "study, wound infections were observed in both ", "x": 311.8, "y": 568.8, "w": 229.2, "h": 12.0}, {"t": "groups, however, the number was small. This was ", "x": 311.8, "y": 581.8, "w": 229.6, "h": 12.0}, {"t": "attributed to the followings: the patients were ", "x": 311.8, "y": 594.8, "w": 229.2, "h": 12.0}, {"t": "young without a specific medical history, patients ", "x": 311.8, "y": 607.8, "w": 229.7, "h": 12.0}, {"t": "had no preoperative wound infections, no bone ", "x": 311.8, "y": 620.8, "w": 229.3, "h": 12.0}, {"t": "graft had been performed during surgery, the ", "x": 311.8, "y": 633.8, "w": 229.3, "h": 12.0}, {"t": "surgical procedures such as IVRO were less ", "x": 311.8, "y": 646.8, "w": 229.3, "h": 12.0}, {"t": "traumatic with a short duration, the tissue trauma ", "x": 311.8, "y": 659.8, "w": 229.4, "h": 12.0}, {"t": "during surgery was minimal due to the systema-", "x": 311.8, "y": 672.8, "w": 226.8, "h": 12.0}, {"t": "tization of orthognathic surgery and the improve-", "x": 311.8, "y": 685.8, "w": 226.8, "h": 12.0}, {"t": "ment of techniques, and wound control such as ", "x": 311.8, "y": 698.8, "w": 229.3, "h": 12.0}, {"t": "postoperative blood or exudate was properly ", "x": 311.8, "y": 711.8, "w": 229.3, "h": 12.0}, {"t": "performed. ", "x": 311.8, "y": 724.8, "w": 52.3, "h": 12.0}]}, {"doc": 0, "page": 4, "img": "pages/p004.jpg", "pw": 595.2, "ph": 842.0, "lines": [{"t": "Sang-Hoon Kang, et al.", "x": 256.4, "y": 77.6, "w": 82.4, "h": 8.9}, {"t": "58", "x": 56.7, "y": 79.0, "w": 11.0, "h": 11.3}, {"t": "Yonsei Med J Vol. 50, No. 1, 2009", "x": 56.7, "y": 755.6, "w": 122.8, "h": 8.9}, {"t": "The types of antibiotics used are important ", "x": 66.7, "y": 102.7, "w": 219.2, "h": 12.0}, {"t": "factors to consider for prophylactic antibiotic treat-", "x": 56.7, "y": 115.8, "w": 226.8, "h": 12.0}, {"t": "ment. Penicillin is the representative antibiotic ", "x": 56.7, "y": 128.7, "w": 229.2, "h": 12.0}, {"t": "used as a prophylaxis during intraoral surgery and ", "x": 56.7, "y": 141.7, "w": 229.4, "h": 12.0}, {"t": "for the primary treatment of dental infections. ", "x": 56.7, "y": 154.8, "w": 229.3, "h": 12.0}, {"t": "Spaey et al18 suggested the use of amoxicillin- ", "x": 56.7, "y": 166.1, "w": 229.3, "h": 13.7}, {"t": "clavulanate along with drain usage during SSRO ", "x": 56.7, "y": 180.7, "w": 229.3, "h": 12.0}, {"t": "in a study of antibiotic administration. In this study, ", "x": 56.7, "y": 193.8, "w": 229.5, "h": 12.0}, {"t": "third-generation cephalosporin antibiotics were ", "x": 56.7, "y": 206.7, "w": 229.2, "h": 12.0}, {"t": "administered before surgery, which is believed to ", "x": 56.7, "y": 219.7, "w": 229.4, "h": 12.0}, {"t": "be a possible prophylactic antibiotic that may be ", "x": 56.7, "y": 232.8, "w": 229.2, "h": 12.0}, {"t": "used in orthognathic surgery because most bacteria ", "x": 56.7, "y": 245.7, "w": 229.4, "h": 12.0}, {"t": "cultured during a dental infection are susceptible ", "x": 56.7, "y": 258.7, "w": 229.2, "h": 12.0}, {"t": "to third-generation cephalosporin.19 There has ", "x": 56.7, "y": 270.1, "w": 229.3, "h": 13.7}, {"t": "been an increase in infections due to anaerobic ", "x": 56.7, "y": 284.7, "w": 229.2, "h": 12.0}, {"t": "and Gram-negative organisms,20 and most wound ", "x": 56.7, "y": 296.1, "w": 229.3, "h": 13.7}, {"t": "infections after orthognathic surgery are caused by ", "x": 56.7, "y": 310.8, "w": 229.3, "h": 12.0}, {"t": "Gram negative bacteria.21", "x": 56.7, "y": 322.1, "w": 116.2, "h": 13.7}, {"t": "If a post-operative wound infection occurs ", "x": 66.7, "y": 336.7, "w": 219.2, "h": 12.0}, {"t": "despite the effective prophylactic antibiotic admi-", "x": 56.7, "y": 349.8, "w": 226.8, "h": 12.0}, {"t": "nistration before surgery, it could be concluded ", "x": 56.7, "y": 362.7, "w": 229.2, "h": 12.0}, {"t": "that the bacteria in the infected wound are not ", "x": 56.7, "y": 375.7, "w": 229.3, "h": 12.0}, {"t": "sensitive to the prophylactic antibiotics admini-", "x": 56.7, "y": 388.8, "w": 226.8, "h": 12.0}, {"t": "stered, and in such cases, an appropriate anti- ", "x": 56.7, "y": 401.7, "w": 229.3, "h": 12.0}, {"t": "microbial therapy should be determined by a ", "x": 56.7, "y": 414.7, "w": 229.3, "h": 12.0}, {"t": "culture test of the bacteria found in the infected ", "x": 56.7, "y": 427.8, "w": 229.3, "h": 12.0}, {"t": "region.21,22", "x": 56.7, "y": 439.1, "w": 45.4, "h": 13.7}, {"t": "Prophylactic antibiotics reduce the risk of post-", "x": 66.7, "y": 453.7, "w": 216.8, "h": 12.0}, {"t": "operative wound infections, which leads to a lower ", "x": 56.7, "y": 466.8, "w": 229.6, "h": 12.0}, {"t": "number of hospitalization days, reduced cost, and ", "x": 56.7, "y": 479.7, "w": 229.6, "h": 12.0}, {"t": "improved social life. However, the long-term use ", "x": 56.7, "y": 492.7, "w": 229.3, "h": 12.0}, {"t": "of postoperative prophylactic antibiotics may lead ", "x": 56.7, "y": 505.8, "w": 229.5, "h": 12.0}, {"t": "to several problems, such as various allergic reac-", "x": 56.7, "y": 518.7, "w": 226.9, "h": 12.0}, {"t": "tions, increased cost, changes in resident bacterial ", "x": 56.7, "y": 531.7, "w": 229.4, "h": 12.0}, {"t": "colony in vivo, or appearance of resistant bacteria.7,23 ", "x": 56.7, "y": 543.1, "w": 228.5, "h": 13.7}, {"t": "More studies with much larger numbers of ", "x": 66.7, "y": 557.7, "w": 219.3, "h": 12.0}, {"t": "patients are needed on the administration of pro-", "x": 56.7, "y": 570.7, "w": 227.0, "h": 12.0}, {"t": "phylactic antibiotics during orthognathic surgery ", "x": 56.7, "y": 583.8, "w": 229.2, "h": 12.0}, {"t": "and other oral and maxillofacial procedures. In ", "x": 56.7, "y": 596.7, "w": 229.3, "h": 12.0}, {"t": "addition, further research on properly appropriated ", "x": 56.7, "y": 609.7, "w": 229.6, "h": 12.0}, {"t": "use of antibiotic prophylaxis is warranted in order ", "x": 56.7, "y": 622.8, "w": 229.3, "h": 12.0}, {"t": "to minimize the use of prophylactic antibiotics and ", "x": 56.7, "y": 635.7, "w": 229.4, "h": 12.0}, {"t": "their adverse effects and problems. In the present ", "x": 56.7, "y": 648.7, "w": 229.6, "h": 12.0}, {"t": "study, there was no significant difference in the ", "x": 56.7, "y": 661.8, "w": 229.2, "h": 12.0}, {"t": "prevalence of postoperative wound infections ", "x": 56.7, "y": 674.7, "w": 229.3, "h": 12.0}, {"t": "between patients who had received postoperative ", "x": 56.7, "y": 687.7, "w": 229.4, "h": 12.0}, {"t": "prophylactic antibiotic administration and those ", "x": 56.7, "y": 700.8, "w": 229.3, "h": 12.0}, {"t": "who did not. Therefore, prolonged prophylactic ", "x": 56.7, "y": 713.7, "w": 229.3, "h": 12.0}, {"t": "antibiotic use after orthognathic surgery may not ", "x": 56.7, "y": 726.7, "w": 229.3, "h": 12.0}, {"t": "be necessary, provided that there are no other ", "x": 311.8, "y": 102.7, "w": 229.3, "h": 12.0}, {"t": "significant factors for wound infections. ", "x": 311.8, "y": 115.8, "w": 187.9, "h": 12.0}, {"t": "REFERENCES", "x": 311.8, "y": 152.6, "w": 73.4, "h": 13.3}, {"t": "1. Kaiser AB. Surgical-wound infection. N Engl J Med ", "x": 315.8, "y": 178.9, "w": 224.9, "h": 10.2}, {"t": "1991;324:123-4.", "x": 326.3, "y": 189.8, "w": 55.8, "h": 10.2}, {"t": "2. Burke JF. The effective period of preventive antibiotic ", "x": 315.8, "y": 200.8, "w": 224.9, "h": 10.2}, {"t": "action in experimental incisions and dermal lesions. ", "x": 326.3, "y": 211.9, "w": 214.3, "h": 10.2}, {"t": "Surgery 1961;50:161-8.", "x": 326.3, "y": 222.8, "w": 85.5, "h": 10.2}, {"t": "3. Guglielmo BJ, Hohn DC, Koo PJ, Hunt TK, Sweet RL, ", "x": 315.8, "y": 233.8, "w": 224.9, "h": 10.2}, {"t": "Conte JE Jr. Antibiotic prophylaxis in surgical pro-", "x": 326.3, "y": 244.9, "w": 212.3, "h": 10.2}, {" s not adequate for definitive detection of any of those.\nAn inconsistency has many ordinary causes, and the innocent ones are far more\ncommon than the guilty ones: typographical error, rounding or transcription\nslips, a mislabelled sample size, values copied from a superseded analysis, or\n-- most often -- a mistake by this tool in reading the number off the page.\n\n**The base rates that matter here.** In our own ground-truth corpus, half of the\nclean control papers contain at least one statcheck inconsistency. Reporting\nerrors are near-universal in honest work. Separately, nearly all of this\npipeline's failure lives in getting numbers off a PDF, not in the arithmetic:\nthe arithmetic is exact and the extraction is not. Any individual flag in this\nreport is therefore much more likely to be our extraction error than the\nauthors' misconduct.\n\n**Anything marked `indeterminate` is a refusal, not a negative result.** It means\na precondition could not be verified and the tool declined to judge. It is not\nevidence of a problem, and it is not evidence of the absence of one.\n\n**What it has been tested on.** at least 37 runs over 19 papers, almost all of them\nprimary biomedical or psychology research and most of them human randomised\ntrials. No qualitative, bench-science, -omics, or non-biomedical paper has ever\nbeen through it, and no claim here about its accuracy transfers to one. It is\n**not designed for narrative reviews** -- their numbers belong to the papers\nthey cite, so a flag would land on the wrong authors -- and auditing a\n**meta-analysis or systematic review** is a separate undertaking with different\ntools, which this is not. The full breakdown is in \"What this has been tested\non\", below.\n", "action_note": "**Before treating anything here as a problem:** verify the number by hand against\nthe published paper, since the most likely explanation is that this tool misread\nit. If it holds up, the appropriate next step is to contact the corresponding\nauthor and ask -- most discrepancies are resolved by a correction or an\nexplanation. Requesting the raw data is the only thing that can actually settle\nthe question. Public allegations are not an appropriate use of this output.\n", "facts": {"severity": {"write_up": {"counts": {"consistent": 7, "suspicious": 7, "indeterminate": 5}, "total": 19, "population": "sweep findings the review recorded", "label": "the write-up recorded"}, "tool": {"counts": {"suspicious": 7, "consistent": 7, "indeterminate": 5}, "total": 19, "population": "checks that returned a verdict, passes included", "label": "the checks returned"}, "write_up_from_check_table": {"counts": {"consistent": 7, "indeterminate": 5, "suspicious": 7}, "total": 19}, "consistent_dropped": 7, "agree": true}, "traceability": {"population": "sweep findings", "n": 19, "quotes_located": {"with_quote": 19, "located_in_paper": 14, "verdicts": {"stitched": 4, "verbatim": 14, "unverified": 1}, "of": 19, "question": "does the finding quote a passage, and is that passage in the paper?"}, "joined_to_call": {"n": 11, "of": 19, "hand_read_excluded": 0, "question": "of the findings a validated check produced, can the quote be tied to the specific call that consumed the number?", "caveat": "Narrower than it sounds, and its denominator excludes hand-read findings, for which no producing call exists by construction. A finding without this join still quotes the paper -- the passage shown is the review's rather than the call's."}, "anchored": {"n": 16, "of": 19, "question": "does the finding resolve to a place we can jump to?"}}, "traceability_sentence": "19 of 19 findings quote a passage of the paper (14 verbatim; 4 assembled from adjacent text and NOT appearing as one sentence in the paper; 1 we could not find). Of the 19 produced by a validated check, 8 could not be tied to the specific call that consumed the number, so the passage shown is the review's rather than the call's.", "evidence": {"population": "report findi here|not (printed|reported) (numerically|in the (main )?text)|only as bars|no numeric|\\b(?:states|gives|provides|publishes) no\\b|\\bdeclines to report\\b|\\bnever (?:states|reports|prints|gives)\\b|\\b(?:are|is|was|were) not reported\\b|not reported anywhere|\\breports? none\\b|\\bnone (?:are|is) reported\\b|\\bexists? only (?:as|in)\\b|\\bbare point estimates\\b|\\bno (?:sample size|baseline table|power calculation|effect sizes?)\\b"}, {"key": "na", "label": "does not apply here", "re": "not applicable|deliberately|would be meaningless|would manufacture|carries none of the meaning|no \\(mean, sd\\) pairs|there are no |correctly not run|not run because|not run,? deliberately|has no meaning here|family of one|bars? (the|this) (check|family|test)|does not apply|no (valid )?(null|comparison) (exists|to test)"}], "refusals": {"n": 14, "counts": {"ours": 1, "paper": 3, "unclassified": 7, "na": 2, "inputs": 1}, "unclassified_share": 0.5, "classifier_failing": true, "order": ["na", "paper", "inputs", "ours", "unclassified"], "meaning": {"na": ["does not apply to this paper's design", "Not a shortfall. The check has no meaning here, and declining to run it is the correct answer."], "paper": ["the paper does not report what the check needs", "A property of the publication. Where the paper CLAIMS to have used something it never prints, that is also a question worth putting to the authors."], "inputs": ["the material was not supplied to this review", "About our inputs, not about the paper and not about our checks."], "ours": ["this toolkit could not do it", "The only bucket that is our shortfall."], "unclassified": ["not classified", "The reason did not match any rule. Read it below rather than trusting a count."]}, "not_our_shortfall": 6, "our_shortfall": 1, "reading": "14 checks did not run. 1 of them because this toolkit could not do it; the other 13 either do not apply to this paper, need a number the paper does not print, or needed material nobody supplied to us.", "warning": "The classifier could not place 7 of 14 reasons. Read them rather than the counts."}}, "pdf_docs": [{"id": 0, "name": "10.3349--ymj.2009.50.1.55.pdf", "label": "paper: 10.3349--ymj.2009.50.1.55.pdf", "pages": 5, "total_pages": 5, "truncated": false}], "source_docs": [{"id": 0, "name": "10.3349--ymj.2009.50.1.55.pdf", "label": "paper: 10.3349--ymj.2009.50.1.55.pdf", "pages": 5, "total_pages": 5, "truncated": false, "kind": "pdf", "locate": "lines", "role": "paper"}, {"id": 1, "name": "10.3349--ymj.2009.50.1.55.xml", "role": "second_view", "kind": "xml", "label": "second_view: 10.3349--ymj.2009.50.1.55.xml", "locate": "dom", "n_tables": 1, "text": "## The Efficacy of Postoperative Prophylactic Antibiotics in Orthognathic Surgery: A Prospective Study in Le Fort I Osteotomy and Bilateral Intraoral Vertical Ramus Osteotomy\n\n## INTRODUCTION\nAntibiotics are used to treat and prevent postoperative infections. In 1960, it was reported that pathogens are present during surgery[1],[2] regardless of how aseptic the surgery might appear. Moreover, the correlation between prophylactic antibiotics and postoperative wound infections was demonstrated. Therefore, prophylactic antibiotics are now used in almost all surgical procedures. The most effective method of antibiotic prophylaxis is the preoperative administration of antibiotics because it can act at the time when the wound is potentially contaminated by bacteria.[2]\u207b[4] On the other hand, it was also reported that the use of antibiotics after 3 - 4 hours of a bacterial invasion is unsuitable.[5]\n\nProphylactic antibiotics are generally administered both preoperatively and postoperatively. Hence, the effects of the indiscriminate method and period of administration are unclear, considering the multiple factors that contribute to postoperative wound infections.[6]\u207b[8]\n\nThe use of antibiotic prophylaxis is controversial even in orthognathic surgery, which is a representative procedure for oral and maxillofa

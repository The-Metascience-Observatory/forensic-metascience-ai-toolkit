: 113.7, "h": 10.2}, {"t": "Yonsei Med J Vol. 50, No. 1, 2009", "x": 415.8, "y": 755.6, "w": 122.8, "h": 8.9}, {"t": "The Efficacy of Postoperative Prophylactic Antibiotics in ", "x": 54.6, "y": 145.6, "w": 457.6, "h": 19.9}, {"t": "Orthognathic Surgery: A Prospective Study in Le Fort I ", "x": 54.6, "y": 165.6, "w": 454.4, "h": 19.9}, {"t": "Osteotomy and Bilateral Intraoral Vertical Ramus Osteotomy ", "x": 54.6, "y": 185.6, "w": 482.8, "h": 19.9}, {"t": "Sang-Hoon Kang,1,2 Jae-Ha Yoo,1,3 and Choong-Kook Yi1", "x": 54.6, "y": 218.3, "w": 247.2, "h": 12.8}, {"t": "Department of Oral and Maxillofacial Surgery, 1College of Dentistry, Yonsei University, Seoul; 2National Health Insurance ", "x": 54.6, "y": 243.5, "w": 484.0, "h": 11.6}, {"t": "Corporation Ilsan Hospital, Gyeonggi; 3Wonju Christian Hospital, Kangwon, Korea.", "x": 54.6, "y": 255.5, "w": 325.2, "h": 11.6}, {"t": "Received March 7, 2008", "x": 67.3, "y": 663.2, "w": 88.7, "h": 9.7}, {"t": "Accepted April 14, 2008", "x": 67.3, "y": 673.2, "w": 89.8, "h": 9.7}, {"t": "Reprint address: requests to Dr. Choong-Kook Yi, Department ", "x": 67.3, "y": 686.1, "w": 214.1, "h": 9.7}, {"t": "of Oral and Maxillofacial Surgery, College of Dentistry, Yonsei ", "x": 57.4, "y": 696.1, "w": 224.1, "h": 9.7}, {"t": "University, 250 Seongsanno, Seodaemun-gu, Seoul 120-752, Korea. ", "x": 57.4, "y": 706.1, "w": 224.3, "h": 9.7}, {"t": "Tel: 82-2-2228-3138, Fax: 82-2-364-0992, E-mail: choongomfs@ ", "x": 57.4, "y": 716.1, "w": 224.0, "h": 9.7}, {"t": "yuhs.ac", "x": 57.4, "y": 726.1, "w": 24.4, "h": 9.7}, {"t": "Purpose: This study examined the efficacy of the postopera-", "x": 66.7, "y": 291.4, "w": 217.1, "h": 10.0}, {"t": "tive prophylactic antibiotics used in orthognathic surgery. The ", "x": 56.7, "y": 302.8, "w": 229.1, "h": 10.0}, {"t": "prevalence of surgical site infections (SSIs) was determined ", "x": 56.7, "y": 314.2, "w": 229.0, "h": 10.0}, {"t": "according to the use of postoperative prophylactic antibiotics. ", "x": 56.7, "y": 325.6, "w": 229.2, "h": 10.0}, {"t": "Patients and Methods: Fifty-six patients were divided into 2 ", "x": 56.7, "y": 337.0, "w": 229.0, "h": 10.0}, {"t": "groups. Each patient intravenously received 1.0 g of a third- ", "x": 56.7, "y": 348.4, "w": 229.1, "h": 10.0}, {"t": "generation cephalosporin (Cefpiramide) 30 minutes before ", "x": 56.7, "y": 359.8, "w": 229.0, "h": 10.0}, {"t": "surgery. Among them, 28 patients in the control group received ", "x": 56.7, "y": 371.2, "w": 229.5, "h": 10.0}, {"t": "1.0 g Cefpiramide twice daily until the third day after surgery. ", "x": 56.7, "y": 382.6, "w": 229.5, "h": 10.0}, {"t": "The postoperative wounds were examined regularly for the ", "x": 56.7, "y": 394.0, "w": 229.0, "h": 10.0}, {"t": "presence of infectious signs. Results: There was no significant ", "x": 56.7, "y": 405.4, "w": 229.1, "h": 10.0}, {"t": "difference in the incidence of postoperative wound infections ", "x": 56.7, "y": 416.8, "w": 229.0, "h": 10.0}, {"t": "between patients who had received postoperative prophylactic ", "x": 56.7, "y": 428.2, "w": 229.4, "h": 10.0}, {"t": "antibiotic administration and those who had not (p = 0.639). ", "x": 56.7, "y": 439.6, "w": 229.0, "h": 10.0}, {"t": "Conclusion: Prolonged prophylactic antibiotic use after ortho-", "x": 56.7, "y": 451.0, "w": 226.7, "h": 10.0}, {"t": "gnathic surgery may not be necessary, provided that there are ", "x": 56.7, "y": 462.4, "w": 229.3, "h": 10.0}, {"t": "no other significant factors for wound infections. ", "x": 56.7, "y": 473.8, "w": 188.1, "h": 10.0}, {"t": "Key Words: Orthognathic surgery, prophylactic antibiotics, ", "x": 56.7, "y": 490.9, "w": 229.0, "h": 10.0}, {"t": "surgical site infection", "x": 56.7, "y": 501.9, "w": 80.5, "h": 10.0}, {"t": "INTRODUCTION", "x": 56.7, "y": 538.4, "w": 91.1, "h": 13.3}, {"t": "Antibiotics are used to treat and prevent post-", "x": 66.7, "y": 564.5, "w": 216.8, "h": 12.0}, {"t": "operative infections. In 1960, it was reported that ", "x": 56.7, "y": 577.5, "w": 229.3, "h": 12.0}, {"t": "pathogens are present during surgery1,2 regardless ", "x": 56.7, "y": 588.8, "w": 229.7, "h": 13.7}, {"t": "of how aseptic the surgery might appear. Moreover, ", "x": 56.7, "y": 603.5, "w": 229.5, "h": 12.0}, {"t": "the correlation between prophylactic antibiotics ", "x": 56.7, "y": 616.5, "w": 229.3, "h": 12.0}, {"t": "and postoperative wound infections was demon-", "x": 56.7, "y": 629.5, "w": 226.8, "h": 12.0}, {"t": "strated. Therefore, prophylactic antibiotics are ", "x": 311.8, "y": 291.0, "w": 229.3, "h": 12.0}, {"t": "now used in almost all surgical procedures. The ", "x": 311.8, "y": 304.0, "w": 229.3, "h": 12.0}, {"t": "most effective method of antibiotic prophylaxis is ", "x": 311.8, "y": 317.0, "w": 229.7, "h": 12.0}, {"t": "the preoperative administration of antibiotics ", "x": 311.8, "y": 330.0, "w": 229.3, "h": 12.0}, {"t": "because it can act at the time when the wound is ", "x": 311.8, "y": 343.0, "w": 229.6, "h": 12.0}, {"t": "potentially contaminated by bacteria.2-4 On the ", "x": 311.8, "y": 354.3, "w": 229.2, "h": 13.7}, {"t": "other hand, it was also reported that the use of ", "x": 311.8, "y": 369.0, "w": 229.3, "h": 12.0}, {"t": "antibiotics after 3 - 4 hours of a bacterial invasion ", "x": 311.8, "y": 382.0, "w": 229.3, "h": 12.0}, {"t": "is unsuitable.5", "x": 311.8, "y": 393.3, "w": 64.3, "h": 13.7}, {"t": "Prophylactic antibiotics are generally admini-", "x": 321.8, "y": 408.0, "w": 216.8, "h": 12.0}, {"t": "stered both preoperatively and postoperatively. ", "x": 311.8, "y": 421.0, "w": 229.3, "h": 12.0}, {"t": "Hence, the effects of the indiscriminate method ", "x": 311.8, "y": 434.0, "w": 229.3, "h": 12.0}, {"t": "and period of administration are unclear, consi-", "x": 311.8, "y": 447.0, "w": 226.8, "h": 12.0}, {"t": "dering the multiple factors that contribute to ", "x": 311.8, "y": 460.0, "w": 229.3, "h": 12.0}, {"t": "postoperative wound infections.6-8", "x": 311.8, "y": 471.3, "w": 156.3, "h": 13.7}, {"t": "The use of antibiotic prophylaxis is controver-", "x": 321.8, "y": 486.0, "w": 216.8, "h": 12.0}, {"t": "sial even in orthognathic surgery, which is a ", "x": 311.8, "y": 499.0, "w": 229.2, "h": 12.0}, {"t": "representative procedure for oral and maxillo-", "x": 311.8, "y": 512.0, "w": 226.8, "h": 12.0}, {"t": "facial surgery. There are reports show no increase ", "x": 311.8, "y": 525.0, "w": 229.4, "h": 12.0}, {"t": "in the incidence of infection without the admini-", "x": 311.8, "y": 538.0, "w": 226.8, "h": 12.0}, {"t": "stration of postoperative prophylactic antibiotics. ", "x": 311.8, "y": 551.0, "w": 229.3, "h": 12.0}, {"t": "9,10 On the other hand, there are reports to suggest ", "x": 311.8, "y": 562.4, "w": 229.5, "h": 13.7}, {"t": "the necessity of continuous antibiotic administra-", "x": 311.8, "y": 577.0, "w": 226.8, "h": 12.0}, {"t": "tion.11 However, orthognathic surgery is mainly ", "x": 311.8, "y": 588.3, "w": 229.2, "h": 13.7}, {"t": "performed on young patients without a specific ", "x": 311.8, "y": 603.0, "w": 229.2, "h": 12.0}, {"t": "medical history. Moreover, the number of factors ", "x": 311.8, "y": 616.0, "w": 229.3, "h": 12.0}, {"t": "associated with the development of postoperative ", "x": 311.8, "y": 629.0, "w": 229.7, "h": 12.0}, {"t": "wound infections decreases as the procedure ", "x": 311.8, "y": 642.0, "w": 229.3, "h": 12.0}, {"t": "becomes more generalized and its technique ", "x": 311.8, "y": 655.0, "w": 229.2, "h": 12.0}, {"t": "advances.", "x": 311.8, "y": 668.0, "w": 43.6, "h": 12.0}, {"t": "The aims of this clinical study were to evaluate ", "x": 321.8, "y": 681.0, "w": 219.5, "h": 12.0}, {"t": "the prevalence of postoperative wound infections ", "x": 311.8, "y": 694.0, "w": 229.3, "h": 12.0}, {"t": "with or without antibiotic prophylaxis after ortho-", "x": 311.8, "y": 707.0, "w": 226.9, "h": 12.0}, {"t": "gnathic surgery in young patients without any ", "x": 311.8, "y": 720.0, "w": 229.2, "h": 12.0}]}, {"doc": 0, "page": 2, "img": "pages/p002.jpg", "pw": 595.2, "ph": 842.0, "lines": [{"t": "Sang-Hoon Kang, et al.", "x": 256.4, "y": 77.6, "w": 82.4, "h": 8.9}, {"t": "56", "x": 56.7, "y": 79.0, "w": 11.0, "h": 11.3}, {"t": "Yonsei Med J Vol. 50, No. 1, 2009", "x": 56.7, "y": 755.6, "w": 122.8, "h": 8.9}, {"t": "specific medical history, and to identify criteria for ", "x": 56.7, "y": 102.7, "w": 229.5, "h": 12.0}, {"t": "appropriate use of prophylactic antibiotics in ", "x": 56.7, "y": 115.8, "w": 229.3, "h": 12.0}, {"t": "orthognathic surgery.", "x": 56.7, "y": 128.7, "w": 98.3, "h": 12.0}, {"t": "PATIENTS AND METHODS ", "x": 56.7, "y": 167.6, "w": 153.8, "h": 13.3}, {"t": "Fifty-six patients in their 20s without a specific ", "x": 66.7, "y": 193.8, "w": 219.3, "h": 12.0}, {"t": "medical history, and who were to undergo ortho-", "x": 56.7, "y": 206.7, "w": 226.9, "h": 12.0}, {"t": "gnathic surgical procedures at the department of ", "x": 56.7, "y": 219.7, "w": 229.3, "h": 12.0}, {"t": "oral and maxillofacial surgery at the dental hospi-", "x": 56.7, "y": 232.8, "w": 226.8, "h": 12.0}, {"t": "tal of Yonsei University were enrolled in this ", "x": 56.7, "y": 245.7, "w": 229.2, "h": 12.0}, {"t": "study. A horizontal maxillary osteotomy and ver-", "x": 56.7, "y": 258.7, "w": 226.8, "h": 12.0}, {"t": "tical ramus mandibular osteotomy were per-", "x": 56.7, "y": 271.8, "w": 226.7, "h": 12.0}, {"t": "formed by the same oral surgeon with the aid of ", "x": 56.7, "y": 284.7, "w": 229.3, "h": 12.0}, {"t": "trained nurses and residents under hypotensive ", "x": 56.7, "y": 297.7, "w": 229.2, "h": 12.0}, {"t": "general anesthesia. No bone grafts were per-", "x": 56.7, "y": 310.8, "w": 226.7, "h": 12.0}, {"t": "formed. The duration of surgery was less than 5 ", "x": 56.7, "y": 323.7, "w": 229.3, "h": 12.0}, {"t": "hours. During surgery, maxillomandibular fixation ", "x": 56.7, "y": 336.7, "w": 229.5, "h": 12.0}, {"t": "was placed using steel wires, and drainage tubes ", "x": 56.7, "y": 349.8, "w": 229.3, "h": 12.0}, {"t": "were placed on both sides of the mandible. The ", "x": 56.7, "y": 362.7, "w": 229.2, "h": 12.0}, {"t": "drainage tubes were removed 2 days after surgery. ", "x": 56.7, "y": 375.7, "w": 229.6, "h": 12.0}, {"t": "The wires used for maxillomandibular fixation ", "x": 56.7, "y": 388.8, "w": 229.3, "h": 12.0}, {"t": "were removed and the sutures were taken out ", "x": 56.7, "y": 401.7, "w": 229.3, "h": 12.0}, {"t": "from the wounds 7 days after surgery. The patients ", "x": 56.7, "y": 414.7, "w": 229.5, "h": 12.0}, {"t": "received a non-steroid anti-inflammatory drug ", "x": 56.7, "y": 427.8, "w": 229.3, "h": 12.0}, {"t": "(Ketorolac trometamine 30 mg) intramuscularly ", "x": 56.7, "y": 440.7, "w": 229.3, "h": 12.0}, {"t": "immediately after surgery and every 6 hours until ", "x": 56.7, "y": 453.7, "w": 229.7, "h": 12.0}, {"t": "the next day. Compression bandages and ice packs ", "x": 56.7, "y": 466.8, "w": 229.3, "h": 12.0}, {"t": "were applied to the facial area until the second ", "x": 56.7, "y": 479.7, "w": 229.3, "h": 12.0}, {"t": "day after surgery. ", "x": 56.7, "y": 492.7, "w": 85.9, "h": 12.0}, {"t": "The 56 patients were divided into 2 groups ", "x": 66.7, "y": 505.8, "w": 219.2, "h": 12.0}, {"t": "according to the randomization codes generated ", "x": 56.7, "y": 518.7, "w": 229.3, "h": 12.0}, {"t": "by Microsoft Excel: an experimental and control ", "x": 56.7, "y": 531.7, "w": 229.2, "h": 12.0}, {"t": "group. The patients in the experimental group ", "x": 56.7, "y": 544.8, "w": 229.2, "h": 12.0}, {"t": "received only 1.0 g of a third-generation cephalo-", "x": 56.7, "y": 557.7, "w": 226.8, "h": 12.0}, {"t": "sporin (Cefpiramide) intravenously 30 minutes ", "x": 56.7, "y": 570.7, "w": 229.2, "h": 12.0}, {"t": "before surgery and did not receive the placebo. ", "x": 56.7, "y": 583.8, "w": 229.3, "h": 12.0}, {"t": "The control group also received 1.0 g of Cefpira-", "x": 56.7, "y": 596.7, "w": 226.8, "h": 12.0}, {"t": "mide 30 minutes before surgery as well as twice ", "x": 56.7, "y": 609.7, "w": 229.2, "h": 12.0}, {"t": "daily until 3 days after surgery. The patients were ", "x": 56.7, "y": 622.8, "w": 229.3, "h": 12.0}, {"t": "evaluated every day during the first 3 days and ", "x": 56.7, "y": 635.7, "w": 229.3, "h": 12.0}, {"t": "at the end of the 1st and 2nd week after surgery ", "x": 56.7, "y": 648.7, "w": 229.3, "h": 12.0}, {"t": "for any postoperative infections in reference to the ", "x": 56.7, "y": 661.8, "w": 229.4, "h": 12.0}, {"t": "criteria for defining a surgical site infection (SSI), ", "x": 56.7, "y": 674.7, "w": 229.3, "h": 12.0}, {"t": "recommended by the Centers for Disease Control ", "x": 56.7, "y": 687.7, "w": 229.3, "h": 12.0}, {"t": "and Prevention (CDC).12 Postoperative wound ", "x": 56.7, "y": 699.1, "w": 229.3, "h": 13.7}, {"t": "infection was defined by at least 1 of the following ", "x": 56.7, "y": 713.7, "w": 229.6, "h": 12.0}, {"t": "criteria:", "x": 56.7, "y": 726.7, "w": 33.8, "h": 12.0}, {"t": "1. Purulent drainage from the surgical site with ", "x": 321.8, "y": 102.7, "w": 219.6, "h": 12.0}, {"t": "or without laboratory confirmation. ", "x": 334.0, "y": 115.8, "w": 167.4, "h": 12.0}, {"t": "2. At least 1 of the following signs or symptoms ", "x": 321.8, "y": 128.7, "w": 219.3, "h": 12.0}, {"t": "of infection: pain or tenderness, localized ", "x": 333.8, "y": 141.7, "w": 207.3, "h": 12.0}, {"t": "swelling, redness or heat, and a superficial ", "x": 333.8, "y": 154.8, "w": 207.2, "h": 12.0}, {"t": "incision deliberately opened by surgeon, ", "x": 333.8, "y": 167.7, "w": 207.3, "h": 12.0}, {"t": "unless the incision is culture-negative.", "x": 333.8, "y": 180.7, "w": 178.2, "h": 12.0}, {"t": "3. An abscess or other evidence of infection is ", "x": 321.8, "y": 193.8, "w": 219.3, "h": 12.0}, {"t": "found on a direct examination, during reope-", "x": 334.1, "y": 206.7, "w": 204.5, "h": 12.0}, {"t": "ration, or by the histopathological or radiolo-", "x": 334.1, "y": 219.7, "w": 204.5, "h": 12.0}, {"t": "gic examination. ", "x": 334.1, "y": 232.8, "w": 77.8, "h": 12.0}, {"t": "4. Diagnosis of SSI by the surgeon or attending ", "x": 321.8, "y": 245.7, "w": 219.5, "h": 12.0}, {"t": "physician. ", "x": 334.0, "y": 258.7, "w": 47.8, "h": 12.0}, {"t": "Statistical analysis was performed using a \ue0b22-test ", "x": 321.8, "y": 270.1, "w": 219.4, "h": 13.7}, {"t": "on the Statistical Package for the Social Sciences ", "x": 311.8, "y": 284.7, "w": 229.3, "h": 12.0}, {"t": "(SPSS for windows, ver. 12.0, SPSS Inc., Chicago, ", "x": 311.8, "y": 297.7, "w": 229.3, "h": 12.0}, {"t": "IL, USA). The study protocol was approved by the ", "x": 311.8, "y": 310.8, "w": 229.6, "h": 12.0}, {"t": "Institutional Review Board of the College of ", "x": 311.8, "y": 323.7, "w": 229.3, "h": 12.0}, {"t": "Dentistry, Yonsei University (YUDC). ", "x": 311.8, "y": 336.7, "w": 176.4, "h": 12.0}, {"t": "RESULTS ", "x": 311.8, "y": 375.7, "w": 51.6, "h": 13.3}, {"t": "The mean (SD) age of the experimental group ", "x": 321.8, "y": 401.7, "w": 219.3, "h": 12.0}, {"t": "was 23.9 years (5.84) with male-female ratio of 4 ", "x": 311.8, "y": 414.7, "w": 229.3, "h": 12.0}, {"t": ": 3. The average duration of surgery was 3 hours ", "x": 311.8, "y": 427.8, "w": 229.3, "h": 12.0}, {"t": "and 40 minutes. The mean (SD) age of the control ", "x": 311.8, "y": 440.7, "w": 229.5, "h": 12.0}, {"t": "group was 24.3 years (6.33) with male-female ratio ", "x": 311.8, "y": 453.7, "w": 229.5, "h": 12.0}, {"t": "of 1 : 1. The average duration of surgery was 3 ", "x": 311.8, "y": 466.8, "w": 229.2, "h": 12.0}, {"t": "hours and 55 minutes. ", "x": 311.8, "y": 479.7, "w": 108.0, "h": 12.0}, {"t": "There were 3 infections in the experimental group ", "x": 321.8, "y": 492.7, "w": 219.4, "h": 12.0}, {"t": "and 2 infections in the control group, observed 2 ", "x": 311.8, "y": 505.8, "w": 229.3, "h": 12.0}, {"t": "weeks after surgery (Table 1). One patient in the ", "x": 311.8, "y": 518.7, "w": 229.3, "h": 12.0}, {"t": "experimental group was diagnosed with an infec-", "x": 311.8, "y": 531.7, "w": 226.8, "h": 12.0}, {"t": "tion by facial swelling, redness and sinus haziness ", "x": 311.8, "y": 544.8, "w": 229.6, "h": 12.0}, {"t": "in the waters\u2019 view, and the other 4 patients were ", "x": 311.8, "y": 557.7, "w": 229.4, "h": 12.0}, {"t": "diagnosed with a postoperative infection by swel-", "x": 311.8, "y": 570.7, "w": 226.9, "h": 12.0}, {"t": "ling and redness, and pain on the mandibular area. ", "x": 311.8, "y": 583.8, "w": 229.5, "h": 12.0}, {"t": "Therefore, the wounds were opened by a surgeon ", "x": 311.8, "y": 596.7, "w": 229.6, "h": 12.0}, {"t": "and the patients were treated with antibiotics. ", "x": 311.8, "y": 609.7, "w": 229.3, "h": 12.0}, {"t": "However, only 1 patient in the control group ", "x": 311.8, "y": 622.8, "w": 229.3, "h": 12.0}, {"t": "developed wound dehiscence only without any ", "x": 311.8, "y": 635.7, "w": 229.2, "h": 12.0}, {"t": "drainage, fever, or swelling in the maxillary area. ", "x": 311.8, "y": 648.7, "w": 229.5, "h": 12.0}, {"t": "According to the \ue0b22-test, there was no significant ", "x": 311.8, "y": 660.1, "w": 229.3, "h": 13.7}, {"t": "difference in the prevalence of postoperative ", "x": 311.8, "y": 674.7, "w": 229.3, "h": 12.0}, {"t": "wound infections between the patients who had ", "x": 311.8, "y": 687.7, "w": 229.3, "h": 12.0}, {"t": "received postoperative prophylactic antibiotic ", "x": 311.8, "y": 700.8, "w": 229.2, "h": 12.0}, {"t": "administration and those who had not (p = 0.639).", "x": 311.8, "y": 713.7, "w": 226.8, "h": 12.0}]}, {"doc": 0, "page": 3, "img": "pages/p003.jpg", "pw": 595.2, "ph": 842.0, "lines": [{"t": "The Efficacy of Postoperative Prophylactic Antibiotics in Orthognathic Surgery", "x": 160.9, "y": 77.6, "w": 273.6, "h": 8.9}, {"t": "57", "x": 527.6, "y": 79.0, "w": 10.9, "h": 11.3}, {"t": "Yonsei Med J Vol. 50, No. 1, 2009", "x": 415.8, "y": 755.6, "w": 122.8, "h": 8.9}, {"t": "Table 1. Results according to the Postoperative Antibiotic Prophylaxis ", "x": 71.5, "y": 105.6, "w": 292.0, "h": 10.8}, {"t": "Experimental group without ", "x": 219.8, "y": 125.9, "w": 118.4, "h": 10.8}, {"t": "postoperative antibiotics (n = 28)", "x": 211.6, "y": 138.1, "w": 132.4, "h": 10.8}, {"t": "Control group with postoperative ", "x": 370.5, "y": 125.9, "w": 140.9, "h": 10.8}, {"t": "antibiotics for 3 days (n = 28)", "x": 379.0, "y": 138.1, "w": 121.7, "h": 10.8}, {"t": "Age (Mean \u00b1 SD)", "x": 71.5, "y": 155.6, "w": 69.2, "h": 10.8}, {"t": "23.9 \u00b1 5.84 yrs", "x": 249.5, "y": 155.6, "w": 56.8, "h": 10.8}, {"t": "24.3 \u00b1 6.33 yrs", "x": 411.4, "y": 155.6, "w": 56.8, "h": 10.8}, {"t": "Sex (Male : Female)", "x": 71.5, "y": 173.0, "w": 82.6, "h": 10.8}, {"t": "16 : 12", "x": 263.5, "y": 173.0, "w": 28.8, "h": 10.8}, {"t": "14 : 14", "x": 425.5, "y": 173.0, "w": 28.8, "h": 10.8}, {"t": "Postoperative infection (n)", "x": 71.5, "y": 190.5, "w": 107.7, "h": 10.8}, {"t": "3", "x": 275.6, "y": 190.5, "w": 4.5, "h": 10.8}, {"t": "2", "x": 437.6, "y": 190.5, "w": 4.5, "h": 10.8}, {"t": "Wound dehiscence (n)", "x": 71.5, "y": 208.0, "w": 91.7, "h": 10.8}, {"t": "0", "x": 275.6, "y": 208.0, "w": 4.5, "h": 10.8}, {"t": "1", "x": 437.6, "y": 208.0, "w": 4.5, "h": 10.8}, {"t": "DISCUSSION ", "x": 56.7, "y": 243.7, "w": 71.8, "h": 13.3}, {"t": "The method of antibiotic prophylaxis is deter-", "x": 66.7, "y": 269.8, "w": 216.8, "h": 12.0}, {"t": "mined by an evaluation of the patient, procedure, ", "x": 56.7, "y": 282.8, "w": 229.3, "h": 12.0}, {"t": "and surgical wound. The preoperative and imme-", "x": 56.7, "y": 295.8, "w": 227.0, "h": 12.0}, {"t": "diate postoperative administration of antibiotics is ", "x": 56.7, "y": 308.8, "w": 229.6, "h": 12.0}, {"t": "a method generally used for antibiotic prophylaxis ", "x": 56.7, "y": 321.8, "w": 229.7, "h": 12.0}, {"t": "in almost all surgical procedures. However, anti-", "x": 56.7, "y": 334.8, "w": 226.8, "h": 12.0}, {"t": "biotics are continuously used postoperatively in ", "x": 56.7, "y": 347.8, "w": 229.3, "h": 12.0}, {"t": "most procedures because it is difficult to assess ", "x": 56.7, "y": 360.8, "w": 229.2, "h": 12.0}, {"t": "the factors associated with postoperative wound ", "x": 56.7, "y": 373.8, "w": 229.3, "h": 12.0}, {"t": "infections or appropriate antibiotic prophylaxis ", "x": 56.7, "y": 386.8, "w": 229.3, "h": 12.0}, {"t": "method. ", "x": 56.7, "y": 399.8, "w": 39.3, "h": 12.0}, {"t": "On the other hand, orthognathic surgery is ", "x": 66.7, "y": 412.8, "w": 219.3, "h": 12.0}, {"t": "mainly performed on young patients without an ", "x": 56.7, "y": 425.8, "w": 229.3, "h": 12.0}, {"t": "underlying illness or comorbidity. Moreover, the ", "x": 56.7, "y": 438.8, "w": 229.3, "h": 12.0}, {"t": "number of factors affecting the development of ", "x": 56.7, "y": 451.8, "w": 229.3, "h": 12.0}, {"t": "postoperative wound infections decreases with ", "x": 56.7, "y": 464.8, "w": 229.3, "h": 12.0}, {"t": "the improvement of the surgical instruments, ", "x": 56.7, "y": 477.8, "w": 229.3, "h": 12.0}, {"t": "materials, techniques, and more generalized pro-", "x": 56.7, "y": 490.8, "w": 226.8, "h": 12.0}, {"t": "cedure.", "x": 56.7, "y": 503.8, "w": 32.6, "h": 12.0}, {"t": "Peterson13 suggested that the prophylactic anti-", "x": 66.7, "y": 515.1, "w": 216.8, "h": 13.7}, {"t": "biotic administration for postoperative wound ", "x": 56.7, "y": 529.8, "w": 229.3, "h": 12.0}, {"t": "infections in oral and maxillofacial surgery should ", "x": 56.7, "y": 542.8, "w": 229.4, "h": 12.0}, {"t": "be performed if there is a strong probability of ", "x": 56.7, "y": 555.8, "w": 229.3, "h": 12.0}, {"t": "infection, and appropriate antibiotics must be ", "x": 56.7, "y": 568.8, "w": 229.3, "h": 12.0}, {"t": "given in high-dose but for only a short period of ", "x": 56.7, "y": 581.8, "w": 229.3, "h": 12.0}, {"t": "time. Orthognathic surgeries are classified as clean ", "x": 56.7, "y": 594.8, "w": 229.4, "h": 12.0}, {"t": "contaminated ", "x": 56.7, "y": 607.8, "w": 63.3, "h": 12.0}, {"t": "procedures ", "x": 129.1, "y": 607.8, "w": 52.3, "h": 12.0}, {"t": "with ", "x": 190.6, "y": 607.8, "w": 22.8, "h": 12.0}, {"t": "postoperative ", "x": 222.6, "y": 607.8, "w": 63.3, "h": 12.0}, {"t": "wound infection of 10% to 15%, and Peterson13 ", "x": 56.7, "y": 619.2, "w": 228.3, "h": 13.7}, {"t": "reported that an incidence of an anticipated in-", "x": 56.7, "y": 633.8, "w": 226.8, "h": 12.0}, {"t": "fection in oral clean contaminated surgery could ", "x": 56.7, "y": 646.8, "w": 229.3, "h": 12.0}, {"t": "be reduced by using prophylactic antibiotics. ", "x": 56.7, "y": 659.8, "w": 229.3, "h": 12.0}, {"t": "Zijderveld et al.14 suggested that the incidence of ", "x": 56.7, "y": 671.1, "w": 229.3, "h": 13.7}, {"t": "postoperative infections (52.6%) increased without ", "x": 56.7, "y": 685.8, "w": 229.3, "h": 12.0}, {"t": "the administration of prophylactic antibiotics. ", "x": 56.7, "y": 698.8, "w": 229.3, "h": 12.0}, {"t": "Martis and Karabouta9 suggested that the routine ", "x": 56.7, "y": 710.1, "w": 229.5, "h": 13.7}, {"t": "use of prophylactic antibiotics in orthognathic ", "x": 56.7, "y": 724.8, "w": 229.2, "h": 12.0}, {"t": "surgery is unnecessary, and Lindeboom et al.15 ", "x": 311.8, "y": 242.1, "w": 229.3, "h": 13.7}, {"t": "also suggested that the use of postoperative pro-", "x": 311.8, "y": 256.8, "w": 226.8, "h": 12.0}, {"t": "phylactic antibiotics (clindamycin) is unnecessary ", "x": 311.8, "y": 269.8, "w": 229.3, "h": 12.0}, {"t": "in orthognathic surgery (SSRO). Furthermore, ", "x": 311.8, "y": 282.8, "w": 229.2, "h": 12.0}, {"t": "Fridrich et al.16 and Baqain et al.17 suggested that ", "x": 311.8, "y": 294.2, "w": 229.3, "h": 13.7}, {"t": "the long-term use of antibiotics does not decrease ", "x": 311.8, "y": 308.8, "w": 229.6, "h": 12.0}, {"t": "the frequency of postoperative infections. However, ", "x": 311.8, "y": 321.8, "w": 229.7, "h": 12.0}, {"t": "wide range of patient's age, small group size, and ", "x": 311.8, "y": 334.8, "w": 229.3, "h": 12.0}, {"t": "various osteomies may cause difficulties when ", "x": 311.8, "y": 347.8, "w": 229.2, "h": 12.0}, {"t": "precisely evaluating the efficacy of prophylactic ", "x": 311.8, "y": 360.8, "w": 229.2, "h": 12.0}, {"t": "antibiotics. ", "x": 311.8, "y": 373.8, "w": 50.8, "h": 12.0}, {"t": "Therefore, this study was undertaken to ex-", "x": 321.8, "y": 386.8, "w": 216.7, "h": 12.0}, {"t": "amine the prevalence of postoperative wound ", "x": 311.8, "y": 399.8, "w": 229.3, "h": 12.0}, {"t": "infections in young patients after orthognathic ", "x": 311.8, "y": 412.8, "w": 229.3, "h": 12.0}, {"t": "surgery (Le Fort I osteotomy and bilateral in-", "x": 311.8, "y": 425.8, "w": 226.8, "h": 12.0}, {"t": "traoral vertical ramus osteotomy) with or without ", "x": 311.8, "y": 438.8, "w": 229.6, "h": 12.0}, {"t": "the use of postoperative prophylactic antibiotics. ", "x": 311.8, "y": 451.8, "w": 229.3, "h": 12.0}, {"t": "Twenty eight patients were enrolled in each ", "x": 311.8, "y": 464.8, "w": 229.2, "h": 12.0}, {"t": "group. The samples were selected at a significance ", "x": 311.8, "y": 477.8, "w": 229.7, "h": 12.0}, {"t": "level of \u03b1 = 0.05 and a test power \u03b2= 0.20. A smaller ", "x": 311.8, "y": 490.8, "w": 229.6, "h": 12.0}, {"t": "infection rate was set to 5%, and the difference in ", "x": 311.8, "y": 503.8, "w": 229.7, "h": 12.0}, {"t": "the estimated infection rate was set to 30%, based ", "x": 311.8, "y": 516.8, "w": 229.3, "h": 12.0}, {"t": "on previous report that the incidence of post-", "x": 311.8, "y": 529.8, "w": 226.7, "h": 12.0}, {"t": "operative wound infection using prophylactic ", "x": 311.8, "y": 542.8, "w": 229.3, "h": 12.0}, {"t": "antibiotics, ranges from 5.6% to 33.4%.17 In this ", "x": 311.8, "y": 554.1, "w": 229.3, "h": 13.7}, {"t": "study, wound infections were observed in both ", "x": 311.8, "y": 568.8, "w": 229.2, "h": 12.0}, {"t": "groups, however, the number was small. This was ", "x": 311.8, "y": 581.8, "w": 229.6, "h": 12.0}, {"t": "attributed to the followings: the patients were ", "x": 311.8, "y": 594.8, "w": 229.2, "h": 12.0}, {"t": "young without a specific medical history, patients ", "x": 311.8, "y": 607.8, "w": 229.7, "h": 12.0}, {"t": "had no preoperative wound infections, no bone ", "x": 311.8, "y": 620.8, "w": 229.3, "h": 12.0}, {"t": "graft had been performed during surgery, the ", "x": 311.8, "y": 633.8, "w": 229.3, "h": 12.0}, {"t": "surgical procedures such as IVRO were less ", "x": 311.8, "y": 646.8, "w": 229.3, "h": 12.0}, {"t": "traumatic with a short duration, the tissue trauma ", "x": 311.8, "y": 659.8, "w": 229.4, "h": 12.0}, {"t": "during surgery was minimal due to the systema-", "x": 311.8, "y": 672.8, "w": 226.8, "h": 12.0}, {"t": "tization of orthognathic surgery and the improve-", "x": 311.8, "y": 685.8, "w": 226.8, "h": 12.0}, {"t": "ment of techniques, and wound control such as ", "x": 311.8, "y": 698.8, "w": 229.3, "h": 12.0}, {"t": "postoperative blood or exudate was properly ", "x": 311.8, "y": 711.8, "w": 229.3, "h": 12.0}, {"t": "performed. ", "x": 311.8, "y": 724.8, "w": 52.3, "h": 12.0}]}, {"doc": 0, "page": 4, "img": "pages/p004.jpg", "pw": 595.2, "ph": 842.0, "lines": [{"t": "Sang-Hoon Kang, et al.", "x": 256.4, "y": 77.6, "w": 82.4, "h": 8.9}, {"t": "58", "x": 56.7, "y": 79.0, "w": 11.0, "h": 11.3}, {"t": "Yonsei Med J Vol. 50, No. 1, 2009", "x": 56.7, "y": 755.6, "w": 122.8, "h": 8.9}, {"t": "The types of antibiotics used are important ", "x": 66.7, "y": 102.7, "w": 219.2, "h": 12.0}, {"t": "factors to consider for prophylactic antibiotic treat-", "x": 56.7, "y": 115.8, "w": 226.8, "h": 12.0}, {"t": "ment. Penicillin is the representative antibiotic ", "x": 56.7, "y": 128.7, "w": 229.2, "h": 12.0}, {"t": "used as a prophylaxis during intraoral surgery and ", "x": 56.7, "y": 141.7, "w": 229.4, "h": 12.0}, {"t": "for the primary treatment of dental infections. ", "x": 56.7, "y": 154.8, "w": 229.3, "h": 12.0}, {"t": "Spaey et al18 suggested the use of amoxicillin- ", "x": 56.7, "y": 166.1, "w": 229.3, "h": 13.7}, {"t": "clavulanate along with drain usage during SSRO ", "x": 56.7, "y": 180.7, "w": 229.3, "h": 12.0}, {"t": "in a study of antibiotic administration. In this study, ", "x": 56.7, "y": 193.8, "w": 229.5, "h": 12.0}, {"t": "third-generation cephalosporin antibiotics were ", "x": 56.7, "y": 206.7, "w": 229.2, "h": 12.0}, {"t": "administered before surgery, which is believed to ", "x": 56.7, "y": 219.7, "w": 229.4, "h": 12.0}, {"t": "be a possible prophylactic antibiotic that may be ", "x": 56.7, "y": 232.8, "w": 229.2, "h": 12.0}, {"t": "used in orthognathic surgery because most bacteria ", "x": 56.7, "y": 245.7, "w": 229.4, "h": 12.0}, {"t": "cultured during a dental infection are susceptible ", "x": 56.7, "y": 258.7, "w": 229.2, "h": 12.0}, {"t": "to third-generation cephalosporin.19 There has ", "x": 56.7, "y": 270.1, "w": 229.3, "h": 13.7}, {"t": "been an increase in infections due to anaerobic ", "x": 56.7, "y": 284.7, "w": 229.2, "h": 12.0}, {"t": "and Gram-negative organisms,20 and most wound ", "x": 56.7, "y": 296.1, "w": 229.3, "h": 13.7}, {"t": "infections after orthognathic surgery are caused by ", "x": 56.7, "y": 310.8, "w": 229.3, "h": 12.0}, {"t": "Gram negative bacteria.21", "x": 56.7, "y": 322.1, "w": 116.2, "h": 13.7}, {"t": "If a post-operative wound infection occurs ", "x": 66.7, "y": 336.7, "w": 219.2, "h": 12.0}, {"t": "despite the effective prophylactic antibiotic admi-", "x": 56.7, "y": 349.8, "w": 226.8, "h": 12.0}, {"t": "nistration before surgery, it could be concluded ", "x": 56.7, "y": 362.7, "w": 229.2, "h": 12.0}, {"t": "that the bacteria in the infected wound are not ", "x": 56.7, "y": 375.7, "w": 229.3, "h": 12.0}, {"t": "sensitive to the prophylactic antibiotics admini-", "x": 56.7, "y": 388.8, "w": 226.8, "h": 12.0}, {"t": "stered, and in such cases, an appropriate anti- ", "x": 56.7, "y": 401.7, "w": 229.3, "h": 12.0}, {"t": "microbial therapy should be determined by a ", "x": 56.7, "y": 414.7, "w": 229.3, "h": 12.0}, {"t": "culture test of the bacteria found in the infected ", "x": 56.7, "y": 427.8, "w": 229.3, "h": 12.0}, {"t": "region.21,22", "x": 56.7, "y": 439.1, "w": 45.4, "h": 13.7}, {"t": "Prophylactic antibiotics reduce the risk of post-", "x": 66.7, "y": 453.7, "w": 216.8, "h": 12.0}, {"t": "operative wound infections, which leads to a lower ", "x": 56.7, "y": 466.8, "w": 229.6, "h": 12.0}, {"t": "number of hospitalization days, reduced cost, and ", "x": 56.7, "y": 479.7, "w": 229.6, "h": 12.0}, {"t": "improved social life. However, the long-term use ", "x": 56.7, "y": 492.7, "w": 229.3, "h": 12.0}, {"t": "of postoperative prophylactic antibiotics may lead ", "x": 56.7, "y": 505.8, "w": 229.5, "h": 12.0}, {"t": "to several problems, such as various allergic reac-", "x": 56.7, "y": 518.7, "w": 226.9, "h": 12.0}, {"t": "tions, increased cost, changes in resident bacterial ", "x": 56.7, "y": 531.7, "w": 229.4, "h": 12.0}, {"t": "colony in vivo, or appearance of resistant bacteria.7,23 ", "x": 56.7, "y": 543.1, "w": 228.5, "h": 13.7}, {"t": "More studies with much larger numbers of ", "x": 66.7, "y": 557.7, "w": 219.3, "h": 12.0}, {"t": "patients are needed on the administration of pro-", "x": 56.7, "y": 570.7, "w": 227.0, "h": 12.0}, {"t": "phylactic antibiotics during orthognathic surgery ", "x": 56.7, "y": 583.8, "w": 229.2, "h": 12.0}, {"t": "and other oral and maxillofacial procedures. In ", "x": 56.7, "y": 596.7, "w": 229.3, "h": 12.0}, {"t": "addition, further research on properly appropriated ", "x": 56.7, "y": 609.7, "w": 229.6, "h": 12.0}, {"t": "use of antibiotic prophylaxis is warranted in order ", "x": 56.7, "y": 622.8, "w": 229.3, "h": 12.0}, {"t": "to minimize the use of prophylactic antibiotics and ", "x": 56.7, "y": 635.7, "w": 229.4, "h": 12.0}, {"t": "their adverse effects and problems. In the p  Vertical Ramus Osteotomy\n\n## INTRODUCTION\nAntibiotics are used to treat and prevent postoperative infections. In 1960, it was reported that pathogens are present during surgery[1],[2] regardless of how aseptic the surgery might appear. Moreover, the correlation between prophylactic antibiotics and postoperative wound infections was demonstrated. Therefore, prophylactic antibiotics are now used in almost all surgical procedures. The most effective method of antibiotic prophylaxis is the preoperative administration of antibiotics because it can act at the time when the wound is potentially contaminated by bacteria.[2]\u207b[4] On the other hand, it was also reported that the use of antibiotics after 3 - 4 hours of a bacterial invasion is unsuitable.[5]\n\nProphylactic antibiotics are generally administered both preoperatively and postoperatively. Hence, the effects of the indiscriminate method and period of administration are unclear, considering the multiple factors that contribute to postoperative wound infections.[6]\u207b[8]\n\nThe use of antibiotic prophylaxis is controversial even in orthognathic surgery, which is a representative procedure for oral and maxillofacial surgery. There are reports show no increase in the incidence of infection without the administration of postoperative prophylactic antibiotics.[9],[10] On the other hand, there are reports to suggest the necessity of continuous antibiotic administration.[11] However, orthognathic surgery is mainly performed on young patients without a specific medical history. Moreover, the number of factors associated with the development of postoperative wound infections decreases as the procedure becomes more generalized and its technique advances.\n\nThe aims of this clinical study were to evaluate the prevalence of postoperative wound infections with or without antibiotic prophylaxis after orthognathic surgery in young patients without any specific medical history, and to identify criteria for appropriate use of prophylactic antibiotics in orthognathic surgery.\n\n## PATIENTS AND METHODS\nFifty-six patients in their 20s without a specific medical history, and who were to undergo orthognathic surgical procedures at the department of oral and maxillofacial surgery at the dental hospital of Yonsei University were enrolled in this study. A horizontal maxillary osteotomy and vertical ramus mandibular osteotomy were performed by the same oral surgeon with the aid of trained nurses and residents under hypotensive general anesthesia. No bone grafts were performed. The duration of surgery was less than 5 hours. During surgery, maxillomandibular fixation was placed using steel wires, and drainage tubes were placed on both sides of the mandible. The drainage tubes were removed 2 days after surgery. The wires used for maxillomandibular fixation were removed and the sutures were taken out from the wounds 7 days after surgery. The patients received a non-steroid anti-inflammatory drug (Ketorolac trometamine 30 mg) intramuscularly immediately after surgery and every 6 hours until the next day. Compression bandages and ice packs were applied to the facial area until the second day after surgery.\n\nThe 56 patients were divided into 2 groups according to the randomization codes generated by Microsoft Excel: an experimental and control group. The patients in the experimental group received only 1.0 g of a third-generation cephalosporin (Cefpiramide) intravenously 30 minutes before surgery and did not receive the placebo. The control group also received 1.0 g of Cefpiramide 30 minutes before surgery as well as twice daily until 3 days after surgery. The patients were evaluated every day during the first 3 days and at the end of the 1st and 2nd week after surgery for any postoperative infections in reference to the criteria for defining a surgical site infection (SSI), recommended by the Centers for Disease Control and Prevention (CDC).[12] Postoperative wound infection was defined by at least 1 of the following criteria:\n\nStatistical analysis was performed using a \u03c7\u00b2-test on the Statistical Package for the Social Sciences (SPSS for windows, ver. 12.0, SPSS Inc., Chicago, IL, USA). The study protocol was approved by the Institutional Review Board of the College of Dentistry, Yonsei University (YUDC).\n\n## RESULTS\nThe mean (SD) age of the experimental group was 23.9 years (5.84) with male-female ratio of 4 : 3. The average duration of surgery was 3 hours and 40 minutes. The mean (SD) age of the control group was 24.3 years (6.33) with male-female ratio of 1 : 1. The average duration of surgery was 3 hours and 55 minutes.\n\nThere were 3 infections in the experimental group and 2 infections in the control group, observed 2 weeks after surgery (Table 1). One patient in the experimental group was diagnosed with an infection by facial swelling, redness and sinus haziness in the waters' view, and the other 4 patients were diagnosed with a postoperative infection by swelling and redness, and pain on the mandibular area. Therefore, the wounds were opened by a surgeon and the patients were treated with antibiotics. However, only 1 patient in the control group developed wound dehiscence only without any drainage, fever, or swelling in the maxillary area. According to the \u03c7\u00b2-test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).\n\n[Table 1: Results according to the Postoperative Antibiotic Prophylaxis \u2014 image only, no cells; see tables]\n\n## DISCUSSION\nThe method of antibiotic prophylaxis is determined by an evaluation of the patient, procedure, and surgical wound. The preoperative and immediate postoperative administration of antibiotics is a method generally used for antibiotic prophylaxis in almost all surgical procedures. However, antibiotics are continuously used postoperatively in most procedures because it is difficult to assess the factors associated with postoperative wound infections or appropriate antibiotic prophylaxis method.\n\nOn the other hand, orthognathic surgery is mainly performed on young patients without an underlying illness or comorbidity. Moreover, the number of factors affecting the development of postoperative wound infections decreases with the improvement of the surgical instruments, materials, techniques, and more generalized procedure.\n\nPeterson[13] suggested that the prophylactic antibiotic administration for postoperative wound infections in oral and maxillofacial surgery should be performed if there is a strong probability of infection, and appropriate antibiotics must be given in high-dose but for only a short period of time. Orthognathic surgeries are classified as clean contaminated procedures with postoperative wound infection of 10% to 15%, and Peterson[13] reported that an incidence of an anticipated infection in oral clean contaminated surgery could be reduced by using prophylactic antibiotics. Zijderveld et al.[14] suggested that the incidence of postoperative infections (52.6%) increased without the administration of prophylactic antibiotics. Martis and Karabouta[9] suggested that the routine use of prophylactic antibiotics in orthognathic surgery is unnecessary, and Lindeboom et al.[15] also suggested that the use of postoperative prophylactic antibiotics (clindamycin) is unnecessary in orthognathic surgery (SSRO). Furthermore, Fridrich et al.[16] and Baqain et al.[17] suggested that the long-term use of antibiotics does not decrease the frequency of postoperative infections. However, wide range of patient's age, small group size, and various osteomies may cause difficulties when precisely evaluating the efficacy of prophylactic antibiotics.\n\nTherefore, this study was undertaken to examine the prevalence of postoperative wound infections in young patients after orthognathic surgery (Le Fort I osteotomy and bilateral intraoral vertical ramus osteotomy) with or without the use of postoperative prophylactic antibiotics. Twenty eight patients were enrolled in each group. The samples were selected at a significance level of \u03b1= 0.05 and a test power \u03b2= 0.20. A smaller infection rate was set to 5%, and the difference in the estimated infection rate was set to 30%, based on previous report that the incidence of postoperative wound infection using prophylactic antibiotics, ranges from 5.6% to 33.4%.[17] In this study, wound infections were observed in both groups, however, the number was small. This was attributed to the followings: the patients were young without a specific medical history, patients had no preoperative wound infections, no bone graft had been performed during surgery, the surgical procedures such as IVRO were less traumatic with a short duration, the tissue trauma during surgery was minimal due to the systematization of orthognathic surgery and the improvement of techniques, and wound control such as postoperative blood or exudate was properly performed.\n\nThe types of antibiotics used are important factors to consider for prophylactic antibiotic treatment. Penicillin is the representative antibiotic used as a prophylaxis during intraoral surgery and for the primary treatment of dental infections. Spaey et al[18] suggested the use of amoxicillin-clavulanate along with drain usage during SSRO in a study of antibiotic administration. In this study, third-generation cephalosporin antibiotics were administered before surgery, which is believed to be a possible prophylactic antibiotic that may be used in orthognathic surgery because most bacteria cultured during a dental infection are susceptible to third-generation cephalosporin.[19] There has been an increase in infections due to anaerobic and Gram-negative organisms,[20] and most wound infections after orthognathic surgery are caused by Gram negative bacteria.[21]\n\nIf a post-operative wound infection occurs despite the effective prophylactic antibiotic administration before surgery, it could be concluded that the bacteria in the infected wound are not sensitive to the prophylactic antibiotics administered, and in such cases, an appropriate antimicrobial therapy should be determined by a culture test of the bacteria found in the infected region.[21],[22]\n\nProphylactic antibiotics reduce the risk of postoperative wound infections, which leads to a lower number of hospitalization days, reduced cost, and improved social life. However, the long-term use of postoperative prophylactic antibiotics may lead to several problems, such as various allergic reactions, increased cost, changes in resident bacterial colony in vivo, or appearance of resistant bacteria.[7],[23]\n\nMore studies with much larger numbers of patients are needed on the administration of prophylactic antibiotics during orthognathic surgery and other oral and maxillofacial procedures. In addition, further research on properly appropriated use of antibiotic prophylaxis is warranted in order to minimize the use of prophylactic antibiotics and their adverse effects and problems. In the present study, there was no significant difference in the prevalence of postoperative wound infections between patients who had received postoperative prophylactic antibiotic administration and those who did not. Therefore, prolonged prophylactic antibiotic use after orthognathic surgery may not be necessary, provided that there are no other significant factors for wound infections.\n\n## References\n\n# References\n\n1. [no author]\n2. [no author]\n3. [no author]\n4. [no author]\n5. [no author]\n6. [no author]\n7. [no author]\n8. [no author]\n9. [no author]\n10. [no author]\n11. [no author]\n12. [no author]\n13. [no author]\n14. [no author]\n15. [no author]\n16. [no author]\n17. [no author]\n18. [no author]\n19. [no author]\n20. [no author]\n21. [no author]\n22. [no author]\n23. [no author]\n", "text_html": "<div class=\"blk\" data-src-offset=\"0\"><h2>The Efficacy of Postoperative Prophylactic Antibiotics in Orthognathic Surgery: A Prospective Study in Le Fort I Osteotomy and Bilateral Intraoral Vertical Ramus Osteotomy<\/h2><\/div>\n<div class=\"blk\" data-src-offset=\"176\"><h2>INTRODUCTION<\/h2>\n<p>Antibiotics are used to treat and prevent postoperative infections. In 1960, it was reported that pathogens are present during surgery[1],[2] regardless of how aseptic the surgery might appear. Moreover, the correlation between prophylactic antibiotics and postoperative wound infections was demonstrated. Therefore, prophylactic antibiotics are now used in almost all surgical procedures. The most effective method of antibiotic prophylaxis is the preoperative administration of antibiotics because it can act at the time when the wound is potentially contaminated by bacteria.[2]\u207b[4] On the other hand, it was also reported that the use of antibiotics after 3 - 4 hours of a bacterial invasion is unsuitable.[5]<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"907\"><p>Prophylactic antibiotics are generally administered both preoperatively and postoperatively. Hence, the effects of the indiscriminate method and period of administration are unclear, considering the multiple factors that contribute to postoperative wound infections.[6]\u207b[8]<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"1182\"><p>The use of antibiotic prophylaxis is controversial even in orthognathic surgery, which is a representative procedure for oral and maxillofacial surgery. There are reports show no increase in the incidence of infection without the administration of postoperative prophylactic antibiotics.[9],[10] On the other hand, there are reports to suggest the necessity of continuous antibiotic administration.[11] However, orthognathic surgery is mainly performed on young patients without a specific medical history. Moreover, the number of factors associated with the development of postoperative wound infections decreases as the procedure becomes more generalized and its technique advances.<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"1868\"><p>The aims of this clinical study were to evaluate the prevalence of postoperative wound infections with or without antibiotic prophylaxis after orthognathic surgery in young patients without any specific medical history, and to identify criteria for appropriate use of prophylactic antibiotics in orthognathic surgery.<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"2187\"><h2>PATIENTS AND METHODS<\/h2>\n<p>Fifty-six patients in their 20s without a specific medical history, and who were to undergo orthognathic surgical procedures at the department of oral and maxillofacial surgery at the dental hospital of Yonsei University were enrolled in this study. A horizontal maxillary osteotomy and vertical ramus mandibular osteotomy were performed by the same oral surgeon with the aid of trained nurses and residents under hypotensive general anesthesia. No bone grafts were performed. The duration of surgery was less than 5 hours. During surgery, maxillomandibular fixation was placed using steel wires, and drainage tubes were placed on both sides of the mandible. The drainage tubes were removed 2 days after surgery. The wires used for maxillomandibular fixation were removed and the sutures were taken out from the wounds 7 days after surgery. The patients received a non-steroid anti-inflammatory drug (Ketorolac trometamine 30 mg) intramuscularly immediately after surgery and every 6 hours until the next day. Compression bandages and ice packs were applied to the facial area until the second day after surgery.<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"3325\"><p>The 56 patients were divided into 2 groups according to the randomization codes generated by Microsoft Excel: an experimental and control group. The patients in the experimental group received only 1.0 g of a third-generation cephalosporin (Cefpiramide) intravenously 30 minutes before surgery and did not receive the placebo. The control group also received 1.0 g of Cefpiramide 30 minutes before surgery as well as twice daily until 3 days after surgery. The patients were evaluated every day during the first 3 days and at the end of the 1st and 2nd week after surgery for any postoperative infections in reference to the criteria for defining a surgical site infection (SSI), recommended by the Centers for Disease Control and Prevention (CDC).[12] Postoperative wound infection was defined by at least 1 of the following criteria:<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"4162\"><p>Statistical analysis was performed using a \u03c7\u00b2-test on the Statistical Package for the Social Sciences (SPSS for windows, ver. 12.0, SPSS Inc., Chicago, IL, USA). The study protocol was approved by the Institutional Review Board of the College of Dentistry, Yonsei University (YUDC).<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"4446\"><h2>RESULTS<\/h2>\n<p>The mean (SD) age of the experimental group was 23.9 years (5.84) with male-female ratio of 4 : 3. The average duration of surgery was 3 hours and 40 minutes. The mean (SD) age of the control group was 24.3 years (6.33) with male-female ratio of 1 : 1. The average duration of surgery was 3 hours and 55 minutes.<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"4771\"><p>There were 3 infections in the experimental group and 2 infections in the control group, observed 2 weeks after surgery (Table 1). One patient in the experimental group was diagnosed with an infection by facial swelling, redness and sinus haziness in the waters' view, and the other 4 patients were diagnosed with a postoperative infection by swelling and redness, and pain on the mandibular area. Therefore, the wounds were opened by a surgeon and the patients were treated with antibiotics. However, only 1 patient in the control group developed wound dehiscence only without any drainage, fever, or swelling in the maxillary area. According to the \u03c7\u00b2-test, there was no significant difference in the prevalence of postoperative wound infections between the patients who had received postoperative prophylactic antibiotic administration and those who had not (p = 0.639).<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"5646\"><p>[Table 1: Results according to the Postoperative Antibiotic Prophylaxis \u2014 image only, no cells; see tables]<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"5755\"><h2>DISCUSSION<\/h2>\n<p>The method of antibiotic prophylaxis is determined by an evaluation of the patient, procedure, and surgical wound. The preoperative and immediate postoperative administration of antibiotics is a method generally used for antibiotic prophylaxis in almost all surgical procedures. However, antibiotics are continuously used postoperatively in most procedures because it is difficult to assess the factors associated with postoperative wound infections or appropriate antibiotic prophylaxis method.<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"6266\"><p>On the other hand, orthognathic surgery is mainly performed on young patients without an underlying illness or comorbidity. Moreover, the number of factors affecting the development of postoperative wound infections decreases with the improvement of the surgical instruments, materials, techniques, and more generalized procedure.<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"6598\"><p>Peterson[13] suggested that the prophylactic antibiotic administration for postoperative wound infections in oral and maxillofacial surgery should be performed if there is a strong probability of infection, and appropriate antibiotics must be given in high-dose but for only a short period of time. Orthognathic surgeries are classified as clean contaminated procedures with postoperative wound infection of 10% to 15%, and Peterson[13] reported that an incidence of an anticipated infection in oral clean contaminated surgery could be reduced by using prophylactic antibiotics. Zijderveld et al.[14] suggested that the incidence of postoperative infections (52.6%) increased without the administration of prophylactic antibiotics. Martis and Karabouta[9] suggested that the routine use of prophylactic antibiotics in orthognathic surgery is unnecessary, and Lindeboom et al.[15] also suggested that the use of postoperative prophylactic antibiotics (clindamycin) is unnecessary in orthognathic surgery (SSRO). Furthermore, Fridrich et al.[16] and Baqain et al.[17] suggested that the long-term use of antibiotics does not decrease the frequency of postoperative infections. However, wide range of patient's age, small group size, and various osteomies may cause difficulties when precisely evaluating the efficacy of prophylactic antibiotics.<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"7943\"><p>Therefore, this study was undertaken to examine the prevalence of postoperative wound infections in young patients after orthognathic surgery (Le Fort I osteotomy and bilateral intraoral vertical ramus osteotomy) with or without the use of postoperative prophylactic antibiotics. Twenty eight patients were enrolled in each group. The samples were selected at a significance level of \u03b1= 0.05 and a test power \u03b2= 0.20. A smaller infection rate was set to 5%, and the difference in the estimated infection rate was set to 30%, based on previous report that the incidence of postoperative wound infection using prophylactic antibiotics, ranges from 5.6% to 33.4%.[17] In this study, wound infections were observed in both groups, however, the number was small. This was attributed to the followings: the patients were young without a specific medical history, patients had no preoperative wound infections, no bone graft had been performed during surgery, the surgical procedures such as IVRO were less traumatic with a short duration, the tissue trauma during surgery was minimal due to the systematization of orthognathic surgery and the improvement of techniques, and wound control such as postoperative blood or exudate was properly performed.<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"9189\"><p>The types of antibiotics used are important factors to consider for prophylactic antibiotic treatment. Penicillin is the representative antibiotic used as a prophylaxis during intraoral surgery and for the primary treatment of dental infections. Spaey et al[18] suggested the use of amoxicillin-clavulanate along with drain usage during SSRO in a study of antibiotic administration. In this study, third-generation cephalosporin antibiotics were administered before surgery, which is believed to be a possible prophylactic antibiotic that may be used in orthognathic surgery because most bacteria cultured during a dental infection are susceptible to third-generation cephalosporin.[19] There has been an increase in infections due to anaerobic and Gram-negative organisms,[20] and most wound infections after orthognathic surgery are caused by Gram negative bacteria.[21]<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"10063\"><p>If a post-operative wound infection occurs despite the effective prophylactic antibiotic administration before surgery, it could be concluded that the bacteria in the infected wound are not sensitive to the prophylactic antibiotics administered, and in such cases, an appropriate antimicrobial therapy should be determined by a culture test of the bacteria found in the infected region.[21],[22]<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"10460\"><p>Prophylactic antibiotics reduce the risk of postoperative wound infections, which leads to a lower number of hospitalization days, reduced cost, and improved social life. However, the long-term use of postoperative prophylactic antibiotics may lead to several problems, such as various allergic reactions, increased cost, changes in resident bacterial colony in vivo, or appearance of resistant bacteria.[7],[23]<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"10874\"><p>More studies with much larger numbers of patients are needed on the administration of prophylactic antibiotics during orthognathic surgery and other oral and maxillofacial procedures. In addition, further research on properly appropriated use of antibiotic prophylaxis is warranted in order to minimize the use of prophylactic antibiotics and their adverse effects and problems. In the present study, there was no significant difference in the prevalence of postoperative wound infections between patients who had received postoperative prophylactic antibiotic administration and those who did not. Therefore, prolonged prophylactic antibiotic use after orthognathic surgery may not be necessary, provided that there are no other significant factors for wound infections.<\/p><\/div>\n<div class=\"blk\" data-src-offset=\"11647\"><h2>References<\/h2><\/div>\n<div class=\"blk\" data-src-offset=\"11662\"><h1>References<\/h1><\/div>\n<div class=\"blk\" data-src-offset=\"11676\"><ol>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<li>[no author]<\/li>\n<\/ol><\/div>", "source_is_extraction": true, "note": "Publisher XML has no pages -- `page` is null on every table it carries, and inventing one would put a fabricated citation in a finding. Note what this pane can and cannot show you here: both sides are drawn from the same XML, so they check that the GRID survived (columns, merged cells, footnotes) and they cannot check the XML against the printed article. F
